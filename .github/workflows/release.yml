name: release

# release-please opens and maintains a release PR from the Conventional Commit titles
# that land on `main`. The PR bumps every version copy validate_versions compares and
# writes the CHANGELOG.md section. Merging it makes the next run of this workflow create
# the `vX.Y.Z` tag and the GitHub Release. Nothing else creates releases: a tag pushed by
# hand triggers no workflow.
#
# The release is created here rather than by a workflow reacting to the tag, because
# `check-all` has to pass on the exact tree being released. release-please only runs
# after `check-all` passes on the same commit, and only creates a release when that
# commit is the release PR's merge, so a release is never created from a tree that
# fails it.

on:
  # For re-running release-please after a transient failure. A manual run still goes
  # through `validate` first, and the release step still only fires on a release merge.
  workflow_dispatch:
  push:
    branches: [main]

# Never cancelled: a cancelled run between tag creation and release creation would
# leave a tag without its release. Note that a *pending* run is still replaced when a
# newer one queues; see "Recovering a release" in CONTRIBUTING.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run all checks
        run: make check-all

  release-please:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write # release-please manages PR labels via the Issues API
      pull-requests: write
    steps:
      # release-please creates a release for *any* merged release PR still labelled
      # `autorelease: pending`, and tags that PR's merge commit -- not the commit this
      # run validated. Left alone, a release merge whose `validate` failed would be
      # released by the next green push, from the tree that failed. So the release step
      # runs only when the commit this run validated is itself the release PR's merge.
      - name: Is this commit a release PR merge?
        id: release-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pending=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[]
            | select(.merged_at != null)
            | select(any(.labels[]; .name == "autorelease: pending"))] | length')
          echo "is-release-merge=$([ "$pending" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN, so `check` on the release PR waits for a maintainer to approve it.
      # CONTRIBUTING ("Repository setup") records why that trade was taken.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
          skip-github-release: ${{ steps.release-merge.outputs.is-release-merge != 'true' }}

      # Bumping `.ai-rulez/config.toml` changes the source hash that `.ai-rulez-generated.json`
      # and every generated Markdown header record, which release-please cannot compute.
      # Without this the release PR fails `ai-rulez verify --plugin`. release-please
      # force-pushes its branch whenever it rewrites the PR, dropping this commit, and it
      # reports the PR as created or updated exactly then -- so the commit is re-added on
      # every run that removed it.
      - name: Check out the release PR branch
        if: steps.release-please.outputs.prs_created == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.release-please.outputs.prs_created == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Regenerate the host packages on the release PR branch
        if: steps.release-please.outputs.prs_created == 'true'
        # The raw output, parsed in the shell: a step's `env` is evaluated even when its
        # `if` is false, and `fromJSON` of the empty `pr` output -- a run that opened or
        # updated no PR, such as every release merge -- fails the job.
        env:
          PR: ${{ steps.release-please.outputs.pr }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          make generate
          if [ -z "$(git status --porcelain)" ]; then
            echo "generated output already matches the bumped version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: regenerate host packages for the release"
          git push origin "HEAD:$BRANCH"
