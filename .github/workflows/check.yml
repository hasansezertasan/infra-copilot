name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Key is per-job on purpose. A shared key made both jobs race for one immutable
      # entry: the fast one saved first with only ai-rulez and markdownlint in it, and
      # the smoke job then found a hit and never saved the slow skills download — so it
      # paid for that download on every run.
      - name: Cache npx downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-validate-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: npm-validate-${{ runner.os }}-
      - name: Run all checks
        run: make check

  # Separate job because it downloads the skills installer from the npm registry. On #43
  # the tests finished in 65s and that download took 421s, so keeping it inside `check`
  # put a 7-minute tail on every pull request. Failing here still blocks the merge.
  smoke-opencode:
    name: Smoke-test the OpenCode payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache npx downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-smoke-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: npm-smoke-${{ runner.os }}-
      - name: Smoke-test the OpenCode payload
        run: make smoke-opencode

  windows-paths:
    name: Validate portable paths (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate links and host adapters
        run: python scripts/validate.py
      - name: Test repository validators
        run: python -m unittest discover -s tests
