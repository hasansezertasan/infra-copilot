name: Check

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same jobs before it releases. There is no `push`
# trigger: a pull request is already checked by `pull_request`, so pushing to its
# branch would run everything twice, and a push to `main` is checked by the
# release workflow's call.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - run: npm ci
      - run: npm run check
      # What the template does not ship: markdownlint, the repository validator
      # and its tests.
      - run: npm run lint
      - run: npm run validate
      - run: npm test

  # Separate job so "the plugin installs" is its own signal, distinct from "the
  # payloads are valid", and so neither waits on the other.
  smoke-opencode:
    name: Smoke-test the OpenCode payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - run: npm ci
      - run: npm run smoke-opencode
      # Same job: it reuses the installer this job already downloaded.
      - run: npm run smoke-closure

  windows-paths:
    name: Validate portable paths (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - name: Validate links and host adapters
        run: python scripts/validate.py
      - name: Test repository validators
        run: python -m unittest discover -s tests
