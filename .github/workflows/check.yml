name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFRA_COPILOT_AI_RULEZ_VERSION: 4.11.3
      INFRA_COPILOT_SKILLS_VERSION: 1.5.23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate ai-rulez configuration
        run: npx --yes "ai-rulez@${INFRA_COPILOT_AI_RULEZ_VERSION}" validate
      - name: Verify committed plugin payloads
        run: npx --yes "ai-rulez@${INFRA_COPILOT_AI_RULEZ_VERSION}" verify --plugin
      - name: Validate links and host adapters
        run: python3 scripts/validate.py
      - name: Test repository validators
        run: python3 -m unittest discover -s tests
      - name: Smoke-test OpenCode installation
        run: |
          npx --yes "skills@${INFRA_COPILOT_SKILLS_VERSION}" add . --agent opencode --skill '*' -y --copy
          test "$(find .agents/skills -name SKILL.md | wc -l)" -eq 5
          test -f .agents/skills/infra-copilot/references/protocol.md
          test -f .agents/skills/infra-copilot/references/decisions.md.example

  windows-paths:
    name: Validate portable paths (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate links and host adapters
        run: python scripts/validate.py
      - name: Test repository validators
        run: python -m unittest discover -s tests
