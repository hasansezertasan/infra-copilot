name: upstream

# The shipped references cite external versions — a cf-terraforming coverage matrix, a
# worked mise.toml, a provider major. Nothing else notices when those fall behind, and a
# stale instruction is indistinguishable from operator error to someone mid-bootstrap.
#
# Not part of `check`: this needs network, and a rate limit must never fail a PR.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: upstream
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compare audited versions against upstream
        run: make check-upstream
