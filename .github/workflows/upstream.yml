name: upstream

# The shipped references cite external versions — a cf-terraforming coverage matrix, a
# worked mise.toml, a provider major — and call HCP API paths. Nothing else notices when
# those fall behind or disappear, and a stale instruction is indistinguishable from
# operator error to someone mid-bootstrap.
#
# Not part of `check`: this needs network, and a rate limit must never fail a PR.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: upstream
  cancel-in-progress: true

permissions: {}

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - name: Compare audited versions against upstream
        run: npm run check-upstream
