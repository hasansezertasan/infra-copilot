# Machine-readable manifest shared by the infra-copilot skills (setup/import/add/status).
#
# Read this alongside protocol.md and whichever action skill (setup/import/add/status)
# routes into it. An agent walks these steps
# top-to-bottom. On every run it FIRST executes each step's `check` to find where
# setup already is (resume protocol), then resumes at the first red check.
#
# Field contract
#   id        stable slug, referenced by SKILL.md
#   phase     0..6, matches SKILL.md phases
#   provider  hcp | cloudflare | github | gcp | repo
#   actor     AGENT  -> agent executes directly
#             HUMAN  -> agent STOPS, emits the handoff block (see SKILL.md), waits
#                       for "done", then runs `check` before continuing
#   title     one line
#   why       what this unblocks (goes in the handoff block's "Why:")
#   run       AGENT steps: the command(s) the agent runs
#             HUMAN steps: the human_action text (browser instructions)
#   tri_state optional. `true` means this check reserves exit 2 for "could not verify"
#             (see protocol.md). Absent/false: any non-zero exit is red, which is the
#             default because ordinary tools use 2 for their own errors — jq exits 2 on
#             a missing input file.
#   check     command whose success (exit 0) means the step is DONE. Idempotent.
#             `null` means "no scriptable check — prove it via the next plan".
#   produces  the artifact/credential this step yields
#   docs      canonical section to read for the fine print — a path relative to
#             references/ (this file's dir), e.g. docs/setup.md#... or cloudflare.md
#
# RUNNER SETUP — the fields below (org, hcp_api, …) are YAML metadata, NOT shell
# variables. Before running any `check`/`run`, the agent MUST source the repo-local
# config per config.md's Step 0: read .infra-copilot/config.md from the consuming
# repo and export the vars every command below actually references:
#     export ORG=<hcp_org>
#     export GITHUB_ORG=<github_org>
#     export DOMAIN=<apex_domain>
#     export CF_ACCOUNT_ID=<cloudflare_account_id>
#     export CF_ZONE_ID=<cloudflare_zone_id>
#     export REPO=<managed_repos[0]>
#     export HCP_STATUS_CHECK_ID=<hcp_status_check_id>
#     export ADDITIONAL_PROVIDER_NAMES='<additional_providers names as compact JSON>'
#     export ADDITIONAL_PROVIDER_WORKSPACES='<additional_providers workspaces as compact JSON>'
#     export hcp_api=https://app.terraform.io/api/v2
#     export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' ~/.terraform.d/credentials.tfrc.json)}
# Phase 6 runs its inventory once, then instantiates the remaining steps per entry:
#     export NEW_PROVIDER=<entry.name>
#     export NEW_PROVIDER_WORKSPACE=<entry.workspace>
#     export NEW_PROVIDER_MISE_TOOLS='<entry.mise_tools as compact JSON>'
#     export NEW_PROVIDER_MISE_CONFIG_BLOB=<entry.mise_config_blob>
#     export NEW_PROVIDER_MISE_LOCK_BLOB=<entry.mise_lock_blob>
# The once-per-phase inventory also receives every declared provider tool:
#     export ADDITIONAL_PROVIDER_MISE_TOOLS='<all entry.mise_tools flattened as compact JSON>'
#     export NEW_PROVIDER_FORK_PLANS_DISABLED=<entry.fork_speculative_plans_disabled>
#     export NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID=<entry.fork_speculative_plans_workspace_id>
#     export NEW_PROVIDER_CREDENTIALS_VERIFIED_AT=<entry.credentials_verified_at>
#     export NEW_PROVIDER_CREDENTIALS='<entry.credential_variables as compact JSON>'
# Preflight exports TERRAFORM_VERSION from the validated repository pin before any
# Phase 1 workspace check or run uses it.
# Never guess or invent these values — if the config file is missing, treat it as a
# HUMAN step per config.md. See the "Configuring for your org" section in SKILL.md.

org: $ORG  # sourced from config — see config.md
domain: $DOMAIN  # sourced from config — see config.md
hcp_api: https://app.terraform.io/api/v2
# managed_repos come from .infra-copilot/config.md (see config.md) — not hardcoded here.

# TOOLCHAIN CONTRACT — pinned, not merely present.
#
# The requirement: the consuming repo pins its tool versions in `mise.toml`, commits
# that file and `mise.lock`, and matches what HCP runs. The checks read the named
# repository file explicitly; `mise current` is intentionally not used because it
# reports active user/global configuration as well as repository configuration.
#
#   pin    exact key in the committed file that records the pin.
#   check  exit 0 == the running binary exactly matches that committed pin.
#
# The lock check enumerates the `[tools]` keys of the committed file and dry-runs a
# locked install over exactly those. Naming a fixed list would leave conditionally
# added tools (gcloud, cf-terraforming) unvalidated, and running `mise install`
# with no tool arguments would pull in user/global config — the same leak that
# rules out `mise current`.
#
# It also asserts every configured *value* is an exact version. The per-tool checks
# below only cover terraform/gh/jq/gcloud, so without this an import-added pin such
# as cf-terraforming could sit at `latest` or a range, pass a refreshed lock, and
# still report a healthy exact-pin contract. Any value this cannot read as an exact
# version fails closed — a table-form entry has to be rewritten as a plain pin.
preflight:
  - tool: mise
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      repo_dir=$(pwd -P) &&
      mise trust --show 2>/dev/null | grep -Fx "$repo_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s\n' "$pinned" |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1 || exit 1;
      done
  - tool: terraform
    pin: mise.toml#tools.terraform
    check: >-
      ver=$(terraform version -json 2>/dev/null | jq -r '.terraform_version // empty');
      pin=$(mise config get --file ./mise.toml tools.terraform 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: gh
    pin: mise.toml#tools.gh
    check: >-
      ver=$(gh --version 2>/dev/null | head -1 | awk '{print $3}');
      pin=$(mise config get --file ./mise.toml tools.gh 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: jq
    pin: mise.toml#tools.jq
    check: >-
      ver=$(jq --version 2>/dev/null | sed 's/^jq-//');
      pin=$(mise config get --file ./mise.toml tools.jq 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: gcloud
    when: >-
      printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" |
      jq -e 'index("gcloud") != null' >/dev/null
    pin: mise.toml#tools.gcloud
    check: >-
      if ! printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" |
      jq -e 'index("gcloud") != null' >/dev/null; then exit 0; fi;
      ver=$(gcloud version --format=json 2>/dev/null |
      jq -r '."Google Cloud SDK" // empty' | tr -d '[:space:]');
      pin=$(mise config get --file ./mise.toml tools.gcloud 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: infra-copilot-references
    check: 'test -n "$INFRA_COPILOT_REFERENCES" && test -d "$INFRA_COPILOT_REFERENCES/checks"'
    why: >-
      Steps whose check is a shipped script resolve it from this path, because a check
      runs with the consuming repo as its working directory. Unset, the step runs
      sh "/checks/..." and fails with a bare shell error — and the script's own
      "export it per config.md" diagnostic is inside the file that could not be found.
    human_action: >-
      Export INFRA_COPILOT_REFERENCES per references/config.md: the absolute path to the
      loaded skill's references/ directory (the one holding config.md and checks/).

  - tool: curl
    check: "curl --version >/dev/null"   # system-provided; pinning it buys nothing

steps:
  # ── Phase 0 — HCP bootstrap ─────────────────────────────────────────────
  - id: toolchain-pin
    phase: 0
    provider: repo
    actor: HUMAN
    title: Create and commit the pinned mise.toml + mise.lock
    why: Preflight and every per-tool check compare installed binaries against these pins; nothing else creates them.
    run: |
      1. Follow docs/setup.md#6-local-development to choose exact tool versions and
         author mise.toml. Choosing the versions is a project decision, not a lookup.
      2. Review the entire mise.toml before trusting it; repository config can enable
         templates, plugins, and other executable behavior.
      3. Trust it, initialize and populate mise.lock, install the locked pins, and
         activate the installed toolchain using the exact sequence in that guide.
      4. Commit mise.toml and mise.lock together, then reply `done` so the agent can
         re-run this check.
    # Keep this byte-for-byte identical to the mise preflight check. The repository
    # validator enforces that invariant so the step and fail-fast gate cannot drift.
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      repo_dir=$(pwd -P) &&
      mise trust --show 2>/dev/null | grep -Fx "$repo_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s\n' "$pinned" |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1 || exit 1;
      done
    produces: committed mise.toml + mise.lock
    docs: docs/setup.md#6-local-development

  - id: repo-config-sync
    phase: 0
    provider: repo
    actor: HUMAN
    title: Synchronize repository configuration
    why: A template helper may need to copy canonical public identifiers into tool-required literal fields, but repository-controlled code must be reviewed before it runs.
    run: |
      1. If `./scripts/sync-config.sh` or `.infra-copilot/config.md` is absent, there is nothing to synchronize.
      2. Review `./scripts/sync-config.sh` in full before trusting it.
      3. Run it yourself from the repository root.
      4. Review the resulting diff, then commit `.infra-copilot/config.md` and both
         Terraform `versions.tf` files together.
      5. Reply `done`; the agent verifies the committed synchronized state.
    check: >-
      if test ! -x ./scripts/sync-config.sh || test ! -f .infra-copilot/config.md; then exit 0; fi;
      git ls-files --error-unmatch .infra-copilot/config.md terraform/cloudflare/versions.tf terraform/github/versions.tf >/dev/null 2>&1 &&
      git diff --quiet HEAD -- .infra-copilot/config.md terraform/cloudflare/versions.tf terraform/github/versions.tf &&
      git diff --cached --quiet HEAD -- .infra-copilot/config.md terraform/cloudflare/versions.tf terraform/github/versions.tf &&
      for config_file in terraform/cloudflare/versions.tf terraform/github/versions.tf; do
      test -f "$config_file" && grep -Eq "^[[:space:]]*organization[[:space:]]*=[[:space:]]*\"$ORG\"[[:space:]]*$" "$config_file" || exit 1;
      done
    produces: committed repository literals synchronized from `.infra-copilot/config.md`
    docs: config.md

  - id: hcp-login
    phase: 0
    provider: hcp
    actor: HUMAN
    title: Sign up and terraform login (mint the pivot HCP token)
    why: This browser login yields the API token needed to verify the organization and drive every later API step.
    run: |
      1. If needed, sign up at https://app.terraform.io/ (free tier is enough to start).
      2. Run locally: terraform login
      3. Approve in the browser tab it opens. The token is written to
         ~/.terraform.d/credentials.tfrc.json. This is the last interactive HCP CLI
         authentication; later providers still require their own human authorization or credential entry.
      4. Reply `done`; the agent re-exports HCP_TOKEN before checking the next step.
    # Accepts either credential source, in terraform's own precedence order. A
    # file-only check marked phase 0 red for anyone following hcp-apply-scope's
    # environment-variable route, and setup then told them to run `terraform login`
    # again -- recreating the apply-capable user token that step exists to remove.
    check: >-
      test -n "${TF_TOKEN_app_terraform_io:-}"
      || jq -e ".credentials[\"app.terraform.io\"].token | strings | length > 0"
      ~/.terraform.d/credentials.tfrc.json >/dev/null 2>&1
    produces: an HCP account and an API token terraform can use
    docs: docs/setup.md#1-hcp-terraform--organization

  - id: hcp-signup
    phase: 0
    provider: hcp
    actor: HUMAN
    title: Create HCP Terraform org and project
    why: HCP holds all state and secrets; nothing plans without it.
    run: |
      1. Open https://app.terraform.io/ after completing hcp-login.
      2. Create an organization named exactly `<your ORG slug>` (see config.md).
      3. Inside it, create a project named `infra`.
    # Assert the project too, not just the org: this step produces both, and an org
    # without `infra` fails later workspace work with a far less obvious error.
    # filter[names] is case-insensitive, so re-assert the exact name in jq.
    check: |
      test -n "$HCP_TOKEN" || exit 1
      curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '.data.id' >/dev/null || exit 1
      curl -sf "$hcp_api/organizations/$ORG/projects?filter%5Bnames%5D=infra" \
        -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '[.data[] | select(.attributes.name == "infra")] | any' >/dev/null
    produces: HCP org `$ORG`, project `infra`
    docs: docs/setup.md#1-hcp-terraform--organization

  - id: hcp-verify
    phase: 0
    provider: hcp
    actor: AGENT
    title: Confirm HCP API reachable
    why: Gate — the rest of this skill is HCP API calls.
    run: |
      # Same precedence as config.md Step 0. Reading only the credentials file
      # sent an empty bearer token when TF_TOKEN_app_terraform_io was the only
      # credential, which hcp-apply-scope's environment route makes a real case.
      export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' ~/.terraform.d/credentials.tfrc.json)}
      curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" | jq -e '.data.id'
    check: 'curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" | jq -e ".data.id"'
    produces: verified API access
    docs: docs/state.md#api-access

  # ── Phase 1 — HCP workspaces ────────────────────────────────────────────
  - id: vcs-connect
    phase: 1
    provider: hcp
    actor: HUMAN
    title: Connect GitHub to HCP via OAuth
    why: Workspaces need a VCS provider to run speculative plans on PRs.
    run: |
      In HCP -> org Settings -> Version Control / VCS Providers, connect GitHub via OAuth,
      scoped to this repo only. Note the oauth-token id if the agent will script workspace creation.
    # Assert a GitHub-family VCS provider specifically, not just "any oauth client" —
    # otherwise a pre-existing GitLab/Bitbucket connection would false-green this step.
    # Tri-state, because this endpoint is organization-scoped and the plan-only
    # credential hcp-apply-scope installs cannot read it. Without the distinction a
    # resume scan stops here on the first non-zero check and re-emits the OAuth
    # handoff, so `setup` could never resume past phase 1 after that handoff -- and
    # the human would be told to redo a step that is already done. A 403 proves
    # nothing about whether the VCS connection exists, which is exactly a 2.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: |
      # Checked before any credential is sent. $hcp_api is exported by Step 0, so
      # a mistyped or edited value would put a bearer token in a request to an
      # arbitrary host -- in plaintext if the scheme were http. hcp-apply-scope
      # guards this for its own requests; these are separate ones.
      [ "$hcp_api" = "https://app.terraform.io/api/v2" ] \
        || { echo "CANNOT VERIFY: \$hcp_api is '$hcp_api', not https://app.terraform.io/api/v2; refusing to send an HCP credential to an unexpected endpoint" >&2; exit 2; }
      body=$(mktemp); trap 'rm -f "$body"' EXIT
      # Paginated: an organization with enough VCS clients pushes its GitHub one
      # onto a later page, and reading only the first concluded "no GitHub
      # client" and re-emitted the OAuth handoff for a connection that exists.
      oauth_page=1
      while : ; do
        code=$(curl -s -o "$body" -w '%{http_code}' \
          "$hcp_api/organizations/$ORG/oauth-clients?page%5Bsize%5D=100&page%5Bnumber%5D=$oauth_page" \
          -H "Authorization: Bearer $HCP_TOKEN") \
          || { echo "CANNOT VERIFY: the request for $ORG's oauth-clients did not complete (curl exit $?) — DNS, TLS, a timeout, or an unwritable temporary file" >&2; exit 2; }
        [ "$code" = 200 ] || break
        # jq -e exits 4 on empty input and 5 on invalid JSON, and this step is
        # tri-state: protocol.md honours 0, 1 and 2 only, so `exit $?` would
        # surface those as an unexpected code instead of a stated cause.
        jq -e '[.data[] | select(.attributes["service-provider"] | test("github"))] | length > 0' \
          "$body" >/dev/null 2>&1
        rc=$?
        case "$rc" in
          0) exit 0 ;;
          1) : ;;   # not on this page; keep paging
          *) echo "CANNOT VERIFY: $ORG's oauth-clients response could not be parsed (jq exit $rc)" >&2; exit 2 ;;
        esac
        # A page shorter than the requested size is the last one, whatever the
        # metadata says -- so total-pages is only consulted when a page comes
        # back full. meta.pagination is not a required field in HCP's schema,
        # and demanding it unconditionally would have reported CANNOT VERIFY for
        # every organization whose response omits it.
        oauth_count=$(jq -e '.data | length' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $ORG's oauth-clients response was not the expected JSON" >&2; exit 2; }
        [ "$oauth_count" -eq 100 ] || exit 1   # last page, no GitHub client anywhere
        oauth_pages=$(jq -er '.meta.pagination["total-pages"]
                      | if type == "number" and . == floor and . > 0
                        then (floor | tostring) else empty end' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $ORG's oauth-clients list filled a page but carried no positive-integer total-pages, so later pages could not be reached" >&2; exit 2; }
        [ "$oauth_page" -lt "$oauth_pages" ] || exit 1   # every page read, no GitHub client
        oauth_page=$((oauth_page + 1))
      done
      case "$code" in
        401|403) ;;   # fall through to the workspace-scoped evidence below
        *) echo "CANNOT VERIFY: reading $ORG's oauth-clients returned $code" >&2; exit 2 ;;
      esac
      # The plan-only credential from hcp-apply-scope cannot read organization VCS
      # settings, and stopping here would leave `setup` unable to resume past phase 1
      # after that handoff. A workspace connected to $REPO is stronger evidence of the
      # same fact anyway -- it is the connection actually being used -- and it is
      # workspace-scoped, so the narrowed credential can read it. Only available once
      # workspaces exist, which on a resume they do.
      page=1
      while : ; do
        curl -sf "$hcp_api/organizations/$ORG/workspaces?page%5Bsize%5D=100&page%5Bnumber%5D=$page" \
          -H "Authorization: Bearer $HCP_TOKEN" >"$body" \
          || { echo "CANNOT VERIFY: this credential may not read $ORG's VCS settings ($code) and page $page of the workspace list could not be read either" >&2; exit 2; }
        # Require an actual VCS connection, by either mechanism. create_ws in
        # hcp.md connects through `oauth-token-id`, so requiring a GitHub App
        # installation id rejected every workspace this manifest provisions --
        # which put the fallback back into the exit-2 state it exists to avoid.
        #
        # This cannot establish the provider family: a workspace's vcs-repo
        # carries no service-provider field, and resolving the oauth token to its
        # client needs an organization-scoped read the narrowed credential does
        # not have. So an organization holding a GitLab workspace with the same
        # owner/name would satisfy this. Accepted deliberately: the primary path
        # above does check GitHub specifically, and this branch runs only after
        # the handoff, when phase 1 is complete and was verified under the user
        # token. Recorded in docs/policy.md's limits.
        if jq -e --arg repo "${REPO:-}" \
             '[.data[] | select(.attributes["vcs-repo"].identifier == $repo)
                       | select((.attributes["vcs-repo"]["oauth-token-id"] != null)
                                or (.attributes["vcs-repo"]["github-app-installation-id"] != null))]
              | length > 0' "$body" >/dev/null 2>&1; then
          exit 0
        fi
        pages=$(jq -er '.meta.pagination["total-pages"]
                        | if type == "number" and . == floor and . > 0
                          then (floor | tostring) else empty end' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: this credential may not read $ORG's VCS settings ($code), and the workspace list carried no positive-integer total-pages so later pages could not be reached" >&2; exit 2; }
        [ "$page" -lt "$pages" ] || break
        page=$((page + 1))
      done
      echo "CANNOT VERIFY: this credential may not read $ORG's VCS settings ($code), and no VCS-connected workspace for ${REPO:-<REPO unset>} is visible; if the plan-only identity is in use, phase 1 was verified under the user token" >&2
      exit 2
    produces: GitHub<->HCP OAuth connection
    docs: docs/setup.md#2-hcp-terraform--workspaces

  - id: workspaces-create
    phase: 1
    provider: hcp
    actor: AGENT
    title: Create cloudflare + github-org workspaces
    why: One workspace per leaf; carries working dir, path filter, safety toggles.
    run: |
      SOURCE OF TRUTH: the `create_ws` helper in hcp.md (Phase 1). Run that.
      The summary below is a reminder, not a second copy to maintain — if it disagrees
      with hcp.md, hcp.md wins. A POST to
      $hcp_api/organizations/$ORG/workspaces per workspace with:
        working-directory:   terraform/cloudflare  (and terraform/github)
        file-triggers-enabled: true
        trigger-patterns:    ["terraform/cloudflare/**", "terraform/modules/**", ".infra-copilot/config.md", "mise.toml"]  (and terraform/github/** plus the shared paths)
        execution-mode:      remote
        terraform-version:   $TERRAFORM_VERSION  # exact committed mise.toml pin
        auto-apply:          false
        auto-destroy-at:     null
        auto-destroy-activity-duration: null
        speculative-enabled: true       # plans on PRs
        vcs-repo:            identifier $REPO, oauth-token-id from vcs-connect, branch main
      Then in each workspace's UI -> Version Control, confirm FORK speculative plans are OFF
      (separate toggle, no clean create-time attribute; defaults off).
    # Assert every attribute the `run` block above declares. Checking only `auto-apply`
    # greens a workspace that plans the wrong directory, ignores path filters, runs
    # locally, skips PR plans, or points at the wrong repo or branch.
    check: |
      for pair in "cloudflare:terraform/cloudflare" "github-org:terraform/github"; do
        ws=${pair%%:*}; dir=${pair#*:}
        curl -sf "$hcp_api/organizations/$ORG/workspaces/$ws" -H "Authorization: Bearer $HCP_TOKEN" \
          | jq -e --arg dir "$dir" --arg repo "$REPO" --arg tf_version "$TERRAFORM_VERSION" '
              .data.attributes as $a
              | ($a["working-directory"] == $dir)
                and ($a["execution-mode"] == "remote")
                and ($a["terraform-version"] == $tf_version)
                and ($a["auto-apply"] == false)
                and ($a["auto-destroy-at"] == null)
                and ($a["auto-destroy-activity-duration"] == null)
                and ($a["speculative-enabled"] == true)
                and ($a["file-triggers-enabled"] == true)
                and ((($a["trigger-patterns"]) // []) | index($dir + "/**") != null)
                and ((($a["trigger-patterns"]) // []) | index("terraform/modules/**") != null)
                and ((($a["trigger-patterns"]) // []) | index(".infra-copilot/config.md") != null)
                and ((($a["trigger-patterns"]) // []) | index("mise.toml") != null)
                and (($a["vcs-repo"].identifier // "") == $repo)
                and (($a["vcs-repo"].branch // "") == "main")' >/dev/null || exit 1
      done
    produces: workspaces `cloudflare`, `github-org`
    docs: docs/state.md#workspaces

  # ── Phase 2 — Cloudflare ────────────────────────────────────────────────
  - id: cf-token
    phase: 2
    provider: cloudflare
    actor: HUMAN
    title: Mint Cloudflare token and paste into HCP
    why: The cloudflare workspace authenticates to Cloudflare with this token.
    run: |
      1. https://dash.cloudflare.com/profile/api-tokens -> Create Token -> Custom token.
      2. Permissions: Zone·DNS·Edit, Zone·Zone Settings·Edit  (add more as resources grow).
      3. Account Resources: your account. Zone Resources: Specific zone -> <apex-domain>.
      4. Copy the token (shown once).
      5. HCP -> workspace `cloudflare` -> Variables -> add `cloudflare_api_token`
         as a TERRAFORM variable, mark SENSITIVE, paste the value.
    check: |
      WS_ID=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/cloudflare" -H "Authorization: Bearer $HCP_TOKEN" | jq -r '.data.id')
      curl -sf "$hcp_api/workspaces/$WS_ID/vars" -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '[.data[]
            | select(.attributes.key == "cloudflare_api_token")
            | .attributes.category == "terraform" and .attributes.sensitive == true] | any' >/dev/null
    produces: sensitive var `cloudflare_api_token`
    docs: cloudflare.md

  # ── Phase 3 — GitHub App ────────────────────────────────────────────────
  - id: gh-app
    phase: 3
    provider: github
    actor: HUMAN
    title: Create + install GitHub App, paste creds into HCP
    why: The github-org workspace authenticates as a GitHub App (not a PAT).
    run: |
      1. Create the App under your org: https://github.com/organizations/<your-org>/settings/apps/new
         Permissions: Repo Administration(RW), Contents(R), Metadata(R), Pull requests(RW);
         Org Members(R), Administration(RW). Install: only on this account.
      2. Note the App ID. Generate a private key (.pem).
      3. Install on your org scoped to the repos in managed_repos (see config.md);
         note the Installation ID from the install URL.
      4. HCP -> workspace `github-org` -> Variables, add as TERRAFORM vars:
         github_owner=<your-org> (not sensitive),
         github_app_id (sensitive), github_app_installation_id (sensitive),
         github_app_pem = full PEM incl. BEGIN/END lines (sensitive).
    check: |
      WS_ID=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/github-org" -H "Authorization: Bearer $HCP_TOKEN" | jq -r '.data.id')
      curl -sf "$hcp_api/workspaces/$WS_ID/vars" -H "Authorization: Bearer $HCP_TOKEN" | jq -e '
        [.data[] | select(.attributes.category == "terraform") | .attributes] as $tf
        | ($tf | map(.key)) as $keys
        | ($tf | map(select(.sensitive == true) | .key)) as $sensitive
        | ((["github_app_id", "github_app_installation_id", "github_app_pem"] - $sensitive) | length) == 0
          and ((["github_owner"] - $keys) | length) == 0' >/dev/null
    produces: sensitive vars github_app_id / _installation_id / _pem, plus github_owner
    docs: github.md

  # ── Phase 4 — First plan ────────────────────────────────────────────────
  - id: hcp-apply-scope
    phase: 4
    provider: hcp
    actor: HUMAN
    title: The HCP credential this repo uses cannot apply
    why: >-
      docs/policy.md works through every host-level permission control and finds
      that none of them constrain this plugin: Bash denies are wrapped by
      `mise exec --`, Read denies do not govern subprocesses, and a Skill deny is
      reached around by the command. Narrowing the credential is the strongest
      control left, and `terraform login` mints a user token that can apply
      anything the operator can. It is not a boundary against a hostile actor:
      HCP treats plan as security-equivalent to write, because a plan runs the
      configuration's code with access to workspace variables and state. What it
      buys is the removal of the direct apply path, so an accidental apply takes
      deliberate steps. Nothing here applies — setup stops at speculative plans — but
      a repo bootstrapped by this plugin leaves its agent apply rights on
      production until someone narrows them. First step of phase 4, so the plan
      steps that follow already run under the narrowed credential — and, like
      every other HUMAN step, the scan stops here and hands off rather than
      continuing past it.
    run: |
      Replace the credential this machine offers HCP with a plan-only one. Do not
      merely export a second token: `terraform` never reads $HCP_TOKEN. It reads
      TF_TOKEN_app_terraform_io, or failing that
      ~/.terraform.d/credentials.tfrc.json, and the environment variable wins. A
      plan-only $HCP_TOKEN beside an apply-capable credentials file leaves the
      Terraform CLI fully able to apply, which is the path that matters.

      HCP separates the rights: a workspace's Plan permission covers "read, queue,
      and comment on Terraform plans" and excludes apply. A team token carries its
      team's workspace permissions, so:

        1. Create a team (Organization Settings -> Teams) with NO organization
           permissions.
        2. Grant it the *Plan* permission on every workspace this repo manages —
           not Write, which includes apply. Repeat this whenever `add` creates a
           new workspace, or plans there will fail for the plan-only identity.
        3. Create its token (Organization Settings -> API Tokens -> Team Tokens,
           or POST /teams/<id>/authentication-token).
        4. Put that token where terraform will find it — overwrite the token in
           ~/.terraform.d/credentials.tfrc.json, or export
           TF_TOKEN_app_terraform_io — and keep the user token off this machine.
           Step 0 resolves HCP_TOKEN in terraform's own order, preferring
           TF_TOKEN_app_terraform_io and falling back to the credentials file, so
           either route survives later runs and both agree with what `terraform`
           itself uses. Exporting the variable in one shell only is not enough:
           put it somewhere the agent's environment gets it every time.

      Phases 0 and 1 need the user token: a team token authenticates as a
      synthetic service account that cannot complete the personal OAuth flow
      `vcs-connect` requires. So this is a one-time handoff after phase 1, not a
      token you swap per command.

      `vcs-connect` handles this credential already. Its check reads
      /organizations/<org>/oauth-clients, which is organization-scoped and
      unreadable by a team token, so it falls back to looking for a workspace
      connected to $REPO — the connection actually in use. Expect it to stay
      green, or to report `?` if neither signal can be read; it will not go red
      merely because the credential narrowed.

      Do NOT grant the team "Manage version control settings" to turn it green.
      That is an organization permission, and organization permissions are the
      self-elevation risk this whole step exists to avoid — a team that can
      administer VCS settings is a team that can be given more. Re-verify phase 1
      with the user token if you need to, and leave the team's organization access
      empty.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: sh "$INFRA_COPILOT_REFERENCES/checks/hcp-apply-scope.sh"
    produces: an agent credential with no direct apply path (not a boundary against a hostile actor — see docs/policy.md)
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: plan-cloudflare
    phase: 4
    provider: cloudflare
    actor: AGENT
    title: init + speculative plan (terraform/cloudflare)
    why: Proves the Cloudflare token end-to-end.
    run: "cd terraform/cloudflare && terraform init && terraform plan"
    check: "cd terraform/cloudflare && terraform init -input=false >/dev/null && terraform plan -input=false >/dev/null"
    produces: green speculative plan for cloudflare
    docs: docs/hcp-api.md

  - id: plan-github
    phase: 4
    provider: github
    actor: AGENT
    title: init + speculative plan (terraform/github)
    why: Proves the GitHub App credentials end-to-end.
    run: "cd terraform/github && terraform init && terraform plan"
    check: "cd terraform/github && terraform init -input=false >/dev/null && terraform plan -input=false >/dev/null"
    produces: green speculative plan for github-org
    docs: docs/hcp-api.md

  - id: status-check-context
    phase: 4
    provider: github
    actor: AGENT
    title: Required status check context matches what HCP publishes
    why: >-
      A required context HCP no longer posts blocks every PR on
      "Expected — Waiting for status to be reported", forever, while every other
      check stays green.
    run: >-
      Read the context HCP actually published, then in
      terraform/github/branch_protection.tf replace ONLY the stale
      "Terraform Cloud/…" entry with it. Keep every other required context —
      terraform fmt and both terraform validate checks — exactly as they are;
      dropping them would allow merges with no CI at all. The stale context
      blocks the very PR carrying this fix, so follow the break-glass sequence
      in docs/ci.md.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: sh "$INFRA_COPILOT_REFERENCES/checks/status-check-context.sh"
    produces: proof that branch protection cannot silently block every PR
    docs: docs/ci.md#hcp-status-check-context

  # ── Phase 5 — Migration (only if resources pre-exist) ───────────────────
  - id: migrate-discovery-token
    phase: 5
    provider: cloudflare
    actor: HUMAN
    title: Mint short-lived read-only Cloudflare discovery token
    why: cf-terraforming reads existing resources; use a throwaway READ token, not the HCP edit token.
    run: |
      https://dash.cloudflare.com/profile/api-tokens -> Custom token -> READ scopes on each
      resource type to discover (DNS·Read, etc.), zone <apex-domain>, TTL a few hours. Copy the value.
    check: ~   # YAML null — ephemeral credential, no scriptable check (see header contract)
    produces: throwaway read token (deleted after import)
    docs: docs/import.md#discovery-token

  - id: migrate-import
    phase: 5
    provider: cloudflare
    actor: AGENT
    title: Generate HCL + import blocks, verify plan imports (not creates)
    why: Bring existing zone/records under management without recreating them.
    run: |
      Follow docs/import.md: cf-terraforming generate + import (--modern-import-block)
      into terraform/cloudflare/generated.tf, then terraform plan.
    # One plan, captured once to a private mktemp file (0600, auto-removed), not a fixed
    # world-readable /tmp path. Success = at least one import AND zero creates. (If a change
    # legitimately adds a new resource alongside the import, review by hand — this check
    # intentionally treats any 'will be created' as not-done.)
    check: |
      cd terraform/cloudflare
      p=$(mktemp)
      trap 'rm -f "$p"' EXIT
      terraform plan -input=false -no-color >"$p" 2>&1 \
        && grep -q 'will be imported' "$p" \
        && ! grep -q 'will be created' "$p"
    produces: generated.tf with import blocks; plan shows imports only
    docs: migration.md

  # ── Phase 6 — additional providers (parameterized; optional) ────────────
  # Run the inventory once, then instantiate the remaining sequence once per
  # config.md `additional_providers` entry.
  - id: new-provider-inventory
    phase: 6
    provider: repo
    actor: HUMAN
    title: Every additional Terraform leaf has a provider-adoption record
    why: An untracked leaf may be an interrupted adoption and must not disappear from resume scans.
    run: |
      For every terraform/<leaf> other than cloudflare and github, add a matching
      `additional_providers` entry to .infra-copilot/config.md. Record the decision
      and credential-variable inventory there; never delete an entry to hide red state.
    check: |
      jq -ne --argjson names "$ADDITIONAL_PROVIDER_NAMES" \
        --argjson workspaces "$ADDITIONAL_PROVIDER_WORKSPACES" '
          ($names | type == "array"
            and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
            and length == (unique | length)
            and index("cloudflare") == null
            and index("github") == null
            and index("modules") == null)
          and ($workspaces | type == "array"
            and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
            and length == (unique | length)
            and index("cloudflare") == null
            and index("github-org") == null)
          and ($names | length) == ($workspaces | length)' >/dev/null || exit 1
      declared_tools=$(printf '%s' "${ADDITIONAL_PROVIDER_MISE_TOOLS:-[]}" | jq -ce '
        select(type == "array")
        | select(all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:/+-]*$")))
        | unique') || exit 1
      if test -f mise.toml; then
        tools=$(mise config get --file ./mise.toml tools 2>/dev/null) || exit 1
        pinned=$(printf '%s\n' "$tools" |
          sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p')
        provider_tools=$(sed -n \
          's/^[[:space:]]*#[[:space:]]*infra-copilot:provider-cli[[:space:]]\{1,\}\([A-Za-z0-9][A-Za-z0-9_-]*\)[[:space:]]*$/\1/p' \
          mise.toml)
        general_tools=$(sed -n \
          's/^[[:space:]]*#[[:space:]]*infra-copilot:general-tool[[:space:]]\{1,\}\([^[:space:]]\{1,\}\)[[:space:]]*$/\1/p' \
          mise.toml)
        test "$(printf '%s\n' "$provider_tools" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$provider_tools" | sed '/^$/d' | wc -l | tr -d ' ')" || exit 1
        test "$(printf '%s\n' "$general_tools" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$general_tools" | sed '/^$/d' | wc -l | tr -d ' ')" || exit 1
        classified_tools=$(printf '%s\n%s\n' "$provider_tools" "$general_tools" | sed '/^$/d')
        test "$(printf '%s\n' "$classified_tools" | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$classified_tools" | wc -l | tr -d ' ')" || exit 1
        printf '%s\n' "$classified_tools" | while IFS= read -r tool; do
          test -z "$tool" && continue
          printf '%s\n' "$pinned" | grep -Fx "$tool" >/dev/null || exit 1
        done || exit 1
        printf '%s\n' "$pinned" | while IFS= read -r tool; do
          test -z "$tool" && continue
          case "$tool" in terraform|gh|jq|github:cloudflare/cf-terraforming) continue ;; esac
          printf '%s\n' "$classified_tools" | grep -Fx "$tool" >/dev/null || exit 1
        done || exit 1
        actual_tools=$(printf '%s\n' "$provider_tools" |
          jq -Rsc 'split("\n") | map(select(length > 0)) | unique') || exit 1
        jq -ne --argjson declared "$declared_tools" --argjson actual "$actual_tools" \
          '($actual - $declared | length) == 0' >/dev/null || exit 1
      fi
      for leaf in terraform/*/; do
        test -d "$leaf" || continue
        name=${leaf%/}; name=${name##*/}
        case "$name" in cloudflare|github|modules) continue ;; esac
        printf '%s' "$ADDITIONAL_PROVIDER_NAMES" \
          | jq -e --arg name "$name" 'index($name) != null' >/dev/null || exit 1
      done
    produces: complete durable inventory for every additional Terraform leaf
    docs: config.md

  - id: new-provider-decision
    phase: 6
    provider: repo
    actor: HUMAN
    title: Record the new-provider decision and its verification inventory
    why: A provider changes a locked design decision, and later runs need durable names for every check.
    run: |
      1. Add a row to .infra-copilot/decisions.md whose decision is exactly
         `Provider: <provider>`, choice is `adopt`, and status is `locked`.
      2. Add terraform/<provider> to terraform/README.md.
      3. Add an `additional_providers` entry to .infra-copilot/config.md with its
         lowercase name, HCP workspace, and every authentication variable's key,
         category, and sensitive flag. Inventory every workspace variable so undeclared
         credentials cannot survive a reused workspace. Record provider mise tools (or
         `[]`) and set `mise_config_blob: ""` and `mise_lock_blob: ""` until the HUMAN
         reviews the toolchain. Set
         `fork_speculative_plans_disabled: false` until that HUMAN check is performed.
         Set `fork_speculative_plans_workspace_id: ""` until the same check binds the
         attestation to the immutable HCP workspace identity.
         Set `credentials_verified_at: ""` until the credential handoff is complete.
         Never put a credential value in the repo.
      4. Reply `done`; the agent reloads config, exports NEW_PROVIDER,
         NEW_PROVIDER_WORKSPACE, and NEW_PROVIDER_CREDENTIALS, then re-runs this check.
    check: |
      printf '%s' "$NEW_PROVIDER" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || exit 1
      printf '%s' "$NEW_PROVIDER_WORKSPACE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || exit 1
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -e '
        type == "array"
        and all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$"))
        and length == (unique | length)' >/dev/null || exit 1
      if test -n "$NEW_PROVIDER_MISE_CONFIG_BLOB"; then
        printf '%s\n' "$NEW_PROVIDER_MISE_CONFIG_BLOB" \
          | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || exit 1
      fi
      if test -n "$NEW_PROVIDER_MISE_LOCK_BLOB"; then
        printf '%s\n' "$NEW_PROVIDER_MISE_LOCK_BLOB" \
          | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || exit 1
      fi
      case "$NEW_PROVIDER_FORK_PLANS_DISABLED" in true|false) : ;; *) exit 1 ;; esac
      if test -n "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID"; then
        printf '%s\n' "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID" \
          | grep -Eq '^ws-[A-Za-z0-9]+$' || exit 1
      fi
      if test -n "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT"; then
        printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
          | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
        printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
          . as $raw
          | (try fromdateiso8601 catch null) as $epoch
          | ($epoch != null)
            and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
            and ($epoch <= now)' >/dev/null || exit 1
      fi
      printf '%s' "$NEW_PROVIDER_CREDENTIALS" | jq -e '
        type == "array" and length > 0
        and all(.[];
          (.key | type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$"))
          and (.category == "env" or .category == "terraform")
          and (.sensitive | type == "boolean"))
        and length == (map(.category + "\u0000" + .key) | unique | length)' \
        >/dev/null || exit 1
      awk -F '|' -v provider="$NEW_PROVIDER" '
        function clean(value) {
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
          return tolower(value)
        }
        BEGIN { found=0; expected="provider: " tolower(provider) }
        clean($2) == expected && clean($3) == "adopt" && clean($4) == "locked" { found=1 }
        END { exit !found }
      ' .infra-copilot/decisions.md || exit 1
      grep -Eq "(^|[^A-Za-z0-9_-])terraform/$NEW_PROVIDER(/|[^A-Za-z0-9_-]|$)" \
        terraform/README.md || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md \
        .infra-copilot/decisions.md terraform/README.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md \
        .infra-copilot/decisions.md terraform/README.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md \
        .infra-copilot/decisions.md terraform/README.md
    produces: locked provider decision plus a non-secret verification inventory
    docs: config.md

  - id: new-provider-leaf
    phase: 6
    provider: repo
    actor: AGENT
    title: Create the new Terraform leaf
    why: The workspace and plan need committed provider configuration to target.
    run: |
      Create terraform/$NEW_PROVIDER with its
      versions, provider, and initial resource configuration. Its cloud block must
      select workspace $NEW_PROVIDER_WORKSPACE by name. Do not create resources
      before new-provider-decision is green. If the provider runbook requires a new
      CLI, add `# infra-copilot:provider-cli <key>` immediately before its exact
      same-name mise pin and refresh the lock, but do not execute the CLI or
      any later runbook commands until new-provider-toolchain is green. Commit the
      completed leaf, including the provider selections written to
      `.terraform.lock.hcl` by `terraform init -backend=false`, before re-running
      this check; untracked or dirty leaf files are red.
    check: |
      test -d "terraform/$NEW_PROVIDER" || exit 1
      settings=$(sh "$INFRA_COPILOT_REFERENCES/checks/leaf-cloud.sh" \
        "terraform/$NEW_PROVIDER" all)
      printf '%s\n' "$settings" | grep -Fx "workspaces.name=$NEW_PROVIDER_WORKSPACE" >/dev/null \
        || exit 1
      printf '%s\n' "$settings" | grep -Fx "organization=$ORG" >/dev/null || exit 1
      hostname=$(printf '%s\n' "$settings" | sed -n 's/^hostname=//p' | head -1)
      case "$hostname" in ""|app.terraform.io) : ;; *) exit 1 ;; esac
      git ls-files "terraform/$NEW_PROVIDER/*.tf" \
        "terraform/$NEW_PROVIDER/*.tf.json" | grep -q . || exit 1
      git ls-files --error-unmatch \
        "terraform/$NEW_PROVIDER/.terraform.lock.hcl" >/dev/null 2>&1 || exit 1
      test -z "$(git --no-optional-locks status --porcelain -- "terraform/$NEW_PROVIDER")"
    produces: terraform/$NEW_PROVIDER leaf targeting $NEW_PROVIDER_WORKSPACE
    docs: protocol.md#resume-protocol

  - id: new-provider-toolchain
    phase: 6
    provider: repo
    actor: HUMAN
    title: Review and trust the provider's changed executable toolchain
    why: A newly pinned provider CLI changes executable configuration after the initial setup trust gate.
    run: |
      Review the complete mise.toml diff and mise.lock URLs. If they are expected, record
      `git hash-object mise.toml` as this provider's `mise_config_blob` and
      `git hash-object mise.lock` as its `mise_lock_blob`, commit all four reviewed files,
      run `mise trust mise.toml`, then install every
      configured tool with `MISE_LOCKED=1` as documented in docs/setup.md. Reply
      `done`; the agent re-runs this check. Once every provider toolchain gate is
      green, it runs the complete preflight once per provider entry, exporting that
      entry's NEW_PROVIDER_MISE_TOOLS so its conditional provider CLI is verified.
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock .infra-copilot/config.md >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock .infra-copilot/config.md &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock .infra-copilot/config.md &&
      current_mise_blob=$(git hash-object -- mise.toml) &&
      current_mise_lock_blob=$(git hash-object -- mise.lock) &&
      [ "$NEW_PROVIDER_MISE_CONFIG_BLOB" = "$current_mise_blob" ] &&
      [ "$NEW_PROVIDER_MISE_LOCK_BLOB" = "$current_mise_lock_blob" ] &&
      repo_dir=$(pwd -P) &&
      mise trust --show 2>/dev/null | grep -Fx "$repo_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -r '.[]' |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      printf '%s\n' "$pinned" | grep -Fx "$tool" >/dev/null || exit 1;
      MISE_LOCKED=1 mise install --dry-run-code "$tool" >/dev/null 2>&1 || exit 1;
      pin=$(mise config get --file ./mise.toml "tools.$tool" 2>/dev/null | tr -d '[:space:]');
      active=$(MISE_LOCKED=1 mise which "$tool" --version 2>/dev/null | tr -d '[:space:]');
      resolved=$(MISE_LOCKED=1 mise which "$tool" 2>/dev/null) || exit 1;
      [ -n "$pin" ] && [ "$active" = "$pin" ] && [ -x "$resolved" ] || exit 1;
      MISE_LOCKED=1 mise exec "$tool" -- sh -c
      '[ "$(command -v "$1")" = "$2" ]' sh "$tool" "$resolved" || exit 1;
      done
    produces: human-reviewed, trusted, locked provider toolchain; complete preflight green
    docs: docs/setup.md#6-local-development

  - id: new-provider-lock
    phase: 6
    provider: repo
    actor: AGENT
    title: Verify committed selections for every required provider
    why: The trust gate must activate Terraform before lock validation, while HCP must not invent missing selections remotely.
    run: |
      After new-provider-toolchain and the complete preflight are green, inspect the
      committed dependency lock. If a required provider selection is missing, run
      `terraform init -backend=false` in terraform/$NEW_PROVIDER and commit the reviewed
      `.terraform.lock.hcl` before re-running this check.
    check: |
      provider_output=$(mktemp) || exit 1
      trap 'rm -f "$provider_output"' EXIT
      terraform -chdir="terraform/$NEW_PROVIDER" providers \
        >"$provider_output" 2>/dev/null || exit 1
      required_providers=$(sed -n 's/.*provider\[\([^]]*\)\].*/\1/p' \
        "$provider_output" | sort -u) || exit 1
      test -n "$required_providers" || exit 1
      printf '%s\n' "$required_providers" | while IFS= read -r provider; do
        case "$provider" in terraform.io/builtin/*) continue ;; esac
        awk -v target="$provider" '
          $1 == "provider" {
            address=$2; gsub(/^"|"$/, "", address)
            selected=(address == target); version=0; in_hashes=0; checksum=0
          }
          selected && $1 == "version" && $2 == "=" && $3 ~ /^"[^"]+"$/ { version=1 }
          selected && $1 == "hashes" && $2 == "=" && $3 == "[" { in_hashes=1 }
          selected && in_hashes && $1 ~ /^"(h1:|zh:)[^"]+",?$/ { checksum=1 }
          selected && /^}/ { complete=(version && checksum); selected=0 }
          END { exit !complete }
        ' "terraform/$NEW_PROVIDER/.terraform.lock.hcl" || exit 1
      done
    produces: committed lock selections and checksums for every required provider
    docs: protocol.md#resume-protocol

  - id: new-provider-workspace-bootstrap
    phase: 6
    provider: hcp
    actor: HUMAN
    title: Create the workspace and make it visible to the plan-only team
    why: A missing or invisible workspace is expected setup work, not an unverifiable terminal state.
    run: |
      Using a user or organization token yourself, load hcp.md's helpers, resolve the
      repository-specific OAuth token, create/configure the workspace, and grant the
      plan-only team `Plan` (never `Write`):

        load_tf_version
        resolve_oauth_token_id
        create_ws "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"
        set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"

      Restore the plan-only credential before replying `done`; this check distinguishes
      the expected missing/invisible state from network, authentication, and API failures.
    tri_state: true
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      code=$(curl -sS -o /dev/null -w '%{http_code}' \
        "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      case "$code" in
        200) exit 0 ;;
        404) exit 1 ;;
        *) exit 2 ;;
      esac
    produces: workspace exists and is visible to the restored plan-only credential
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: new-provider-workspace
    phase: 6
    provider: hcp
    actor: HUMAN
    title: Create and safely configure the new HCP workspace
    why: The leaf needs a remote, VCS-backed workspace with path-scoped plans and auto-apply disabled.
    run: |
      If this verification finds drift after Plan access is established, use a user or
      organization token yourself and run hcp.md's set_workspace_config helper (it
      reconciles every asserted setting, including an already-existing workspace):

        load_tf_version
        resolve_oauth_token_id
        set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"

      If the helper reports a mismatched existing working directory, inspect the named
      workspace ID first. Export `CONFIRM_WORKSPACE_ID` to that exact ID only when it is
      truly this provider's workspace; otherwise choose a different workspace name.
      Restore the plan-only credential before replying `done` so the agent can verify
      the settings without receiving your privileged token.
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      body=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      printf '%s' "$body" \
        | jq -e --arg dir "terraform/$NEW_PROVIDER" --arg repo "$REPO" --arg tf_version "$TERRAFORM_VERSION" '
            .data.attributes as $a
            | ($a["working-directory"] == $dir)
              and ($a["execution-mode"] == "remote")
              and ($a["terraform-version"] == $tf_version)
              and ($a["auto-apply"] == false)
              and ($a["auto-destroy-at"] == null)
              and ($a["auto-destroy-activity-duration"] == null)
              and ($a["speculative-enabled"] == true)
              and ($a["file-triggers-enabled"] == true)
              and ($a["queue-all-runs"] == false)
              and ($a["global-remote-state"] == false)
              and ((($a["trigger-patterns"] // []) | sort)
                   == ([$dir + "/**", "terraform/modules/**", ".infra-copilot/config.md", "mise.toml"] | sort))
              and (($a["vcs-repo"].identifier // "") == $repo)
              and (($a["vcs-repo"].branch // "") == "main")' >/dev/null
      rc=$?
      case "$rc" in
        0) exit 0 ;;
        1) exit 1 ;;
        *) exit 2 ;;
      esac
    tri_state: true
    produces: configured HCP workspace visible to the plan-only credential
    docs: hcp.md#phase-1--workspaces

  - id: new-provider-plan-access
    phase: 6
    provider: hcp
    actor: HUMAN
    title: Verify the plan-only team has Plan access and nothing stronger
    why: Workspace visibility alone does not prove that the credential can plan without applying or reconfiguring workspaces.
    run: |
      Using a user or organization token yourself, grant the plan-only team `Plan`
      (never `Write`) on $NEW_PROVIDER_WORKSPACE. Restore the plan-only credential
      before replying `done`; the repository-derived inventory then verifies that it
      can plan but cannot apply or update any workspace.
    tri_state: true
    check: HCP_SCOPE_WORKSPACE="$NEW_PROVIDER_WORKSPACE" sh "$INFRA_COPILOT_REFERENCES/checks/hcp-apply-scope.sh"
    produces: Plan access with no apply or workspace-update permission
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: new-provider-fork-safety
    phase: 6
    provider: hcp
    actor: HUMAN
    title: Confirm fork speculative plans are disabled before adding credentials
    why: The fork-specific UI toggle can expose sensitive workspace variables to untrusted fork code.
    run: |
      In HCP workspace $NEW_PROVIDER_WORKSPACE, open Settings -> Version Control and
      confirm speculative plans from forks are disabled. This is separate from the API's
      `speculative-enabled` attribute. Then set this provider entry's
      `fork_speculative_plans_disabled` value to `true` and record the workspace's
      immutable `ws-...` ID as `fork_speculative_plans_workspace_id`. Commit config.md,
      reload it, and reply `done` so the agent re-runs this durable attestation check.
    check: |
      test "$NEW_PROVIDER_FORK_PLANS_DISABLED" = "true" || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md || exit 1
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      body=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      actual_id=$(printf '%s' "$body" \
        | jq -er '.data.id | select(type == "string" and test("^ws-[A-Za-z0-9]+$"))' \
          2>/dev/null) || exit 2
      test "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID" = "$actual_id"
    tri_state: true
    produces: durable human attestation that fork plans cannot receive provider credentials
    docs: docs/setup.md#2-hcp-terraform--workspaces

  - id: new-provider-credentials
    phase: 6
    provider: hcp
    actor: HUMAN
    title: Put the provider credential configuration in HCP
    why: The first plan must authenticate without exposing credential values to the agent or repository.
    run: |
      Mint or configure the provider's least-privilege credential as its runbook
      requires. In HCP workspace $NEW_PROVIDER_WORKSPACE, reconcile every variable to
      the exact NEW_PROVIDER_CREDENTIALS inventory by key, category, and sensitive flag;
      delete undeclared leftovers before continuing. Detach any effective variable sets
      first; their inherited variables cannot be proven by this workspace-local inventory.
      Paste secret values yourself; never send them to the agent. Reply `done` so
      the agent can verify metadata through the vars API. After every declared variable
      is installed, record the current UTC time as `credentials_verified_at` in config.md
      using strict `YYYY-MM-DDTHH:MM:SSZ`, commit the config, and then reply `done`.
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      workspace_body=$(curl -sf \
        "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      WS_ID=$(printf '%s' "$workspace_body" \
        | jq -er '.data.id | select(type == "string" and length > 0)' 2>/dev/null) \
        || exit 2
      varset_body=$(curl -sf \
        "$hcp_api/workspaces/$WS_ID/varsets?page%5Bsize%5D=1&page%5Bnumber%5D=1" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      varset_count=$(printf '%s' "$varset_body" \
        | jq -er '.data | select(type == "array") | length' 2>/dev/null) || exit 2
      test "$varset_count" -eq 0 || exit 1
      pages=$(mktemp) || exit 2
      trap 'rm -f "$pages"' EXIT
      : >"$pages" || exit 2
      page=1
      while : ; do
        body=$(curl -sf \
          "$hcp_api/workspaces/$WS_ID/vars?page%5Bsize%5D=100&page%5Bnumber%5D=$page" \
          -H "Authorization: Bearer $HCP_TOKEN") || exit 2
        printf '%s' "$body" | jq -e '
          (.data | type == "array")
          and (.meta.pagination | type == "object")
          and ((.meta.pagination["next-page"] == null)
            or (.meta.pagination["next-page"]
              | type == "number" and . == floor and . > 0))' >/dev/null 2>&1 \
          || exit 2
        printf '%s\n' "$body" >>"$pages"
        next_page=$(printf '%s' "$body" \
          | jq -r '.meta.pagination["next-page"] // empty') || exit 2
        test -n "$next_page" || break
        test "$next_page" -eq $((page + 1)) || exit 2
        page=$next_page
      done
      jq -se --argjson expected "$NEW_PROVIDER_CREDENTIALS" '
        [.[].data[] | .attributes
          | {key: .key, category: .category, sensitive: .sensitive}]
          | sort_by(.category, .key) as $actual
        | ($expected
            | map({key: .key, category: .category, sensitive: .sensitive})
            | sort_by(.category, .key)) as $wanted
        | ($expected | type == "array" and length > 0)
          and ($actual == $wanted)' "$pages" >/dev/null || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
        | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
        . as $raw
        | (try fromdateiso8601 catch null) as $epoch
        | ($epoch != null)
          and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
          and ($epoch <= now)' >/dev/null || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md
    tri_state: true
    produces: exact declared workspace-variable metadata in HCP
    docs: docs/secrets.md

  - id: new-provider-plan
    phase: 6
    provider: repo
    actor: AGENT
    title: Run the first plan on the new leaf
    why: This proves the leaf, workspace access, and provider credentials end to end.
    run: |
      If the newest matching HCP run is `policy_soft_failed`, stop and emit a HUMAN
      handoff to review the policy result and either fix the configuration or explicitly
      override/discard it; do not queue another run while that decision is pending.
      Ensure the current non-main branch has an open pull request (a draft is enough;
      create one with `gh pr create --draft` when absent), then push the current
      committed branch to its configured upstream so HCP can ingest the branch tip;
      never push a dirty or detached checkout. Wait until the workspace's VCS run list
      contains an ingested commit whose `terraform/$NEW_PROVIDER`, shared
      `terraform/modules`, `.infra-copilot/config.md`, and `mise.toml` trees equal the
      current committed versions, then run
      `sh "$INFRA_COPILOT_REFERENCES/checks/hcp-current-plan.sh" queue` to queue a
      plan-only retry using that configuration version. The helper explicitly includes
      the configuration-version relationship in POST /runs; a CLI-driven or
      latest-configuration fallback run has no trustworthy commit correlation. Wait for
      the run to finish, then re-run this check.
    tri_state: true
    check: sh "$INFRA_COPILOT_REFERENCES/checks/hcp-current-plan.sh"
    produces: safe green plan, or a safe no-create plan after the adoption has applied resources
    docs: docs/hcp-api.md
