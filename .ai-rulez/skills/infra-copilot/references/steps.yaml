# Machine-readable manifest shared by the infra-copilot skills
# (setup/import/prune/add/status).
#
# Read this alongside protocol.md and whichever action skill (setup/import/prune/add/status)
# routes into it. An agent walks these steps
# top-to-bottom. On every run it FIRST executes each step's `check` to find where
# setup already is (resume protocol), then resumes at the first red check.
#
# Field contract
#   id        stable slug, referenced by SKILL.md
#   phase     0..6, matches SKILL.md phases
#   provider  hcp | cloudflare | github | gcp | repo
#   actor     AGENT  -> agent executes directly
#             HUMAN  -> agent STOPS, emits the handoff block (see SKILL.md), waits
#                       for "done", then runs `check` before continuing
#   title     one line
#   why       what this unblocks (goes in the handoff block's "Why:")
#   run       AGENT steps: the command(s) the agent runs
#             HUMAN steps: the human_action text (browser instructions)
#   when      optional shell condition. If present and evaluates false, skip this step.
#             Use for backend-specific steps: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
#   tri_state optional. `true` means this check reserves exit 2 for "could not verify"
#             (see protocol.md). Absent/false: any non-zero exit is red, which is the
#             default because ordinary tools use 2 for their own errors — jq exits 2 on
#             a missing input file.
#   check     command whose success (exit 0) means the step is DONE. Idempotent.
#             `null` means "no scriptable check — prove it via the next plan".
#   produces  the artifact/credential this step yields
#   docs      canonical section to read for the fine print — a path relative to
#             references/ (this file's dir), e.g. docs/setup.md#... or cloudflare.md
#
# RUNNER SETUP — the fields below (org, hcp_api, …) are YAML metadata, NOT shell
# variables. Before running any `check`/`run`, the agent MUST source the repo-local
# config per config.md's Step 0: read .infra-copilot/config.md from the consuming
# repo and export the vars every command below actually references.
#
# Common vars (both modes):
#     export BACKEND=<backend>  # hcp | object-storage (default: hcp if missing)
#     export GITHUB_ORG=<github_org>
#     export DOMAIN=<apex_domain>
#     export CF_ACCOUNT_ID=<cloudflare_account_id>
#     export CF_ZONE_ID=<cloudflare_zone_id>
#     export REPO=<managed_repos[0]>
#     export ADDITIONAL_PROVIDER_NAMES='<additional_providers names as compact JSON>'
#     export ADDITIONAL_PROVIDER_MISE_TOOLS='<all entry.mise_tools flattened as compact JSON>'
#     export INFRA_COPILOT_REFERENCES=<absolute path to references/ directory>
#
# HCP mode (backend: hcp or missing):
#     export ORG=<hcp_org>
#     export HCP_STATUS_CHECK_ID=<hcp_status_check_id>
#     export ADDITIONAL_PROVIDER_WORKSPACES='<additional_providers workspaces as compact JSON>'
#     export hcp_api=https://app.terraform.io/api/v2
#     export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' ~/.terraform.d/credentials.tfrc.json)}
#
# Object-storage mode (backend: object-storage):
#     export STATE_BACKEND=<state_backend>  # gcs | s3 | azurerm | ...
#     export STATE_BUCKET=<state_bucket>
#     export STATE_PREFIX=<state_prefix>
#     export STATE_LOCK_TABLE=<state_lock_table>  # for S3
#     export STATE_REGION=<state_region>  # for S3/azurerm
#     export ADDITIONAL_PROVIDER_SECRETS='<additional_providers credential_secrets as compact JSON>'
#
# Steps with `when` conditions are skipped when the condition evaluates false.
#
# Phase 6 runs its inventory once, then instantiates the remaining steps per entry.
# Common exports for both modes:
#     export NEW_PROVIDER=<entry.name>
#     export NEW_PROVIDER_MISE_TOOLS='<entry.mise_tools as compact JSON>'
#     export NEW_PROVIDER_MISE_CONFIG_BLOB=<entry.mise_config_blob>
#     export NEW_PROVIDER_MISE_LOCK_BLOB=<entry.mise_lock_blob>
#     export NEW_PROVIDER_CREDENTIALS_VERIFIED_AT=<entry.credentials_verified_at>
# The once-per-phase inventory also receives every declared provider tool:
#     export ADDITIONAL_PROVIDER_MISE_TOOLS='<all entry.mise_tools flattened as compact JSON>'
#
# HCP mode Phase 6 exports:
#     export NEW_PROVIDER_WORKSPACE=<entry.workspace>
#     export NEW_PROVIDER_FORK_PLANS_DISABLED=<entry.fork_speculative_plans_disabled>
#     export NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID=<entry.fork_speculative_plans_workspace_id>
#     export NEW_PROVIDER_CREDENTIALS='<entry.credential_variables as compact JSON>'
#
# Object-storage mode Phase 6 exports:
#     export NEW_PROVIDER_SECRETS='<entry.credential_secrets as compact JSON>'
# Preflight exports TERRAFORM_VERSION from the validated repository pin before any
# Phase 1 workspace check or run uses it.
# Never guess or invent these values — if the config file is missing, treat it as a
# HUMAN step per config.md. See the "Configuring for your org" section in SKILL.md.
org: $ORG  # sourced from config — see config.md
domain: $DOMAIN  # sourced from config — see config.md
hcp_api: https://app.terraform.io/api/v2
# managed_repos come from .infra-copilot/config.md (see config.md) — not hardcoded here.

# TOOLCHAIN CONTRACT — pinned, not merely present.
#
# The requirement: the consuming repo pins its tool versions in `mise.toml`, commits
# that file and `mise.lock`, and matches what HCP runs. The checks read the named
# repository file explicitly; `mise current` is intentionally not used because it
# reports active user/global configuration as well as repository configuration.
#
#   pin    exact key in the committed file that records the pin.
#   check  exit 0 == the running binary exactly matches that committed pin.
#
# The lock check enumerates the `[tools]` keys of the committed file and dry-runs a
# locked install over exactly those. Naming a fixed list would leave conditionally
# added tools (gcloud, cf-terraforming) unvalidated, and running `mise install`
# with no tool arguments would pull in user/global config — the same leak that
# rules out `mise current`.
#
# It also asserts every configured *value* is an exact version. The per-tool checks
# below only cover terraform/gh/jq/gcloud, so without this an import-added pin such
# as cf-terraforming could sit at `latest` or a range, pass a refreshed lock, and
# still report a healthy exact-pin contract. Any value this cannot read as an exact
# version fails closed — a table-form entry has to be rewritten as a plain pin.
preflight:
  - tool: mise
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      repo_dir=$(pwd -P) &&
      mise trust --show 2>/dev/null | grep -Fx "$repo_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s\n' "$pinned" |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1 || exit 1;
      done
  - tool: terraform
    pin: mise.toml#tools.terraform
    check: >-
      ver=$(terraform version -json 2>/dev/null | jq -r '.terraform_version // empty');
      pin=$(mise config get --file ./mise.toml tools.terraform 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: gh
    pin: mise.toml#tools.gh
    check: >-
      ver=$(gh --version 2>/dev/null | head -1 | awk '{print $3}');
      pin=$(mise config get --file ./mise.toml tools.gh 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: jq
    pin: mise.toml#tools.jq
    check: >-
      ver=$(jq --version 2>/dev/null | sed 's/^jq-//');
      pin=$(mise config get --file ./mise.toml tools.jq 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: gcloud
    when: >-
      printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" |
      jq -e 'index("gcloud") != null' >/dev/null ||
      { [ "$BACKEND" = "object-storage" ] && [ "$STATE_BACKEND" = "gcs" ]; }
    pin: mise.toml#tools.gcloud
    check: >-
      needs_gcloud=false;
      printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" | jq -e 'index("gcloud") != null' >/dev/null && needs_gcloud=true;
      [ "$BACKEND" = "object-storage" ] && [ "$STATE_BACKEND" = "gcs" ] && needs_gcloud=true;
      [ "$needs_gcloud" = "false" ] && exit 0;
      ver=$(gcloud version --format=json 2>/dev/null |
      jq -r '."Google Cloud SDK" // empty' | tr -d '[:space:]');
      pin=$(mise config get --file ./mise.toml tools.gcloud 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: aws
    when: '[ "$BACKEND" = "object-storage" ] && [ "$STATE_BACKEND" = "s3" ]'
    pin: mise.toml#tools.awscli
    check: >-
      [ "$BACKEND" != "object-storage" ] || [ "$STATE_BACKEND" != "s3" ] && exit 0;
      ver=$(aws --version 2>&1 | sed -n 's|^aws-cli/\([0-9.]*\).*|\1|p' | head -1);
      pin=$(mise config get --file ./mise.toml tools.awscli 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: az
    when: '[ "$BACKEND" = "object-storage" ] && [ "$STATE_BACKEND" = "azurerm" ]'
    pin: mise.toml#tools.azure-cli
    check: >-
      [ "$BACKEND" != "object-storage" ] || [ "$STATE_BACKEND" != "azurerm" ] && exit 0;
      ver=$(az version --query '"azure-cli"' -o tsv 2>/dev/null | tr -d '[:space:]');
      pin=$(mise config get --file ./mise.toml tools.azure-cli 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: infra-copilot-references
    check: 'test -n "$INFRA_COPILOT_REFERENCES" && test -d "$INFRA_COPILOT_REFERENCES/checks"'
    why: >-
      Steps whose check is a shipped script resolve it from this path, because a check
      runs with the consuming repo as its working directory. Unset, the step runs
      sh "/checks/..." and fails with a bare shell error — and the script's own
      "export it per config.md" diagnostic is inside the file that could not be found.
    human_action: >-
      Export INFRA_COPILOT_REFERENCES per references/config.md: the absolute path to the
      loaded skill's references/ directory (the one holding config.md and checks/).

  - tool: curl
    check: "curl --version >/dev/null"   # system-provided; pinning it buys nothing

steps:
  # ── Phase 0 — Common bootstrap ──────────────────────────────────────────
  - id: toolchain-pin
    phase: 0
    provider: repo
    actor: HUMAN
    title: Create and commit the pinned mise.toml + mise.lock
    why: Preflight and every per-tool check compare installed binaries against these pins; nothing else creates them.
    run: |
      1. Follow docs/setup.md#6-local-development to choose exact tool versions and
         author mise.toml. Choosing the versions is a project decision, not a lookup.
      2. Review the entire mise.toml before trusting it; repository config can enable
         templates, plugins, and other executable behavior.
      3. Trust it, initialize and populate mise.lock, install the locked pins, and
         activate the installed toolchain using the exact sequence in that guide.
      4. Commit mise.toml and mise.lock together, then reply `done` so the agent can
         re-run this check.
    # Keep this byte-for-byte identical to the mise preflight check. The repository
    # validator enforces that invariant so the step and fail-fast gate cannot drift.
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      repo_dir=$(pwd -P) &&
      mise trust --show 2>/dev/null | grep -Fx "$repo_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s\n' "$pinned" |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1 || exit 1;
      done
    produces: committed mise.toml + mise.lock
    docs: docs/setup.md#6-local-development

  - id: repo-config-sync
    phase: 0
    provider: repo
    actor: HUMAN
    title: Synchronize repository configuration
    why: A template helper may need to copy canonical public identifiers into tool-required literal fields, but repository-controlled code must be reviewed before it runs.
    run: |
      1. If `./scripts/sync-config.sh` or `.infra-copilot/config.md` is absent, there is nothing to synchronize.
      2. Review `./scripts/sync-config.sh` in full before trusting it.
      3. Run it yourself from the repository root.
      4. Review the resulting diff, then commit `.infra-copilot/config.md` and both
         Terraform `versions.tf` files together.
      5. Reply `done`; the agent verifies the committed synchronized state.
    check: >-
      if test ! -x ./scripts/sync-config.sh || test ! -f .infra-copilot/config.md; then exit 0; fi;
      git ls-files --error-unmatch .infra-copilot/config.md terraform/cloudflare/versions.tf terraform/github/versions.tf >/dev/null 2>&1 &&
      git diff --quiet HEAD -- .infra-copilot/config.md terraform/cloudflare/versions.tf terraform/github/versions.tf &&
      git diff --cached --quiet HEAD -- .infra-copilot/config.md terraform/cloudflare/versions.tf terraform/github/versions.tf &&
      if [ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]; then
        for config_file in terraform/cloudflare/versions.tf terraform/github/versions.tf; do
          test -f "$config_file" && grep -Eq "^[[:space:]]*organization[[:space:]]*=[[:space:]]*\"$ORG\"[[:space:]]*$" "$config_file" || exit 1;
        done
      fi
    produces: committed repository literals synchronized from `.infra-copilot/config.md`
    docs: config.md

  # ── Phase 0 — HCP bootstrap (backend: hcp only) ──────────────────────────
  - id: hcp-login
    phase: 0
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Sign up and terraform login (mint the pivot HCP token)
    why: This browser login yields the API token needed to verify the organization and drive every later API step.
    run: |
      1. If needed, sign up at https://app.terraform.io/ (free tier is enough to start).
      2. Run locally: terraform login
      3. Approve in the browser tab it opens. The token is written to
         ~/.terraform.d/credentials.tfrc.json. This is the last interactive HCP CLI
         authentication; later providers still require their own human authorization or credential entry.
      4. Reply `done`; the agent re-exports HCP_TOKEN before checking the next step.
    # Accepts either credential source, in terraform's own precedence order. A
    # file-only check marked phase 0 red for anyone following hcp-apply-scope's
    # environment-variable route, and setup then told them to run `terraform login`
    # again -- recreating the apply-capable user token that step exists to remove.
    #
    # Presence alone is not enough. On a machine already narrowed by
    # hcp-apply-scope, the plan-only team token satisfied a presence test, so
    # bootstrapping a SECOND repository skipped this handoff -- and then
    # vcs-connect could not read oauth-clients while no workspace existed yet for
    # its fallback, so setup stalled with no way to ask for the user credential.
    # /account/details exists only for a user token, so it distinguishes them.
    # Only a definitive negative turns this red: a transport failure leaves the
    # presence result standing rather than blocking a cold bootstrap offline.
    check: |
      token=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' \
        ~/.terraform.d/credentials.tfrc.json 2>/dev/null)}
      [ -n "$token" ] && [ "$token" != null ] || exit 1

      # Never send the credential to an unexpected endpoint. This check runs
      # earliest of all, so a repo-local config pointing $hcp_api elsewhere would
      # disclose the token before vcs-connect or hcp-apply-scope get to refuse
      # it. Degrade to the presence result instead of sending it: those two are
      # tri-state and will reject the endpoint loudly.
      if [ "$hcp_api" != "https://app.terraform.io/api/v2" ]; then
        echo "note: \$hcp_api is '$hcp_api', not https://app.terraform.io/api/v2, so the credential kind was not checked — vcs-connect and hcp-apply-scope will refuse that endpoint" >&2
        exit 0
      fi

      # A narrowed token is the intended steady state only after the complete
      # Phase 1 invariant is green. Names alone are insufficient: drift in the
      # version, VCS target, execution mode, or safety toggles still requires the
      # user credential so workspaces-create can reconcile it. Both steps call
      # one shared check so their definitions of "provisioned" cannot diverge.
      HCP_TOKEN=$token \
        sh "$INFRA_COPILOT_REFERENCES/checks/hcp-bootstrap-workspaces.sh" \
        >/dev/null 2>&1 && exit 0

      # Cold repository: phases 0 and 1 genuinely need the user credential, and a
      # team token cannot read organization VCS settings or complete the OAuth
      # flow. /account/details exists only for a user token. Only a definitive
      # negative is red; a transport failure or any other status leaves the
      # presence result standing so a bootstrap is not blocked offline.
      code=$(curl -s -o /dev/null -w '%{http_code}' "$hcp_api/account/details" \
        -H "Authorization: Bearer $token") || exit 0
      case "$code" in
        200) exit 0 ;;
        401|403|404)
          echo "this repository's complete Phase 1 workspace configuration is not visible and green, and the HCP credential in use is not a user token (account/details returned $code). Phases 0 and 1 need the user credential from 'terraform login': a team token cannot read organization VCS settings, complete the OAuth flow, create a missing workspace, or reconcile drift. Unset TF_TOKEN_app_terraform_io, or run 'terraform login' for this bootstrap and re-apply hcp-apply-scope afterwards." >&2
          exit 1
          ;;
        *) exit 0 ;;
      esac
    produces: an HCP account and an API token terraform can use
    docs: docs/setup.md#1-hcp-terraform--organization

  - id: hcp-signup
    phase: 0
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Create HCP Terraform org and project
    why: HCP holds all state and secrets; nothing plans without it.
    run: |
      1. Open https://app.terraform.io/ after completing hcp-login.
      2. Create an organization named exactly `<your ORG slug>` (see config.md).
      3. Inside it, create a project named `infra`.
    # Assert the project too, not just the org: this step produces both, and an org
    # without `infra` fails later workspace work with a far less obvious error.
    # filter[names] is case-insensitive, so re-assert the exact name in jq.
    check: |
      test -n "$HCP_TOKEN" || exit 1
      [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || exit 1
      curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '.data.id' >/dev/null || exit 1
      curl -sf "$hcp_api/organizations/$ORG/projects?filter%5Bnames%5D=infra" \
        -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '[.data[] | select(.attributes.name == "infra")] | any' >/dev/null
    produces: HCP org `$ORG`, project `infra`
    docs: docs/setup.md#1-hcp-terraform--organization

  - id: hcp-verify
    phase: 0
    provider: hcp
    actor: AGENT
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Confirm HCP API reachable
    why: Gate — the rest of this skill is HCP API calls.
    run: |
      # Same precedence as config.md Step 0. Reading only the credentials file
      # sent an empty bearer token when TF_TOKEN_app_terraform_io was the only
      # credential, which hcp-apply-scope's environment route makes a real case.
      export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' ~/.terraform.d/credentials.tfrc.json)}
      curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" | jq -e '.data.id'
    check: '[ "$hcp_api" = "https://app.terraform.io/api/v2" ] && curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" | jq -e ".data.id"'
    produces: verified API access
    docs: docs/state.md#api-access

  # ── Phase 1 — HCP workspaces (backend: hcp only) ─────────────────────────
  - id: vcs-connect
    phase: 1
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Connect GitHub to HCP via OAuth
    why: Workspaces need a VCS provider to run speculative plans on PRs.
    run: |
      In HCP -> org Settings -> Version Control / VCS Providers, connect GitHub via OAuth,
      scoped to this repo only. Note the oauth-token id if the agent will script workspace creation.
    # Assert a GitHub-family VCS provider specifically, not just "any oauth client" —
    # otherwise a pre-existing GitLab/Bitbucket connection would false-green this step.
    # Tri-state, because this endpoint is organization-scoped and the plan-only
    # credential hcp-apply-scope installs cannot read it. Without the distinction a
    # resume scan stops here on the first non-zero check and re-emits the OAuth
    # handoff, so `setup` could never resume past phase 1 after that handoff -- and
    # the human would be told to redo a step that is already done. A 403 proves
    # nothing about whether the VCS connection exists, which is exactly a 2.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: |
      # Checked before any credential is sent. $hcp_api is exported by Step 0, so
      # a mistyped or edited value would put a bearer token in a request to an
      # arbitrary host -- in plaintext if the scheme were http. hcp-apply-scope
      # guards this for its own requests; these are separate ones.
      [ "$hcp_api" = "https://app.terraform.io/api/v2" ] \
        || { echo "CANNOT VERIFY: \$hcp_api is '$hcp_api', not https://app.terraform.io/api/v2; refusing to send an HCP credential to an unexpected endpoint" >&2; exit 2; }
      body=$(mktemp); trap 'rm -f "$body"' EXIT
      # Paginated: an organization with enough VCS clients pushes its GitHub one
      # onto a later page, and reading only the first concluded "no GitHub
      # client" and re-emitted the OAuth handoff for a connection that exists.
      oauth_page=1
      while : ; do
        code=$(curl -s -o "$body" -w '%{http_code}' \
          "$hcp_api/organizations/$ORG/oauth-clients?page%5Bsize%5D=100&page%5Bnumber%5D=$oauth_page" \
          -H "Authorization: Bearer $HCP_TOKEN") \
          || { echo "CANNOT VERIFY: the request for $ORG's oauth-clients did not complete (curl exit $?) — DNS, TLS, a timeout, or an unwritable temporary file" >&2; exit 2; }
        [ "$code" = 200 ] || break
        # jq -e exits 4 on empty input and 5 on invalid JSON, and this step is
        # tri-state: protocol.md honours 0, 1 and 2 only, so `exit $?` would
        # surface those as an unexpected code instead of a stated cause.
        jq -e '[.data[] | select(.attributes["service-provider"] | test("github"))] | length > 0' \
          "$body" >/dev/null 2>&1
        rc=$?
        case "$rc" in
          0) exit 0 ;;
          1) : ;;   # not on this page; keep paging
          *) echo "CANNOT VERIFY: $ORG's oauth-clients response could not be parsed (jq exit $rc)" >&2; exit 2 ;;
        esac
        # A page shorter than the requested size is the last one, whatever the
        # metadata says -- so total-pages is only consulted when a page comes
        # back full. meta.pagination is not a required field in HCP's schema,
        # and demanding it unconditionally would have reported CANNOT VERIFY for
        # every organization whose response omits it.
        oauth_count=$(jq -e '.data | length' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $ORG's oauth-clients response was not the expected JSON" >&2; exit 2; }
        [ "$oauth_count" -eq 100 ] || exit 1   # last page, no GitHub client anywhere
        oauth_pages=$(jq -er '.meta.pagination["total-pages"]
                      | if type == "number" and . == floor and . > 0
                        then (floor | tostring) else empty end' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $ORG's oauth-clients list filled a page but carried no positive-integer total-pages, so later pages could not be reached" >&2; exit 2; }
        [ "$oauth_page" -lt "$oauth_pages" ] || exit 1   # every page read, no GitHub client
        oauth_page=$((oauth_page + 1))
      done
      case "$code" in
        401|403) ;;   # fall through to the workspace-scoped evidence below
        *) echo "CANNOT VERIFY: reading $ORG's oauth-clients returned $code" >&2; exit 2 ;;
      esac
      # The plan-only credential from hcp-apply-scope cannot read organization VCS
      # settings, and stopping here would leave `setup` unable to resume past phase 1
      # after that handoff. A workspace connected to $REPO is stronger evidence of the
      # same fact anyway -- it is the connection actually being used -- and it is
      # workspace-scoped, so the narrowed credential can read it. Only available once
      # workspaces exist, which on a resume they do.
      page=1
      while : ; do
        curl -sf "$hcp_api/organizations/$ORG/workspaces?page%5Bsize%5D=100&page%5Bnumber%5D=$page" \
          -H "Authorization: Bearer $HCP_TOKEN" >"$body" \
          || { echo "CANNOT VERIFY: this credential may not read $ORG's VCS settings ($code) and page $page of the workspace list could not be read either" >&2; exit 2; }
        # Require an actual VCS connection, by either mechanism. create_ws in
        # hcp.md connects through `oauth-token-id`, so requiring a GitHub App
        # installation id rejected every workspace this manifest provisions --
        # which put the fallback back into the exit-2 state it exists to avoid.
        #
        # This cannot establish the provider family: a workspace's vcs-repo
        # carries no service-provider field, and resolving the oauth token to its
        # client needs an organization-scoped read the narrowed credential does
        # not have. So an organization holding a GitLab workspace with the same
        # owner/name would satisfy this. Accepted deliberately: the primary path
        # above does check GitHub specifically, and this branch runs only after
        # the handoff, when phase 1 is complete and was verified under the user
        # token. Recorded in docs/policy.md's limits.
        if jq -e --arg repo "${REPO:-}" \
             '[.data[] | select(.attributes["vcs-repo"].identifier == $repo)
                       | select((.attributes["vcs-repo"]["oauth-token-id"] != null)
                                or (.attributes["vcs-repo"]["github-app-installation-id"] != null))]
              | length > 0' "$body" >/dev/null 2>&1; then
          exit 0
        fi
        pages=$(jq -er '.meta.pagination["total-pages"]
                        | if type == "number" and . == floor and . > 0
                          then (floor | tostring) else empty end' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: this credential may not read $ORG's VCS settings ($code), and the workspace list carried no positive-integer total-pages so later pages could not be reached" >&2; exit 2; }
        [ "$page" -lt "$pages" ] || break
        page=$((page + 1))
      done
      echo "CANNOT VERIFY: this credential may not read $ORG's VCS settings ($code), and no VCS-connected workspace for ${REPO:-<REPO unset>} is visible; if the plan-only identity is in use, phase 1 was verified under the user token" >&2
      exit 2
    produces: GitHub<->HCP OAuth connection
    docs: docs/setup.md#2-hcp-terraform--workspaces

  - id: workspaces-create
    phase: 1
    provider: hcp
    actor: AGENT
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Create cloudflare + github-org workspaces
    why: One workspace per leaf; carries working dir, path filter, safety toggles.
    run: |
      SOURCE OF TRUTH: the `create_ws` helper in hcp.md (Phase 1). Run that.
      The summary below is a reminder, not a second copy to maintain — if it disagrees
      with hcp.md, hcp.md wins. A POST to
      $hcp_api/organizations/$ORG/workspaces per workspace with:
        working-directory:   terraform/cloudflare  (and terraform/github)
        file-triggers-enabled: true
        trigger-patterns:    ["terraform/cloudflare/**", "terraform/modules/**", ".infra-copilot/config.md", "mise.toml"]  (and terraform/github/** plus the shared paths)
        execution-mode:      remote
        terraform-version:   $TERRAFORM_VERSION  # exact committed mise.toml pin
        auto-apply:          false
        auto-destroy-at:     null
        auto-destroy-activity-duration: null
        speculative-enabled: true       # plans on PRs
        vcs-repo:            identifier $REPO, oauth-token-id from vcs-connect, branch main
      Then in each workspace's UI -> Version Control, confirm FORK speculative plans are OFF
      (separate toggle, no clean create-time attribute; defaults off).
    # The same complete invariant decides whether hcp-login may accept a narrowed
    # team token. Keep it in one executable source rather than duplicating jq.
    check: sh "$INFRA_COPILOT_REFERENCES/checks/hcp-bootstrap-workspaces.sh"
    produces: workspaces `cloudflare`, `github-org`
    docs: docs/state.md#workspaces

  # ── Phase 0 — Object-storage bootstrap (backend: object-storage only) ───
  - id: state-bucket
    phase: 0
    provider: repo
    actor: HUMAN
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Create the state storage bucket
    why: Terraform state needs a durable, versioned bucket before any init.
    run: |
      Create the bucket specified in config.md's `state_bucket` field. Requirements:
      - Versioning enabled (state history for recovery)
      - Private access only (state contains sensitive data)
      - For GCS: native locking is automatic
      - For S3: create a DynamoDB table for locking (record in `state_lock_table`)
      - For azurerm: native locking is automatic

      Example for GCS:
        gcloud storage buckets create gs://$STATE_BUCKET \
          --location=us --uniform-bucket-level-access --versioning

      Example for S3:
        # us-east-1:
        aws s3api create-bucket --bucket "$STATE_BUCKET" --region us-east-1
        # Other regions require LocationConstraint:
        # aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$STATE_REGION" \
        #   --create-bucket-configuration LocationConstraint="$STATE_REGION"
        aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
          --versioning-configuration Status=Enabled
        aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
          --public-access-block-configuration \
          "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
        aws dynamodb create-table --table-name "$STATE_LOCK_TABLE" \
          --region "$STATE_REGION" \
          --attribute-definitions AttributeName=LockID,AttributeType=S \
          --key-schema AttributeName=LockID,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST

      Example for azurerm:
        az group create --name "$AZURE_RESOURCE_GROUP" --location "$STATE_REGION"
        az storage account create --name "$AZURE_STORAGE_ACCOUNT" --resource-group "$AZURE_RESOURCE_GROUP" --sku Standard_LRS --encryption-services blob
        az storage account blob-service-properties update --account-name "$AZURE_STORAGE_ACCOUNT" --enable-versioning true
        az storage container create --account-name "$AZURE_STORAGE_ACCOUNT" --name "$STATE_BUCKET" --public-access off
    check: |
      case "$STATE_BACKEND" in
        gcs)
          gcloud storage buckets describe "gs://$STATE_BUCKET" --format='value(name)' 2>/dev/null \
            | grep -Fxq "$STATE_BUCKET" || exit 1
          gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --format='value(iamConfiguration.uniformBucketLevelAccess.enabled)' 2>/dev/null \
            | grep -Fxq "True" || exit 1
          # Verify object versioning is enabled
          gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --format='value(versioning.enabled)' 2>/dev/null | grep -Fxiq "true" || exit 1
          # Require Public Access Prevention to be enforced (blocks inherited project-level grants)
          pap=$(gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --format='value(iamConfiguration.publicAccessPrevention)' 2>/dev/null)
          if [ "$pap" = "enforced" ]; then
            : # Public Access Prevention enforced - bucket is private
          else
            # Fall back to checking bucket-level IAM (may miss inherited grants)
            iam_policy=$(gcloud storage buckets get-iam-policy "gs://$STATE_BUCKET" \
              --format='value(bindings.members)' 2>/dev/null) || exit 1
            ! printf '%s' "$iam_policy" | grep -Eq '(allUsers|allAuthenticatedUsers)' || {
              echo "Warning: Public Access Prevention not enforced and public members found" >&2
              exit 1
            }
          fi
          ;;
        s3)
          [ -n "$STATE_LOCK_TABLE" ] || exit 1
          aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null || exit 1
          aws s3api get-bucket-versioning --bucket "$STATE_BUCKET" --query "Status" --output text 2>/dev/null \
            | grep -Fxq "Enabled" || exit 1
          # Verify table exists, is active, and has correct key schema (LockID string)
          # Use --output json to avoid depending on user's AWS CLI default output format
          table_info=$(aws dynamodb describe-table --table-name "$STATE_LOCK_TABLE" --region "$STATE_REGION" --output json 2>/dev/null) || exit 1
          printf '%s' "$table_info" | jq -e '.Table.TableStatus == "ACTIVE"' >/dev/null || exit 1
          printf '%s' "$table_info" | jq -e '.Table.KeySchema == [{"AttributeName":"LockID","KeyType":"HASH"}]' >/dev/null || exit 1
          printf '%s' "$table_info" | jq -e '.Table.AttributeDefinitions | any(.AttributeName == "LockID" and .AttributeType == "S")' >/dev/null || exit 1
          # Verify all public-access-block settings are enabled
          pab=$(aws s3api get-public-access-block --bucket "$STATE_BUCKET" --output json 2>/dev/null)
          printf '%s' "$pab" | grep -q '"BlockPublicAcls": true' || exit 1
          printf '%s' "$pab" | grep -q '"IgnorePublicAcls": true' || exit 1
          printf '%s' "$pab" | grep -q '"BlockPublicPolicy": true' || exit 1
          printf '%s' "$pab" | grep -q '"RestrictPublicBuckets": true' || exit 1
          ;;
        azurerm)
          [ -n "$AZURE_STORAGE_ACCOUNT" ] || exit 1
          az storage container show --name "$STATE_BUCKET" --account-name "$AZURE_STORAGE_ACCOUNT" --query name -o tsv 2>/dev/null \
            | grep -Fxq "$STATE_BUCKET" || exit 1
          az storage container show --name "$STATE_BUCKET" --account-name "$AZURE_STORAGE_ACCOUNT" --query "properties.publicAccess" -o tsv 2>/dev/null \
            | grep -Eq '^(null|None)?$' || exit 1
          # Verify blob versioning is enabled on the storage account
          az storage account blob-service-properties show --account-name "$AZURE_STORAGE_ACCOUNT" \
            --query "isVersioningEnabled" -o tsv 2>/dev/null | grep -Fxq "true" || exit 1
          ;;
        *)
          echo "Unsupported state backend: $STATE_BACKEND" >&2; exit 1
          ;;
      esac
    produces: versioned, private state bucket
    docs: docs/state.md#object-storage-backend

  - id: backend-config
    phase: 0
    provider: repo
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Configure Terraform backend blocks
    why: Each leaf needs a backend block pointing to the state bucket with a unique key.
    run: |
      For each terraform/<leaf>:
      1. If migrating from HCP:
         a. Backup existing state to a protected tempfile (state may contain secrets):
            `(umask 077 && terraform state pull > "$(mktemp -d)/terraform.tfstate.backup")`
         b. Remove the `cloud {}` block from versions.tf (Terraform rejects both cloud and backend)
         c. Create the backend.tf (step 2 below)
         d. Run `terraform init -migrate-state` to copy state from HCP to the bucket
         e. Verify state transfer: `terraform state list` should match before/after
         f. Delete the backup file after verification (never commit state backups)
      2. Create a backend.tf with:
        terraform {
          backend "<state_backend>" {
            # For GCS:
            bucket = "<state_bucket>"
            prefix = "<state_prefix>/<leaf>"
            # For S3:
            bucket         = "<state_bucket>"
            key            = "<state_prefix>/<leaf>/terraform.tfstate"
            region         = "<state_region>"
            dynamodb_table = "<state_lock_table>"
            # For azurerm:
            resource_group_name  = "<azure_resource_group>"
            storage_account_name = "<azure_storage_account>"
            container_name       = "<state_bucket>"
            key                  = "<state_prefix>/<leaf>/terraform.tfstate"
            use_azuread_auth     = true  # Required for federated identity (no access keys)
          }
        }
      The prefix/key ensures each leaf has isolated state within the shared bucket.
    check: |
      for leaf in terraform/cloudflare terraform/github; do
        test -d "$leaf" || continue
        grep -q "backend \"$STATE_BACKEND\"" "$leaf"/*.tf 2>/dev/null || exit 1
        # Use -F for literal string matching (bucket names may contain regex chars like .)
        grep -Fq "$STATE_BUCKET" "$leaf"/*.tf 2>/dev/null || exit 1
        # Ensure old HCP cloud block is removed (cannot have both backend and cloud)
        ! grep -q 'cloud[[:space:]]*{' "$leaf"/*.tf 2>/dev/null || exit 1
        if [ "$STATE_BACKEND" = "s3" ]; then
          grep -Fq "$STATE_LOCK_TABLE" "$leaf"/*.tf 2>/dev/null || exit 1
        elif [ "$STATE_BACKEND" = "azurerm" ]; then
          grep -Fq "$AZURE_STORAGE_ACCOUNT" "$leaf"/*.tf 2>/dev/null || exit 1
          # Require Azure AD auth for federated identity (no access keys)
          grep -q 'use_azuread_auth[[:space:]]*=[[:space:]]*true' "$leaf"/*.tf 2>/dev/null || exit 1
        fi
        leaf_name=$(basename "$leaf")
        # Verify complete prefix/key including STATE_PREFIX
        # Escape regex special chars in STATE_PREFIX (e.g., + . *)
        escaped_prefix=$(printf '%s' "$STATE_PREFIX" | sed 's/[.+*?^$[\]\\|(){}]/\\&/g')
        if [ "$STATE_BACKEND" = "gcs" ]; then
          grep -E "prefix[[:space:]]*=[[:space:]]*\"$escaped_prefix/$leaf_name\"" "$leaf"/*.tf 2>/dev/null || exit 1
        else
          grep -E "key[[:space:]]*=[[:space:]]*\"$escaped_prefix/$leaf_name/terraform\\.tfstate\"" "$leaf"/*.tf 2>/dev/null || exit 1
        fi
      done
    produces: backend blocks in each Terraform leaf
    docs: docs/state.md#object-storage-backend

  - id: backend-identity
    phase: 0
    provider: repo
    actor: HUMAN
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Configure cloud identity for backend state access
    why: GitHub Actions needs to authenticate to the state backend; the agent cannot create cloud-side federation or install secrets.
    run: |
      Configure Workload Identity Federation (or equivalent) so GitHub Actions can access
      the state bucket. This varies by backend:

      **GCS (Workload Identity Federation):**
      1. Create a Workload Identity Pool and Provider in your GCP project
      2. Grant the service account storage.objectAdmin on the state bucket
      3. Create GitHub secrets:
         - GCP_WORKLOAD_IDENTITY_PROVIDER: projects/<id>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
         - GCP_SERVICE_ACCOUNT: <sa>@<project>.iam.gserviceaccount.com

      **S3 (OIDC assume-role):**
      1. Create an IAM OIDC provider for GitHub Actions
      2. Create an IAM role with S3 and DynamoDB permissions, trust policy for your repo
      3. Create GitHub secrets:
         - AWS_ROLE_ARN: arn:aws:iam::<account>:role/<role>
         - AWS_REGION (optional, defaults to state_region)

      **Azure (Federated credentials):**
      1. Create an App Registration with federated credentials for GitHub
      2. Grant the service principal Storage Blob Data Contributor on the container
      3. Create GitHub secrets:
         - AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

      Reply `done` after installing the secrets.
    check: |
      # Verify secrets exist in the repo (exact name match)
      secrets=$(gh secret list --repo "$REPO" --json name -q '.[].name' 2>/dev/null) || exit 1
      case "$STATE_BACKEND" in
        gcs)
          printf '%s\n' "$secrets" | grep -Fxq "GCP_WORKLOAD_IDENTITY_PROVIDER" || exit 1
          printf '%s\n' "$secrets" | grep -Fxq "GCP_SERVICE_ACCOUNT" || exit 1
          ;;
        s3)
          printf '%s\n' "$secrets" | grep -Fxq "AWS_ROLE_ARN" || exit 1
          ;;
        azurerm)
          printf '%s\n' "$secrets" | grep -Fxq "AZURE_CLIENT_ID" || exit 1
          printf '%s\n' "$secrets" | grep -Fxq "AZURE_TENANT_ID" || exit 1
          printf '%s\n' "$secrets" | grep -Fxq "AZURE_SUBSCRIPTION_ID" || exit 1
          ;;
      esac
    produces: Cloud identity federation and GitHub secrets for backend access
    docs: docs/state.md#authentication

  # ── Phase 1 — GitHub Actions CI (backend: object-storage only) ──────────
  - id: gha-workflows
    phase: 1
    provider: github
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Create GitHub Actions workflows for plan and apply
    why: CI replaces HCP's VCS integration — plan on PR, apply on merge.
    run: |
      Create .github/workflows/terraform-plan.yml:
        - Triggers on pull_request (and optional workflow_dispatch)
        - Runs init + plan for each changed leaf
        - Configures state-backend authentication for $STATE_BACKEND (GCS Workload Identity, AWS assume-role, or Azure login)
        - Posts plan output as PR comment
        - Emits aggregate plan check

      Create .github/workflows/terraform-apply.yml:
        - Triggers on push to main for paths terraform/**
        - Requires environment approval ("production")
        - Concurrency group serialized per state
        - Applies changes for each changed leaf
    check: |
      # File existence and git tracking
      test -f .github/workflows/terraform-plan.yml || exit 1
      test -f .github/workflows/terraform-apply.yml || exit 1
      git ls-files --error-unmatch \
        .github/workflows/terraform-plan.yml \
        .github/workflows/terraform-apply.yml >/dev/null 2>&1 || exit 1
      # YAML syntax validation skipped - workflow execution will catch malformed files
      # Basic job existence - detailed validation happens in Phase 4 when workflows run
      grep -q "plan-cloudflare" .github/workflows/terraform-plan.yml || exit 1
      grep -q "plan-github" .github/workflows/terraform-plan.yml || exit 1
      grep -q "apply-cloudflare" .github/workflows/terraform-apply.yml || exit 1
      grep -q "apply-github" .github/workflows/terraform-apply.yml || exit 1
    produces: GitHub Actions workflows for Terraform CI
    docs: docs/ci.md#github-actions

  - id: gha-environments
    phase: 1
    provider: github
    actor: HUMAN
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Configure GitHub Environments for apply approval
    why: Environments gate applies behind human approval, replacing HCP's confirm button.
    run: |
      1. Go to repo Settings -> Environments
      2. Create an environment named "production"
      3. Enable "Required reviewers" and add appropriate approvers
      4. The terraform-apply workflow references this environment
    check: |
      env_json=$(gh api "repos/$REPO/environments/production" 2>/dev/null) || exit 1
      printf '%s' "$env_json" | jq -e '.protection_rules[]? | select(.type == "required_reviewers")' >/dev/null
    produces: GitHub Environment with required reviewers
    docs: docs/ci.md#github-actions

  # ── Phase 2 — Cloudflare credentials (backend: object-storage) ──────────
  - id: cf-token-gha
    phase: 2
    provider: cloudflare
    actor: HUMAN
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Mint Cloudflare token and add as GitHub Actions secret
    why: The Terraform workflow authenticates to Cloudflare with this token.
    run: |
      1. https://dash.cloudflare.com/profile/api-tokens -> Create Token -> Custom token.
      2. Permissions: Zone·DNS·Edit, Zone·Zone Settings·Edit  (add more as resources grow).
      3. Account Resources: your account. Zone Resources: Specific zone -> <apex-domain>.
      4. Copy the token (shown once).
      5. Repo Settings -> Secrets and variables -> Actions -> New repository secret:
         CLOUDFLARE_API_TOKEN, paste value.
    check: |
      gh secret list --json name -q '.[].name' 2>/dev/null \
        | grep -Fxq 'CLOUDFLARE_API_TOKEN'
    produces: CLOUDFLARE_API_TOKEN secret in GitHub Actions
    docs: cloudflare.md

  # ── Phase 3 — GitHub App credentials (backend: object-storage) ──────────
  - id: gh-app-gha
    phase: 3
    provider: github
    actor: HUMAN
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Configure GitHub App credentials in GitHub Actions secrets
    why: The Terraform workflow authenticates to GitHub with these App credentials.
    run: |
      1. GitHub Org -> Settings -> Developer settings -> GitHub Apps -> New GitHub App.
      2. Note the App ID. Generate a private key (.pem).
      3. Install on your org scoped to the repos in managed_repos (see config.md);
         note the Installation ID from the install URL.
      4. Repo Settings -> Secrets and variables -> Actions, add secrets:
         GH_APP_ID, GH_APP_INSTALLATION_ID, GH_APP_PEM (full PEM incl. BEGIN/END lines)
    check: |
      secrets=$(gh secret list --json name -q '.[].name' 2>/dev/null)
      echo "$secrets" | grep -Fxq 'GH_APP_ID' || exit 1
      echo "$secrets" | grep -Fxq 'GH_APP_INSTALLATION_ID' || exit 1
      echo "$secrets" | grep -Fxq 'GH_APP_PEM'
    produces: GitHub Actions secrets for GitHub App authentication
    docs: github.md

  # ── Phase 4 — First plan (backend: object-storage) ──────────────────────
  - id: plan-cloudflare-gha
    phase: 4
    provider: cloudflare
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: verify plan for cloudflare via GitHub Actions
    why: Proves the Cloudflare token and backend configuration end-to-end via CI.
    run: |
      Trigger or inspect the GitHub Actions plan workflow for terraform/cloudflare.
      You can dispatch it via `gh workflow run terraform-plan.yml --repo "$REPO" --ref "$(git branch --show-current)"` or open a PR.
      Verify that the plan-cloudflare job runs and finishes successfully.
    check: |
      # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
      # Fail closed: if git status fails, treat as dirty rather than clean
      dirty_status=$(git status --porcelain -- terraform/cloudflare terraform/modules .infra-copilot/config.md mise.toml mise.lock) || {
        echo "git status failed - cannot verify working tree state" >&2
        exit 1
      }
      if [ -n "$dirty_status" ]; then
        echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
        exit 1
      fi
      # Find the newest commit that changed relevant paths
      target_sha=$(git log --format=%H -1 -- terraform/cloudflare terraform/modules .infra-copilot/config.md mise.toml mise.lock 2>/dev/null)
      [ -n "$target_sha" ] || exit 1
      # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
      branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
      run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
        --json databaseId,conclusion,event,headSha \
        -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null)
      [ -n "$run_info" ] || exit 1
      run_id=$(printf '%s' "$run_info" | jq -r '.databaseId')
      run_sha=$(printf '%s' "$run_info" | jq -r '.headSha')
      conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion')
      # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
      git merge-base --is-ancestor "$target_sha" "$run_sha" || exit 1
      [ "$conclusion" = "success" ] || exit 1
      gh run view "$run_id" --repo "$REPO" --json jobs \
        -q '.jobs[] | select(.name=="plan-cloudflare" and .conclusion=="success") | .name' 2>/dev/null | grep -q 'plan-cloudflare'
    produces: green plan for cloudflare in GitHub Actions
    docs: docs/ci.md#github-actions

  - id: plan-github-gha
    phase: 4
    provider: github
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: verify plan for github via GitHub Actions
    why: Proves the GitHub App credentials and backend configuration end-to-end via CI.
    run: |
      Trigger or inspect the GitHub Actions plan workflow for terraform/github.
      You can dispatch it via `gh workflow run terraform-plan.yml --repo "$REPO" --ref "$(git branch --show-current)"` or open a PR.
      Verify that the plan-github job runs and finishes successfully.
    check: |
      # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
      # Fail closed: if git status fails, treat as dirty rather than clean
      dirty_status=$(git status --porcelain -- terraform/github terraform/modules .infra-copilot/config.md mise.toml mise.lock) || {
        echo "git status failed - cannot verify working tree state" >&2
        exit 1
      }
      if [ -n "$dirty_status" ]; then
        echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
        exit 1
      fi
      # Find the newest commit that changed relevant paths
      target_sha=$(git log --format=%H -1 -- terraform/github terraform/modules .infra-copilot/config.md mise.toml mise.lock 2>/dev/null)
      [ -n "$target_sha" ] || exit 1
      # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
      branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
      run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
        --json databaseId,conclusion,event,headSha \
        -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null)
      [ -n "$run_info" ] || exit 1
      run_id=$(printf '%s' "$run_info" | jq -r '.databaseId')
      run_sha=$(printf '%s' "$run_info" | jq -r '.headSha')
      conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion')
      # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
      git merge-base --is-ancestor "$target_sha" "$run_sha" || exit 1
      [ "$conclusion" = "success" ] || exit 1
      gh run view "$run_id" --repo "$REPO" --json jobs \
        -q '.jobs[] | select(.name=="plan-github" and .conclusion=="success") | .name' 2>/dev/null | grep -q 'plan-github'
    produces: green plan for github in GitHub Actions
    docs: docs/ci.md#github-actions

  - id: status-check-gha
    phase: 4
    provider: github
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Required status checks match GitHub Actions job names
    why: Branch protection must reference the actual job names from the workflows.
    run: |
      In terraform/github/branch_protection.tf, ensure required_status_checks
      includes the published job contexts: "validate (cloudflare)", "validate (github)",
      and "plan" (the aggregate check from terraform-plan.yml).
    check: |
      # Verify HCL declares the required contexts
      test -f terraform/github/branch_protection.tf || exit 1
      contexts=$(sed -n '/required_status_checks/,/}/p' terraform/github/branch_protection.tf)
      echo "$contexts" | grep -q '"plan"' || exit 1
      echo "$contexts" | grep -q '"validate (cloudflare)"' || exit 1
      echo "$contexts" | grep -q '"validate (github)"' || exit 1
      # Live verification is deferred to workflow execution - if protection isn't applied,
      # PRs will merge without required checks which is immediately visible.
      # The HCL source-of-truth above ensures the Terraform run will configure it correctly.
    produces: branch protection references GitHub Actions job names
    docs: docs/ci.md#branch-protection

  # ── Phase 2 — Cloudflare credentials (backend: hcp) ──────────────────────
  - id: cf-token
    phase: 2
    provider: cloudflare
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Mint Cloudflare token and paste into HCP
    why: The cloudflare workspace authenticates to Cloudflare with this token.
    run: |
      1. https://dash.cloudflare.com/profile/api-tokens -> Create Token -> Custom token.
      2. Permissions: Zone·DNS·Edit, Zone·Zone Settings·Edit  (add more as resources grow).
      3. Account Resources: your account. Zone Resources: Specific zone -> <apex-domain>.
      4. Copy the token (shown once).
      5. HCP -> workspace `cloudflare` -> Variables -> add `cloudflare_api_token`
         as a TERRAFORM variable, mark SENSITIVE, paste the value.
    check: |
      WS_ID=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/cloudflare" -H "Authorization: Bearer $HCP_TOKEN" | jq -r '.data.id')
      curl -sf "$hcp_api/workspaces/$WS_ID/vars" -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '[.data[]
            | select(.attributes.key == "cloudflare_api_token")
            | .attributes.category == "terraform" and .attributes.sensitive == true] | any' >/dev/null
    produces: sensitive var `cloudflare_api_token`
    docs: cloudflare.md

  # ── Phase 3 — GitHub App credentials (backend: hcp) ──────────────────────
  - id: gh-app
    phase: 3
    provider: github
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Create + install GitHub App, paste creds into HCP
    why: The github-org workspace authenticates as a GitHub App (not a PAT).
    run: |
      1. Create the App under your org: https://github.com/organizations/<your-org>/settings/apps/new
         Permissions: Repo Administration(RW), Contents(R), Metadata(R), Pull requests(RW);
         Org Members(R), Administration(RW). Install: only on this account.
      2. Note the App ID. Generate a private key (.pem).
      3. Install on your org scoped to the repos in managed_repos (see config.md);
         note the Installation ID from the install URL.
      4. HCP -> workspace `github-org` -> Variables, add as TERRAFORM vars:
         github_owner=<your-org> (not sensitive),
         github_app_id (sensitive), github_app_installation_id (sensitive),
         github_app_pem = full PEM incl. BEGIN/END lines (sensitive).
    check: |
      WS_ID=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/github-org" -H "Authorization: Bearer $HCP_TOKEN" | jq -r '.data.id')
      curl -sf "$hcp_api/workspaces/$WS_ID/vars" -H "Authorization: Bearer $HCP_TOKEN" | jq -e '
        [.data[] | select(.attributes.category == "terraform") | .attributes] as $tf
        | ($tf | map(.key)) as $keys
        | ($tf | map(select(.sensitive == true) | .key)) as $sensitive
        | ((["github_app_id", "github_app_installation_id", "github_app_pem"] - $sensitive) | length) == 0
          and ((["github_owner"] - $keys) | length) == 0' >/dev/null
    produces: sensitive vars github_app_id / _installation_id / _pem, plus github_owner
    docs: github.md

  # ── Phase 4 — First plan (backend: hcp) ──────────────────────────────────
  - id: hcp-apply-scope
    phase: 4
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: The HCP credential this repo uses cannot apply
    why: >-
      docs/policy.md works through every host-level permission control and finds
      that none of them constrain this plugin: Bash denies are wrapped by
      `mise exec --`, Read denies do not govern subprocesses, and a Skill deny is
      reached around by the command. Narrowing the credential is the strongest
      control left, and `terraform login` mints a user token that can apply
      anything the operator can. It is not a boundary against a hostile actor:
      HCP treats plan as security-equivalent to write, because a plan runs the
      configuration's code with access to workspace variables and state. What it
      buys is the removal of the direct apply path, so an accidental apply takes
      deliberate steps. Nothing here applies — setup stops at speculative plans — but
      a repo bootstrapped by this plugin leaves its agent apply rights on
      production until someone narrows them. First step of phase 4, so the plan
      steps that follow already run under the narrowed credential — and, like
      every other HUMAN step, the scan stops here and hands off rather than
      continuing past it.
    run: |
      Replace the credential this machine offers HCP with a plan-only one. Do not
      merely export a second token: `terraform` never reads $HCP_TOKEN. It reads
      TF_TOKEN_app_terraform_io, or failing that
      ~/.terraform.d/credentials.tfrc.json, and the environment variable wins. A
      plan-only $HCP_TOKEN beside an apply-capable credentials file leaves the
      Terraform CLI fully able to apply, which is the path that matters.

      HCP separates the rights: a workspace's Plan permission covers "read, queue,
      and comment on Terraform plans" and excludes apply. A team token carries its
      team's workspace permissions, so:

        1. Create a team (Organization Settings -> Teams) with NO organization
           permissions.
        2. Grant it the *Plan* permission on every workspace this repo manages —
           not Write, which includes apply. Repeat this whenever `add` creates a
           new workspace, or plans there will fail for the plan-only identity.
        3. Create its token (Organization Settings -> API Tokens -> Team Tokens,
           or POST /teams/<id>/authentication-token).
        4. Put that token where terraform will find it — overwrite the token in
           ~/.terraform.d/credentials.tfrc.json, or export
           TF_TOKEN_app_terraform_io — and keep the user token off this machine.
           Step 0 resolves HCP_TOKEN in terraform's own order, preferring
           TF_TOKEN_app_terraform_io and falling back to the credentials file, so
           either route survives later runs and both agree with what `terraform`
           itself uses. Exporting the variable in one shell only is not enough:
           put it somewhere the agent's environment gets it every time.

      Phases 0 and 1 need the user token: a team token authenticates as a
      synthetic service account that cannot complete the personal OAuth flow
      `vcs-connect` requires. So this is a one-time handoff after phase 1, not a
      token you swap per command.

      `vcs-connect` handles this credential already. Its check reads
      /organizations/<org>/oauth-clients, which is organization-scoped and
      unreadable by a team token, so it falls back to looking for a workspace
      connected to $REPO — the connection actually in use. Expect it to stay
      green, or to report `?` if neither signal can be read; it will not go red
      merely because the credential narrowed.

      Do NOT grant the team "Manage version control settings" to turn it green.
      That is an organization permission, and organization permissions are the
      self-elevation risk this whole step exists to avoid — a team that can
      administer VCS settings is a team that can be given more. Re-verify phase 1
      with the user token if you need to, and leave the team's organization access
      empty.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    # The credentials-file route replaces a file but cannot update the current
    # process environment. Resolve HCP_TOKEN again here so a user token exported
    # during Step 0 cannot create a false SPLIT-BRAIN verdict after the handoff.
    check: >-
      export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r
      '.credentials["app.terraform.io"].token'
      ~/.terraform.d/credentials.tfrc.json)} &&
      sh "$INFRA_COPILOT_REFERENCES/checks/hcp-apply-scope.sh"
    produces: an agent credential with no direct apply path (not a boundary against a hostile actor — see docs/policy.md)
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: plan-cloudflare
    phase: 4
    provider: cloudflare
    actor: AGENT
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: init + speculative plan (terraform/cloudflare)
    why: Proves the Cloudflare token end-to-end.
    run: "cd terraform/cloudflare && terraform init && terraform plan"
    check: "cd terraform/cloudflare && terraform init -input=false >/dev/null && terraform plan -input=false >/dev/null"
    produces: green speculative plan for cloudflare
    docs: docs/hcp-api.md

  - id: plan-github
    phase: 4
    provider: github
    actor: AGENT
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: init + speculative plan (terraform/github)
    why: Proves the GitHub App credentials end-to-end.
    run: "cd terraform/github && terraform init && terraform plan"
    check: "cd terraform/github && terraform init -input=false >/dev/null && terraform plan -input=false >/dev/null"
    produces: green speculative plan for github-org
    docs: docs/hcp-api.md

  - id: status-check-context
    phase: 4
    provider: github
    actor: AGENT
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Required status check context matches what HCP publishes
    why: >-
      A required context HCP no longer posts blocks every PR on
      "Expected — Waiting for status to be reported", forever, while every other
      check stays green.
    run: >-
      Read the context HCP actually published, then in
      terraform/github/branch_protection.tf replace ONLY the stale
      "Terraform Cloud/…" entry with it. Keep every other required context —
      terraform fmt and both terraform validate checks — exactly as they are;
      dropping them would allow merges with no CI at all. The stale context
      blocks the very PR carrying this fix, so follow the break-glass sequence
      in docs/ci.md.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: sh "$INFRA_COPILOT_REFERENCES/checks/status-check-context.sh"
    produces: proof that branch protection cannot silently block every PR
    docs: docs/ci.md#hcp-status-check-context

  # ── Phase 5 — Migration (only if resources pre-exist) ───────────────────
  - id: migrate-discovery-token
    phase: 5
    provider: cloudflare
    actor: HUMAN
    title: Mint short-lived read-only Cloudflare discovery token
    why: cf-terraforming reads existing resources; use a throwaway READ token, not the HCP edit token.
    run: |
      https://dash.cloudflare.com/profile/api-tokens -> Custom token -> READ scopes on each
      resource type to discover (DNS·Read, etc.), zone <apex-domain>, TTL a few hours. Copy the value.
    check: ~   # YAML null — ephemeral credential, no scriptable check (see header contract)
    produces: throwaway read token (deleted after import)
    docs: docs/import.md#discovery-token

  - id: migrate-import
    phase: 5
    provider: cloudflare
    actor: AGENT
    title: Generate HCL + import blocks, verify plan imports (not creates)
    why: Bring existing zone/records under management without recreating them.
    run: |
      Follow docs/import.md: cf-terraforming generate + import (--modern-import-block)
      into terraform/cloudflare/generated.tf, then verify plan shows imports only.
      In HCP mode: run terraform plan locally (credentials are in HCP workspace vars).
      In object-storage mode: commit generated.tf, push, trigger the plan workflow via
      `gh workflow run terraform-plan.yml --ref "$(git branch --show-current)"`, and inspect the workflow run logs.
    # One plan, captured once to a private mktemp file (0600, auto-removed), not a fixed
    # world-readable /tmp path. Success = at least one import AND zero creates. (If a change
    # legitimately adds a new resource alongside the import, review by hand — this check
    # intentionally treats any 'will be created' as not-done.)
    check: |
      if [ "$BACKEND" = "object-storage" ]; then
        # In object-storage mode, verify via the GitHub Actions plan workflow
        # A real cf-terraforming adoption splits its output by zone and resource type, so
        # `generated.tf` is one possible name among several, not the name.
        [ -n "$(git --no-optional-locks ls-files -- ':/terraform/cloudflare/generated*.tf')" ] || exit 1
        # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
        # Fail closed: if git status fails, treat as dirty rather than clean
        dirty_status=$(git status --porcelain -- terraform/cloudflare terraform/modules .infra-copilot/config.md mise.toml mise.lock) || {
          echo "git status failed - cannot verify working tree state" >&2
          exit 1
        }
        if [ -n "$dirty_status" ]; then
          echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
          exit 1
        fi
        # Find the newest commit that changed relevant paths
        target_sha=$(git log --format=%H -1 -- terraform/cloudflare terraform/modules .infra-copilot/config.md mise.toml mise.lock 2>/dev/null)
        [ -n "$target_sha" ] || exit 1
        # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
        branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
        run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
          --json databaseId,conclusion,event,headSha \
          -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null)
        [ -n "$run_info" ] || exit 1
        run_id=$(printf '%s' "$run_info" | jq -r '.databaseId')
        run_sha=$(printf '%s' "$run_info" | jq -r '.headSha')
        conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion')
        # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
        git merge-base --is-ancestor "$target_sha" "$run_sha" || exit 1
        [ "$conclusion" = "success" ] || exit 1
        # Get the job ID for plan-cloudflare
        job_id=$(gh run view "$run_id" --repo "$REPO" --json jobs \
          -q '.jobs[] | select(.name=="plan-cloudflare" and .conclusion=="success") | .databaseId' 2>/dev/null)
        [ -n "$job_id" ] || exit 1
        # Get logs for the specific job (avoids parsing issues with full run logs)
        job_logs=$(gh run view "$run_id" --repo "$REPO" --job "$job_id" --log 2>/dev/null)
        # Completion predicate:
        # - Reject if plan creates or destroys resources (import must be additive-only)
        # - Accept if 'will be imported' (pending) OR 'No changes' (done - post-apply no-op)
        if printf '%s' "$job_logs" | grep -q 'will be created'; then
          echo "Import check failed: plan would create resources" >&2
          exit 1
        fi
        if printf '%s' "$job_logs" | grep -qE 'will be destroyed|will be deleted'; then
          echo "Import check failed: plan would destroy resources" >&2
          exit 1
        fi
        # Reject state-forget actions (removed { destroy = false })
        if printf '%s' "$job_logs" | grep -qE 'will no longer be managed|will be forgotten'; then
          echo "Import check failed: plan would forget resources from state" >&2
          exit 1
        fi
        # Accept pending imports
        if printf '%s' "$job_logs" | grep -q 'will be imported'; then
          exit 0  # Pending imports - ready for apply
        fi
        # Accept no-op plan only if imports were actually applied (check apply workflow)
        if printf '%s' "$job_logs" | grep -qE 'No changes|Your infrastructure matches the configuration'; then
          # Verify imports were applied by checking for a successful apply-cloudflare run
          # this revision descends from. NOT one that descends from target_sha: on a prune
          # branch target_sha IS the prune commit, and nothing can have applied it before
          # the merge -- which would report every valid prune PR as an unfinished import.
          # The weaker test is still safe here, because a plan with pending imports says
          # 'will be imported' and a premature prune says 'will be created'; both are
          # rejected above, so only a genuinely realized leaf reaches this point.
          # --limit caps what is FETCHED, before any filtering, and the apply workflow
          # runs for every terraform/** push -- so ten runs of history can easily predate
          # nothing at all. A prune deferred by a couple of weeks needs to still find the
          # import's apply. --status success spends the budget only on runs that can
          # match; beyond 100, this reports red and a human confirms the apply.
          apply_runs=$(gh run list --repo "$REPO" --workflow terraform-apply.yml --branch main \
            --status success --limit 100 \
            --json databaseId,conclusion,headSha \
            -q '[.[] | select(.conclusion=="success")]' 2>/dev/null)
          found_valid_apply=false
          for apply_run in $(printf '%s' "$apply_runs" | jq -r '.[] | @base64'); do
            apply_sha=$(printf '%s' "$apply_run" | base64 -d | jq -r '.headSha')
            apply_id=$(printf '%s' "$apply_run" | base64 -d | jq -r '.databaseId')
            # Verify this revision descends from the applied commit
            if git merge-base --is-ancestor "$apply_sha" HEAD 2>/dev/null; then
              apply_job=$(gh run view "$apply_id" --repo "$REPO" --json jobs \
                -q '.jobs[] | select(.name=="apply-cloudflare" and .conclusion=="success") | .databaseId' 2>/dev/null)
              if [ -n "$apply_job" ]; then
                found_valid_apply=true
                break
              fi
            fi
          done
          if [ "$found_valid_apply" = "true" ]; then
            exit 0  # Import completed - apply workflow ran for the import commit
          fi
          echo "Import check: plan shows 'No changes' but this revision descends from no successful apply-cloudflare run" >&2
          echo "Run terraform-apply workflow to complete the import" >&2
          exit 1
        fi
        echo "Import check failed: expected 'will be imported' or 'No changes'" >&2
        exit 1
      else
        # HCP mode: local terraform plan. Accept EITHER pending imports OR a no-op plan:
        # once the import applies -- and especially once prune-spent-imports removes the
        # spent blocks -- the plan reads 'No changes.', which is the correct terminal
        # state. Demanding 'will be imported' made this step green only while work was
        # outstanding and permanently red once it was finished.
        # Committed HCL first, for BOTH outcomes below. A local plan reads the working
        # tree, so uncommitted generated HCL plans pending imports that no run can ever
        # apply -- and prune-spent-imports, which reads HEAD, would be green too, leaving
        # phase 5 all green with nothing committed. For the no-op outcome the same file is
        # what separates "everything was adopted" from "nothing ever was". Root-anchored,
        # because the plan below runs from inside the leaf.
        [ -n "$(git --no-optional-locks ls-files -- ':/terraform/cloudflare/generated*.tf')" ] || exit 1
        # Tracked is not committed: an edit to a tracked file still plans locally while
        # HEAD -- the thing CI applies, and the thing prune-spent-imports reads -- knows
        # nothing about it. Fail closed if the status read itself fails, as the
        # object-storage branch above does.
        # Same paths the object-storage branch above rejects on: a working-tree config.md
        # picks the backend and workspace this very check reads, and mise pins the
        # terraform that runs the plan -- so either one dirty means the plan came from a
        # configuration the commit does not describe.
        dirty=$(git --no-optional-locks status --porcelain -- ':/terraform/cloudflare' \
          ':/terraform/modules' ':/.infra-copilot/config.md' ':/mise.toml' ':/mise.lock') || {
          echo "git status failed - cannot verify the plan matches the commit" >&2
          exit 1
        }
        [ -z "$dirty" ] || {
          echo "uncommitted changes under terraform/cloudflare, the config, or the tool pins - commit before the plan is evidence" >&2
          exit 1
        }
        cd terraform/cloudflare
        p=$(mktemp)
        trap 'rm -f "$p"' EXIT
        terraform plan -input=false -no-color >"$p" 2>&1 || exit 1
        grep -q 'will be created' "$p" && exit 1
        grep -qE 'will be destroyed|will be deleted' "$p" && exit 1
        grep -qE 'will no longer be managed|will be forgotten' "$p" && exit 1
        grep -q 'will be imported' "$p" && exit 0
        grep -qE 'No changes|Your infrastructure matches the configuration' "$p"
      fi
    # Green means the COMMITTED config has no pending imports -- never that the provider
    # holds nothing else worth adopting: Terraform cannot see an unmanaged object, so a
    # second adoption request plans `No changes.` exactly like a finished one. An explicit
    # import run re-runs discovery regardless of this check; only the resume scan for work
    # already written into the config may trust it.
    produces: committed generated*.tf; a plan showing imports, or none left to make
    docs: migration.md

  - id: prune-spent-imports
    phase: 5
    provider: repo
    actor: AGENT
    title: No spent one-shot import/moved blocks left committed
    why: >-
      import/moved blocks execute once and go inert; nothing else removes them, so they
      accumulate in the consuming repo and the manifest cannot see them.
    run: |
      Follow docs/prune.md, one leaf per PR. It owns the procedure, including which
      evidence each backend allows: on HCP, `terraform state list` membership filters in
      front of the plan pair; in object-storage mode the bucket credential lives in
      Actions, so the two workflow plans carry it alone. Do not run a local `state list`
      there — it cannot authenticate.
      Success is `No changes.` — capture it for the PR body.
      If a block is still pending the apply has not landed: stop, and finish the import.
    # Pure git read: no terraform, no network, nothing written -- so status may run it
    # directly, unlike the migrate-import check above.
    #
    # It greps HEAD, not the working tree, because the claim is "still committed": a file
    # deleted on disk but not yet committed is a prune in progress, not a finished one.
    # The pathspec is root-anchored (`:/`) so the answer does not depend on the working
    # directory -- migrate-import above ends with a bare `cd terraform/cloudflare`, and a
    # runner that shares one shell across checks would otherwise silently scan one leaf.
    #
    # Deliberate ceiling: this asserts the blocks are GONE, not that the ones present are
    # spent, because spent-ness needs `terraform state list` (an init, i.e. a mutating
    # check status could not run). So a repo mid-import -- blocks written, apply not yet
    # landed -- also reads red here; the message names both readings, and the prune skill
    # itself refuses to remove a block whose address is missing from state. Tighten only
    # by teaching status to read state membership without touching the working tree.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: |
      # Not a repository, or one whose metadata cannot be read: that is ignorance, not
      # evidence, so it is exit 2 rather than a red step routing anyone to prune.
      git --no-optional-locks rev-parse --git-dir >/dev/null 2>&1 || exit 2
      # A repository with no commits yet: nothing CAN be committed, so nothing is left.
      git --no-optional-locks rev-parse --verify --quiet HEAD >/dev/null || exit 0
      # Structure is parsed, not pattern-matched: each committed blob is read once, `jq`
      # decides JSON and a single string-aware awk pass decides HCL. Both surfaces,
      # because phase 6 already accepts `*.tf.json` as leaf configuration.
      #
      # ONE primitive does the work: knowing whether a position is inside a quoted string.
      # Seven review rounds were spent adding special cases instead -- an end-of-line
      # anchor, a comment strip, an expression-position allow-list of `= ( , : [`, a
      # bounded header-comment state, and a rule against tracking /* */ at all -- and each
      # one was correct in isolation while the next context kept arriving: `#` inside a
      # string, `//` inside a string, `/*` inside `target = "example.com/*"`, `<<EOF`
      # inside `"cat <<EOF"`, a heredoc after `?`. They are all the same question. `scan()`
      # answers it once, and every one of those special cases is gone: no allow-list (so a
      # conditional arm opens a heredoc like any other expression), and /* */ is tracked
      # generally again (safe now, because a `/*` inside a string is not a comment).
      #
      # Consequence worth stating: dead HCL inside /* */ is a comment, so it is NOT
      # reported. That is a deliberate reversal -- it used to report, as the price of not
      # tracking regions -- and it is the correct reading of the file.
      #
      # Facts measured against terraform, not assumed, because the docs mislead on two:
      #   - the delimiter grammar is `[A-Za-z_][A-Za-z0-9_-]*`: `<<END-JSON` is valid,
      #     `<<END.JSON` and `<<1EOT` are rejected (1.16.1), and `checks/leaf-cloud.sh`
      #     already accepts the same class;
      #   - an indented terminator ends BOTH `<<EOT` and `<<-EOT`, so the trim is
      #     unconditional: a plain `<<EOT` body holding an indented `EOT` plus more text
      #     fails to parse with the error ON the following text (1.15.9 and 1.16.1);
      #   - a heredoc tag is never quoted -- `<<"EOT"` is shell, not HCL;
      #   - the opener brace ENDS its line: `import { to = x` with `id` on the next line is
      #     rejected as an "Invalid single-argument block definition" (1.15.9 and 1.16.1).
      #     HCL does allow a one-line single-argument block (`workspaces { name = "x" }`,
      #     see tests/test_hcp_apply_scope.py), but `import` and `moved` each require two
      #     arguments, so neither can take that form. Anchoring the opener at end of line
      #     is therefore complete, not a simplification.
      #
      # ponytail: a scanner, not an HCL parser, and the line is now a rule rather than a
      # list. A finding of the form "marker X inside context Y" is answered by `scan()` or
      # declined -- never by another special case, which is what turned this into seven
      # rounds. Declining is cheap: nothing destructive hangs off this step. It routes
      # status, it does not gate a deletion; a false positive sends someone to a runbook
      # that finds nothing, a false negative leaves inert blocks unflagged. The gate that
      # matters is the plan pair in docs/prune.md, which Terraform itself evaluates.
      # Known residual: `"${f(a, "b")}"` nests quotes inside interpolation, which this
      # counts naively. Reach for a real parser only if this ever gates something written.
      #
      # terraform/modules/ is excluded: one-shot blocks there are not this step's to call
      # leftover. Each consuming state reads them separately, so `moved` is the module's
      # upgrade path -- Terraform calls removing one a breaking change and recommends
      # retaining historical module moves -- and `import`, while genuinely spent once
      # applied, is spent only per consumer, a set no scan here can close. docs/prune.md
      # refuses both, so counting them would hold phase 5 red over work with no runbook.
      # ponytail: module blocks are left to a human; lift this when consumers are
      # enumerable (a lockfile of consuming states) rather than grepped for.
      # https://developer.hashicorp.com/terraform/language/modules/develop/refactoring
      command -v jq >/dev/null 2>&1 || {
        echo "jq is required to read Terraform JSON leaves - cannot verify" >&2
        exit 2
      }
      # A directory prefix, not a glob: ls-tree matches paths by prefix and takes no
      # :(exclude) magic, so extensions and terraform/modules/ are filtered in the loop.
      # --full-name and the root-anchored `:/` keep the answer independent of the working
      # directory -- migrate-import above ends with a bare `cd terraform/cloudflare`.
      list=$(mktemp) || exit 2
      found=$(mktemp) || exit 2
      trap 'rm -f "$list" "$found"' EXIT
      git --no-optional-locks ls-tree -r --full-name --name-only HEAD -- ':/terraform' >"$list" || {
        echo "git ls-tree failed - cannot verify what is committed" >&2
        exit 2
      }
      # An `import`/`moved` block opener, ignoring heredoc bodies and comments. HCL has no
      # nested one-shot blocks, so any surviving opener is top-level by definition.
      hcl_scan='
        # One string-aware pass. `q` (in a string) resets per line -- HCL strings do not
        # span lines; `c` (in a block comment) and `h` (in a heredoc) do not.
        function scan(s,   i, n, ch, out) {
          out = ""; n = length(s); i = 1
          while (i <= n) {
            ch = substr(s, i, 1)
            if (c) { if (ch == "*" && substr(s, i+1, 1) == "/") { c = 0; i += 2; out = out " " }
                     else i++
                     continue }
            if (q) { if (ch == "\\") { i += 2; continue }
                     if (ch == "\"") { q = 0; out = out "\""; i++; continue }
                     i++; continue }
            if (ch == "\"") { q = 1; out = out "\""; i++; continue }
            if (ch == "#") break
            if (ch == "/" && substr(s, i+1, 1) == "/") break
            if (ch == "/" && substr(s, i+1, 1) == "*") { c = 1; i += 2; out = out " "; continue }
            out = out ch; i++ }
          return out }
        { sub(/\r$/, "") }
        h != "" { t=$0; sub(/^[ \t]+/,"",t); sub(/[ \t]+$/,"",t); if (t == h) h=""; next }
        { q = 0; code = code scan($0)
          if (c) next                     # comment still open: one logical line continues
          if (code ~ /^[ \t]*(import|moved)[ \t]*\{[ \t]*$/) { f=1; exit }
          if (match(code, /<<[-~]?[A-Za-z_][A-Za-z0-9_-]*[ \t]*$/)) {
            m = substr(code, RSTART, RLENGTH)
            sub(/^<<[-~]?/, "", m); sub(/[ \t]*$/, "", m); h = m }
          code = "" }
        END { exit !f }'
      # Both lists are files, not shell strings: a literal newline inside a string -- or a
      # heredoc terminator, which must sit at column 0 -- dedents out of this YAML block
      # scalar and truncates the check. Redirecting a file in also keeps the loop out of a
      # pipeline subshell, where `exit 2` would exit only the subshell.
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        case "$f" in *.tf|*.tf.json) ;; *) continue ;; esac
        # Exactly what docs/prune.md discovers: root-level files of a leaf. A nested
        # `terraform/<leaf>/modules/...` is a module directory the runbook does not offer
        # as a candidate, so scanning it would hold phase 5 red with nothing to prune.
        rest=${f#terraform/}
        case "${rest%%/*}" in modules) continue ;; esac
        case "${rest#*/}" in */*) continue ;; esac
        blob=$(git --no-optional-locks show "HEAD:$f") || {
          echo "cannot read HEAD:$f - cannot verify what is committed" >&2
          exit 2
        }
        case "$f" in
          *.tf.json)
            # A .tf.json that does not parse is not evidence either way: terraform would
            # reject it too, so say so rather than calling the leaf clean.
            printf '%s' "$blob" | jq -e . >/dev/null 2>&1 || {
              echo "$f is not valid JSON - cannot verify what is committed" >&2
              exit 2
            }
            printf '%s' "$blob" | jq -e 'has("import") or has("moved")' >/dev/null 2>&1 \
              && printf '%s\n' "$f" >>"$found"
            ;;
          *)
            printf '%s' "$blob" | awk "$hcl_scan" && printf '%s\n' "$f" >>"$found"
            ;;
        esac
      done <"$list"
      [ -s "$found" ] || exit 0
      echo "one-shot import/moved blocks still committed in:" >&2
      cat "$found" >&2
      echo "If their apply has landed they are spent: infra-copilot:prune removes them." >&2
      echo "If it has not, they are still pending: finish infra-copilot:import first." >&2
      exit 1
    produces: a leaf whose plan is `No changes.` with no inert instruction blocks left
    docs: docs/prune.md

  # ── Phase 6 — additional providers (parameterized; optional) ────────────
  # Run the inventory once, then instantiate the remaining sequence once per
  # config.md `additional_providers` entry.
  - id: new-provider-inventory
    phase: 6
    provider: repo
    actor: HUMAN
    title: Every additional Terraform leaf has a provider-adoption record
    why: An untracked leaf may be an interrupted adoption and must not disappear from resume scans.
    run: |
      For every terraform/<leaf> other than cloudflare and github, add a matching
      `additional_providers` entry to .infra-copilot/config.md. Record the decision
      and credential inventory there; never delete an entry to hide red state.
    check: |
      # Validate provider names (common to both modes)
      jq -ne --argjson names "$ADDITIONAL_PROVIDER_NAMES" '
        $names | type == "array"
          and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
          and length == (unique | length)
          and index("cloudflare") == null
          and index("github") == null
          and index("modules") == null' >/dev/null || exit 1
      # HCP mode: also validate workspaces
      if [ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]; then
        jq -ne --argjson names "$ADDITIONAL_PROVIDER_NAMES" \
          --argjson workspaces "$ADDITIONAL_PROVIDER_WORKSPACES" '
            ($workspaces | type == "array"
              and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
              and length == (unique | length)
              and index("cloudflare") == null
              and index("github-org") == null)
            and ($names | length) == ($workspaces | length)' >/dev/null || exit 1
      fi
      declared_tools=$(printf '%s' "${ADDITIONAL_PROVIDER_MISE_TOOLS:-[]}" | jq -ce '
        select(type == "array")
        | select(all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:/+-]*$")))
        | unique') || exit 1
      if test -f mise.toml; then
        tools=$(mise config get --file ./mise.toml tools 2>/dev/null) || exit 1
        pinned=$(printf '%s\n' "$tools" |
          sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p')
        provider_tools=$(sed -n \
          's/^[[:space:]]*#[[:space:]]*infra-copilot:provider-cli[[:space:]]\{1,\}\([A-Za-z0-9][A-Za-z0-9_-]*\)[[:space:]]*$/\1/p' \
          mise.toml)
        general_tools=$(sed -n \
          's/^[[:space:]]*#[[:space:]]*infra-copilot:general-tool[[:space:]]\{1,\}\([^[:space:]]\{1,\}\)[[:space:]]*$/\1/p' \
          mise.toml)
        test "$(printf '%s\n' "$provider_tools" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$provider_tools" | sed '/^$/d' | wc -l | tr -d ' ')" || exit 1
        test "$(printf '%s\n' "$general_tools" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$general_tools" | sed '/^$/d' | wc -l | tr -d ' ')" || exit 1
        classified_tools=$(printf '%s\n%s\n' "$provider_tools" "$general_tools" | sed '/^$/d')
        test "$(printf '%s\n' "$classified_tools" | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$classified_tools" | wc -l | tr -d ' ')" || exit 1
        printf '%s\n' "$classified_tools" | while IFS= read -r tool; do
          test -z "$tool" && continue
          printf '%s\n' "$pinned" | grep -Fx "$tool" >/dev/null || exit 1
        done || exit 1
        printf '%s\n' "$pinned" | while IFS= read -r tool; do
          test -z "$tool" && continue
          case "$tool" in terraform|gh|jq|github:cloudflare/cf-terraforming) continue ;; esac
          printf '%s\n' "$classified_tools" | grep -Fx "$tool" >/dev/null || exit 1
        done || exit 1
        actual_tools=$(printf '%s\n' "$provider_tools" |
          jq -Rsc 'split("\n") | map(select(length > 0)) | unique') || exit 1
        jq -ne --argjson declared "$declared_tools" --argjson actual "$actual_tools" \
          '($actual - $declared | length) == 0' >/dev/null || exit 1
      fi
      for leaf in terraform/*/; do
        test -d "$leaf" || continue
        name=${leaf%/}; name=${name##*/}
        case "$name" in cloudflare|github|modules) continue ;; esac
        printf '%s' "$ADDITIONAL_PROVIDER_NAMES" \
          | jq -e --arg name "$name" 'index($name) != null' >/dev/null || exit 1
      done
    produces: complete durable inventory for every additional Terraform leaf
    docs: config.md

  - id: new-provider-decision
    phase: 6
    provider: repo
    actor: HUMAN
    title: Record the new-provider decision and its verification inventory
    why: A provider changes a locked design decision, and later runs need durable names for every check.
    run: |
      1. Add a row to .infra-copilot/decisions.md whose decision is exactly
         `Provider: <provider>`, choice is `adopt`, and status is `locked`.
      2. Add terraform/<provider> to terraform/README.md.
      3. For backend: hcp:
         Add an `additional_providers` entry to .infra-copilot/config.md with its
         lowercase name, HCP workspace, and every authentication variable's key,
         category, and sensitive flag. Inventory every workspace variable so undeclared
         credentials cannot survive a reused workspace. Record provider mise tools (or
         `[]`) and set `mise_config_blob: ""` and `mise_lock_blob: ""` until the HUMAN
         reviews the toolchain. Set
         `fork_speculative_plans_disabled: false` until that HUMAN check is performed.
         Set `fork_speculative_plans_workspace_id: ""` until the same check binds the
         attestation to the immutable HCP workspace identity.
         Set `credentials_verified_at: ""` until the credential handoff is complete.
         Never put a credential value in the repo.
         For backend: object-storage:
         Add an `additional_providers` entry to .infra-copilot/config.md with its
         lowercase name, provider mise tools (or `[]`), and `credential_secrets` list
         with `name` and `required` for each required GitHub Actions secret.
         Set `mise_config_blob: ""` and `mise_lock_blob: ""`.
         Set `credentials_verified_at: ""` until the secret handoff is complete.
      4. Reply `done`:
         For backend: hcp: the agent reloads config, exports NEW_PROVIDER,
         NEW_PROVIDER_WORKSPACE, and NEW_PROVIDER_CREDENTIALS, then re-runs this check.
         For backend: object-storage: the agent reloads config, exports NEW_PROVIDER
         and NEW_PROVIDER_SECRETS, then re-runs this check.
    check: |
      printf '%s' "$NEW_PROVIDER" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || exit 1
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -e '
        type == "array"
        and all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$"))
        and length == (unique | length)' >/dev/null || exit 1
      if test -n "$NEW_PROVIDER_MISE_CONFIG_BLOB"; then
        printf '%s\n' "$NEW_PROVIDER_MISE_CONFIG_BLOB" \
          | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || exit 1
      fi
      if test -n "$NEW_PROVIDER_MISE_LOCK_BLOB"; then
        printf '%s\n' "$NEW_PROVIDER_MISE_LOCK_BLOB" \
          | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || exit 1
      fi
      if test -n "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT"; then
        printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
          | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
        printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
          . as $raw
          | (try fromdateiso8601 catch null) as $epoch
          | ($epoch != null)
            and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
            and ($epoch <= now)' >/dev/null || exit 1
      fi
      if [ "$BACKEND" = "object-storage" ]; then
        printf '%s' "$NEW_PROVIDER_SECRETS" | jq -e '
          type == "array" and length > 0
          and all(.[];
            (.name | type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$"))
            and (.required | type == "boolean"))
          and length == (map(.name) | unique | length)' \
          >/dev/null || exit 1
      else
        printf '%s' "$NEW_PROVIDER_WORKSPACE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || exit 1
        case "$NEW_PROVIDER_FORK_PLANS_DISABLED" in true|false) : ;; *) exit 1 ;; esac
        if test -n "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID"; then
          printf '%s\n' "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID" \
            | grep -Eq '^ws-[A-Za-z0-9]+$' || exit 1
        fi
        printf '%s' "$NEW_PROVIDER_CREDENTIALS" | jq -e '
          type == "array" and length > 0
          and all(.[];
            (.key | type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$"))
            and (.category == "env" or .category == "terraform")
            and (.sensitive | type == "boolean"))
          and length == (map(.category + "\u0000" + .key) | unique | length)' \
          >/dev/null || exit 1
      fi
      awk -F '|' -v provider="$NEW_PROVIDER" '
        function clean(value) {
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
          return tolower(value)
        }
        BEGIN { found=0; expected="provider: " tolower(provider) }
        clean($2) == expected && clean($3) == "adopt" && clean($4) == "locked" { found=1 }
        END { exit !found }
      ' .infra-copilot/decisions.md || exit 1
      grep -Eq "(^|[^A-Za-z0-9_-])terraform/$NEW_PROVIDER(/|[^A-Za-z0-9_-]|$)" \
        terraform/README.md || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md \
        .infra-copilot/decisions.md terraform/README.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md \
        .infra-copilot/decisions.md terraform/README.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md \
        .infra-copilot/decisions.md terraform/README.md
    produces: locked provider decision plus a non-secret verification inventory
    docs: config.md

  - id: new-provider-leaf
    phase: 6
    provider: repo
    actor: AGENT
    title: Create the new Terraform leaf
    why: The backend and plan need committed provider configuration to target.
    run: |
      Create terraform/$NEW_PROVIDER with its versions, provider, and initial resource
      configuration. Do not create resources before new-provider-decision is green.
      - HCP mode: Its cloud block must select workspace $NEW_PROVIDER_WORKSPACE by name.
      - Object-storage mode: Its backend block must point to $STATE_BUCKET with a unique prefix.
      If the provider runbook requires a new CLI, add `# infra-copilot:provider-cli <key>`
      immediately before its exact same-name mise pin and refresh the lock, but
      do not execute the CLI or any later runbook commands until new-provider-toolchain is green.
      Commit the completed leaf, including the provider selections written to
      `.terraform.lock.hcl` by `terraform init -backend=false`, before re-running this check.
    check: |
      test -d "terraform/$NEW_PROVIDER" || exit 1
      if [ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]; then
        # HCP mode: verify cloud block
        settings=$(sh "$INFRA_COPILOT_REFERENCES/checks/leaf-cloud.sh" \
          "terraform/$NEW_PROVIDER" all)
        printf '%s\n' "$settings" | grep -Fx "workspaces.name=$NEW_PROVIDER_WORKSPACE" >/dev/null \
          || exit 1
        printf '%s\n' "$settings" | grep -Fx "organization=$ORG" >/dev/null || exit 1
        hostname=$(printf '%s\n' "$settings" | sed -n 's/^hostname=//p' | head -1)
        case "$hostname" in ""|app.terraform.io) : ;; *) exit 1 ;; esac
      else
        # Object-storage mode: verify backend block with complete path validation
        grep -q "backend \"$STATE_BACKEND\"" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
        # Use -F for literal string matching (bucket names may contain regex chars like .)
        grep -Fq "$STATE_BUCKET" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
        # Validate complete prefix/key path matches backend-config convention
        # Escape regex special chars in STATE_PREFIX (e.g., + . *)
        escaped_prefix=$(printf '%s' "$STATE_PREFIX" | sed 's/[.+*?^$[\]\\|(){}]/\\&/g')
        case "$STATE_BACKEND" in
          gcs)
            # GCS uses prefix = "STATE_PREFIX/NEW_PROVIDER"
            grep -E "prefix[[:space:]]*=[[:space:]]*\"$escaped_prefix/$NEW_PROVIDER\"" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
            ;;
          s3|azurerm)
            # S3/Azure uses key = "STATE_PREFIX/NEW_PROVIDER/terraform.tfstate"
            grep -E "key[[:space:]]*=[[:space:]]*\"$escaped_prefix/$NEW_PROVIDER/terraform\\.tfstate\"" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
            ;;
        esac
      fi
      git ls-files "terraform/$NEW_PROVIDER/*.tf" \
        "terraform/$NEW_PROVIDER/*.tf.json" | grep -q . || exit 1
      git ls-files --error-unmatch \
        "terraform/$NEW_PROVIDER/.terraform.lock.hcl" >/dev/null 2>&1 || exit 1
      test -z "$(git --no-optional-locks status --porcelain -- "terraform/$NEW_PROVIDER")"
    produces: terraform/$NEW_PROVIDER leaf with appropriate backend configuration
    docs: protocol.md#resume-protocol

  - id: new-provider-toolchain
    phase: 6
    provider: repo
    actor: HUMAN
    title: Review and trust the provider's changed executable toolchain
    why: A newly pinned provider CLI changes executable configuration after the initial setup trust gate.
    run: |
      Review the complete mise.toml diff and mise.lock URLs. If they are expected, record
      `git hash-object mise.toml` as this provider's `mise_config_blob` and
      `git hash-object mise.lock` as its `mise_lock_blob`, commit all four reviewed files,
      run `mise trust mise.toml`, then install every
      configured tool with `MISE_LOCKED=1` as documented in docs/setup.md. Reply
      `done`; the agent re-runs this check. Once every provider toolchain gate is
      green, it runs the complete preflight once per provider entry, exporting that
      entry's NEW_PROVIDER_MISE_TOOLS so its conditional provider CLI is verified.
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock .infra-copilot/config.md >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock .infra-copilot/config.md &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock .infra-copilot/config.md &&
      current_mise_blob=$(git hash-object -- mise.toml) &&
      current_mise_lock_blob=$(git hash-object -- mise.lock) &&
      [ "$NEW_PROVIDER_MISE_CONFIG_BLOB" = "$current_mise_blob" ] &&
      [ "$NEW_PROVIDER_MISE_LOCK_BLOB" = "$current_mise_lock_blob" ] &&
      repo_dir=$(pwd -P) &&
      mise trust --show 2>/dev/null | grep -Fx "$repo_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -r '.[]' |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      printf '%s\n' "$pinned" | grep -Fx "$tool" >/dev/null || exit 1;
      MISE_LOCKED=1 mise install --dry-run-code "$tool" >/dev/null 2>&1 || exit 1;
      pin=$(mise config get --file ./mise.toml "tools.$tool" 2>/dev/null | tr -d '[:space:]');
      active=$(MISE_LOCKED=1 mise which "$tool" --version 2>/dev/null | tr -d '[:space:]');
      resolved=$(MISE_LOCKED=1 mise which "$tool" 2>/dev/null) || exit 1;
      [ -n "$pin" ] && [ "$active" = "$pin" ] && [ -x "$resolved" ] || exit 1;
      MISE_LOCKED=1 mise exec "$tool" -- sh -c
      '[ "$(command -v "$1")" = "$2" ]' sh "$tool" "$resolved" || exit 1;
      done
    produces: human-reviewed, trusted, locked provider toolchain; complete preflight green
    docs: docs/setup.md#6-local-development

  - id: new-provider-lock
    phase: 6
    provider: repo
    actor: AGENT
    title: Verify committed selections for every required provider
    why: The trust gate must activate Terraform before lock validation, while HCP must not invent missing selections remotely.
    run: |
      After new-provider-toolchain and the complete preflight are green, inspect the
      committed dependency lock. If a required provider selection is missing, run
      `terraform init -backend=false` in terraform/$NEW_PROVIDER and commit the reviewed
      `.terraform.lock.hcl` before re-running this check.
    check: |
      provider_output=$(mktemp) || exit 1
      trap 'rm -f "$provider_output"' EXIT
      terraform -chdir="terraform/$NEW_PROVIDER" providers \
        >"$provider_output" 2>/dev/null || exit 1
      required_providers=$(sed -n 's/.*provider\[\([^]]*\)\].*/\1/p' \
        "$provider_output" | sort -u) || exit 1
      test -n "$required_providers" || exit 1
      printf '%s\n' "$required_providers" | while IFS= read -r provider; do
        case "$provider" in terraform.io/builtin/*) continue ;; esac
        awk -v target="$provider" '
          $1 == "provider" {
            address=$2; gsub(/^"|"$/, "", address)
            selected=(address == target); version=0; in_hashes=0; checksum=0
          }
          selected && $1 == "version" && $2 == "=" && $3 ~ /^"[^"]+"$/ { version=1 }
          selected && $1 == "hashes" && $2 == "=" && $3 == "[" { in_hashes=1 }
          selected && in_hashes && $1 ~ /^"(h1:|zh:)[^"]+",?$/ { checksum=1 }
          selected && /^}/ { complete=(version && checksum); selected=0 }
          END { exit !complete }
        ' "terraform/$NEW_PROVIDER/.terraform.lock.hcl" || exit 1
      done
    produces: committed lock selections and checksums for every required provider
    docs: protocol.md#resume-protocol

  - id: new-provider-workspace-bootstrap
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Create the workspace and make it visible to the plan-only team
    why: A missing or invisible workspace is expected setup work, not an unverifiable terminal state.
    run: |
      Using a user or organization token yourself, load hcp.md's helpers, resolve the
      repository-specific OAuth token, create/configure the workspace, and grant the
      plan-only team `Plan` (never `Write`):

        load_tf_version
        resolve_oauth_token_id
        create_ws "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"
        set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"

      Restore the plan-only credential before replying `done`; this check distinguishes
      the expected missing/invisible state from network, authentication, and API failures.
    tri_state: true
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      code=$(curl -sS -o /dev/null -w '%{http_code}' \
        "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      case "$code" in
        200) exit 0 ;;
        404) exit 1 ;;
        *) exit 2 ;;
      esac
    produces: workspace exists and is visible to the restored plan-only credential
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: new-provider-workspace
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Create and safely configure the new HCP workspace
    why: The leaf needs a remote, VCS-backed workspace with path-scoped plans and auto-apply disabled.
    run: |
      If this verification finds drift after Plan access is established, use a user or
      organization token yourself and run hcp.md's set_workspace_config helper (it
      reconciles every asserted setting, including an already-existing workspace):

        load_tf_version
        resolve_oauth_token_id
        set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"

      If the helper reports a mismatched existing working directory, inspect the named
      workspace ID first. Export `CONFIRM_WORKSPACE_ID` to that exact ID only when it is
      truly this provider's workspace; otherwise choose a different workspace name.
      Restore the plan-only credential before replying `done` so the agent can verify
      the settings without receiving your privileged token.
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      body=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      printf '%s' "$body" \
        | jq -e --arg dir "terraform/$NEW_PROVIDER" --arg repo "$REPO" --arg tf_version "$TERRAFORM_VERSION" '
            .data.attributes as $a
            | ($a["working-directory"] == $dir)
              and ($a["execution-mode"] == "remote")
              and ($a["terraform-version"] == $tf_version)
              and ($a["auto-apply"] == false)
              and ($a["auto-destroy-at"] == null)
              and ($a["auto-destroy-activity-duration"] == null)
              and ($a["speculative-enabled"] == true)
              and ($a["file-triggers-enabled"] == true)
              and ($a["queue-all-runs"] == false)
              and ($a["global-remote-state"] == false)
              and ((($a["trigger-patterns"] // []) | sort)
                   == ([$dir + "/**", "terraform/modules/**", ".infra-copilot/config.md", "mise.toml"] | sort))
              and (($a["vcs-repo"].identifier // "") == $repo)
              and (($a["vcs-repo"].branch // "") == "main")' >/dev/null
      rc=$?
      case "$rc" in
        0) exit 0 ;;
        1) exit 1 ;;
        *) exit 2 ;;
      esac
    tri_state: true
    produces: configured HCP workspace visible to the plan-only credential
    docs: hcp.md#phase-1--workspaces

  - id: new-provider-plan-access
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Verify the plan-only team has Plan access and nothing stronger
    why: Workspace visibility alone does not prove that the credential can plan without applying or reconfiguring workspaces.
    run: |
      Using a user or organization token yourself, grant the plan-only team `Plan`
      (never `Write`) on $NEW_PROVIDER_WORKSPACE. Restore the plan-only credential
      before replying `done`; the repository-derived inventory then verifies that it
      can plan but cannot apply or update any workspace.
    tri_state: true
    check: HCP_SCOPE_WORKSPACE="$NEW_PROVIDER_WORKSPACE" sh "$INFRA_COPILOT_REFERENCES/checks/hcp-apply-scope.sh"
    produces: Plan access with no apply or workspace-update permission
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: new-provider-fork-safety
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Confirm fork speculative plans are disabled before adding credentials
    why: The fork-specific UI toggle can expose sensitive workspace variables to untrusted fork code.
    run: |
      In HCP workspace $NEW_PROVIDER_WORKSPACE, open Settings -> Version Control and
      confirm speculative plans from forks are disabled. This is separate from the API's
      `speculative-enabled` attribute. Then set this provider entry's
      `fork_speculative_plans_disabled` value to `true` and record the workspace's
      immutable `ws-...` ID as `fork_speculative_plans_workspace_id`. Commit config.md,
      reload it, and reply `done` so the agent re-runs this durable attestation check.
    check: |
      test "$NEW_PROVIDER_FORK_PLANS_DISABLED" = "true" || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md || exit 1
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      body=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      actual_id=$(printf '%s' "$body" \
        | jq -er '.data.id | select(type == "string" and test("^ws-[A-Za-z0-9]+$"))' \
          2>/dev/null) || exit 2
      test "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID" = "$actual_id"
    tri_state: true
    produces: durable human attestation that fork plans cannot receive provider credentials
    docs: docs/setup.md#2-hcp-terraform--workspaces

  - id: new-provider-credentials
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Put the provider credential configuration in HCP
    why: The first plan must authenticate without exposing credential values to the agent or repository.
    run: |
      Mint or configure the provider's least-privilege credential as its runbook
      requires. In HCP workspace $NEW_PROVIDER_WORKSPACE, reconcile every variable to
      the exact NEW_PROVIDER_CREDENTIALS inventory by key, category, and sensitive flag;
      delete undeclared leftovers before continuing. Detach any effective variable sets
      first; their inherited variables cannot be proven by this workspace-local inventory.
      Paste secret values yourself; never send them to the agent. Reply `done` so
      the agent can verify metadata through the vars API. After every declared variable
      is installed, record the current UTC time as `credentials_verified_at` in config.md
      using strict `YYYY-MM-DDTHH:MM:SSZ`, commit the config, and then reply `done`.
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      workspace_body=$(curl -sf \
        "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      WS_ID=$(printf '%s' "$workspace_body" \
        | jq -er '.data.id | select(type == "string" and length > 0)' 2>/dev/null) \
        || exit 2
      varset_body=$(curl -sf \
        "$hcp_api/workspaces/$WS_ID/varsets?page%5Bsize%5D=1&page%5Bnumber%5D=1" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      varset_count=$(printf '%s' "$varset_body" \
        | jq -er '.data | select(type == "array") | length' 2>/dev/null) || exit 2
      test "$varset_count" -eq 0 || exit 1
      pages=$(mktemp) || exit 2
      trap 'rm -f "$pages"' EXIT
      : >"$pages" || exit 2
      page=1
      while : ; do
        body=$(curl -sf \
          "$hcp_api/workspaces/$WS_ID/vars?page%5Bsize%5D=100&page%5Bnumber%5D=$page" \
          -H "Authorization: Bearer $HCP_TOKEN") || exit 2
        printf '%s' "$body" | jq -e '
          (.data | type == "array")
          and (.meta.pagination | type == "object")
          and ((.meta.pagination["next-page"] == null)
            or (.meta.pagination["next-page"]
              | type == "number" and . == floor and . > 0))' >/dev/null 2>&1 \
          || exit 2
        printf '%s\n' "$body" >>"$pages"
        next_page=$(printf '%s' "$body" \
          | jq -r '.meta.pagination["next-page"] // empty') || exit 2
        test -n "$next_page" || break
        test "$next_page" -eq $((page + 1)) || exit 2
        page=$next_page
      done
      jq -se --argjson expected "$NEW_PROVIDER_CREDENTIALS" '
        [.[].data[] | .attributes
          | {key: .key, category: .category, sensitive: .sensitive}]
          | sort_by(.category, .key) as $actual
        | ($expected
            | map({key: .key, category: .category, sensitive: .sensitive})
            | sort_by(.category, .key)) as $wanted
        | ($expected | type == "array" and length > 0)
          and ($actual == $wanted)' "$pages" >/dev/null || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
        | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
        . as $raw
        | (try fromdateiso8601 catch null) as $epoch
        | ($epoch != null)
          and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
          and ($epoch <= now)' >/dev/null || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md
    tri_state: true
    produces: exact declared workspace-variable metadata in HCP
    docs: docs/secrets.md

  - id: new-provider-plan
    phase: 6
    provider: repo
    actor: AGENT
    when: '[ "$BACKEND" = "hcp" ] || [ -z "$BACKEND" ]'
    title: Run the first plan on the new leaf
    why: This proves the leaf, workspace access, and provider credentials end to end.
    run: |
      If the newest matching HCP run is `policy_soft_failed`, stop and emit a HUMAN
      handoff to review the policy result and either fix the configuration or explicitly
      override/discard it; do not queue another run while that decision is pending.
      Ensure the current non-main branch has an open pull request (a draft is enough;
      create one with `gh pr create --draft` when absent), then push the current
      committed branch to its configured upstream so HCP can ingest the branch tip;
      never push a dirty or detached checkout. Wait until the workspace's VCS run list
      contains an ingested commit whose `terraform/$NEW_PROVIDER`, shared
      `terraform/modules`, `.infra-copilot/config.md`, and `mise.toml` trees equal the
      current committed versions, then run
      `sh "$INFRA_COPILOT_REFERENCES/checks/hcp-current-plan.sh" queue` to queue a
      plan-only retry using that configuration version. The helper explicitly includes
      the configuration-version relationship in POST /runs; a CLI-driven or
      latest-configuration fallback run has no trustworthy commit correlation. Wait for
      the run to finish, then re-run this check.
    tri_state: true
    check: sh "$INFRA_COPILOT_REFERENCES/checks/hcp-current-plan.sh"
    produces: safe green plan, or a safe no-create plan after the adoption has applied resources
    docs: docs/hcp-api.md

  # ── Phase 6 — additional providers (object-storage mode) ────────────────
  - id: new-provider-secrets-gha
    phase: 6
    provider: github
    actor: HUMAN
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Add the provider credentials as GitHub Actions secrets
    why: The workflow must authenticate to the provider without exposing credentials.
    run: |
      Mint or configure the provider's least-privilege credential as its runbook requires.
      Go to repo Settings -> Secrets and variables -> Actions and add each secret from
      the NEW_PROVIDER_SECRETS inventory. After all secrets are installed, record the
      current UTC time as `credentials_verified_at` in config.md using strict
      `YYYY-MM-DDTHH:MM:SSZ`, commit the config, and reply `done`.
    check: |
      secrets=$(gh secret list --json name -q '.[].name' 2>/dev/null) || exit 1
      printf '%s' "$NEW_PROVIDER_SECRETS" | jq -r '.[] | select(.required == true) | .name' |
        while IFS= read -r name; do
          test -z "$name" && continue
          echo "$secrets" | grep -Fxq "$name" || exit 1
        done || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
        | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
        . as $raw
        | (try fromdateiso8601 catch null) as $epoch
        | ($epoch != null)
          and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
          and ($epoch <= now)' >/dev/null || exit 1
      git ls-files --error-unmatch .infra-copilot/config.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- .infra-copilot/config.md || exit 1
      git diff --cached --quiet HEAD -- .infra-copilot/config.md
    produces: GitHub Actions secrets for provider authentication
    docs: docs/ci.md#github-actions

  - id: new-provider-workflow-gha
    phase: 6
    provider: github
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Update GitHub Actions workflows for the new provider
    why: The plan and apply workflows must include the new leaf.
    run: |
      Update .github/workflows/terraform-plan.yml and terraform-apply.yml to:
      1. Add a path filter for terraform/$NEW_PROVIDER/** AND shared inputs:
         - terraform/modules/**
         - mise.toml
         - mise.lock
         - .infra-copilot/config.md
      2. Add plan/apply jobs for the new leaf
      3. Pass the required secrets from NEW_PROVIDER_SECRETS as environment variables
      4. Add the provider-specific authentication step before terraform init (e.g., google-github-actions/auth for GCP, aws-actions/configure-aws-credentials for AWS, azure/login for Azure)
      5. Add $NEW_PROVIDER to the validate matrix in terraform-plan.yml
      6. Add plan-$NEW_PROVIDER to the aggregate `plan` job's `needs` list
      7. Wire up the changes job output and apply job if-condition for $NEW_PROVIDER
      Commit the updated workflows before re-running this check.
    check: |
      # File existence and git tracking
      test -f .github/workflows/terraform-plan.yml || exit 1
      test -f .github/workflows/terraform-apply.yml || exit 1
      git ls-files --error-unmatch \
        .github/workflows/terraform-plan.yml \
        .github/workflows/terraform-apply.yml >/dev/null 2>&1 || exit 1
      # Workflows are committed (no uncommitted changes)
      git diff --quiet HEAD -- .github/workflows/terraform-plan.yml \
        .github/workflows/terraform-apply.yml || exit 1
      # YAML syntax validation skipped - workflow execution will catch malformed files
      # Basic job existence for the new provider
      grep -q "plan-$NEW_PROVIDER:" .github/workflows/terraform-plan.yml || exit 1
      grep -q "apply-$NEW_PROVIDER:" .github/workflows/terraform-apply.yml || exit 1
      # Path filter mentions the new provider (either form)
      grep -q "terraform/$NEW_PROVIDER" .github/workflows/terraform-plan.yml || exit 1
      grep -q "terraform/$NEW_PROVIDER" .github/workflows/terraform-apply.yml || exit 1
      # Environment protection verified by gha-environments (phase 1) which checks the
      # production environment exists with required reviewers. New provider jobs should
      # copy the environment: production setting from apply-cloudflare/apply-github.
    produces: GitHub Actions workflows updated for new provider
    docs: docs/ci.md#github-actions

  - id: new-provider-plan-gha
    phase: 6
    provider: repo
    actor: AGENT
    when: '[ "$BACKEND" = "object-storage" ]'
    title: Verify plan on the new leaf in GitHub Actions
    why: Proves the leaf, backend, and provider credentials end to end in CI.
    run: |
      Inspect the GitHub Actions plan workflow for terraform/$NEW_PROVIDER.
      Trigger via `gh workflow run terraform-plan.yml --repo "$REPO" --ref "$(git branch --show-current)"` or open a PR,
      and verify the plan job for $NEW_PROVIDER succeeds.
    check: |
      # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
      # Fail closed: if git status fails, treat as dirty rather than clean
      dirty_status=$(git status --porcelain -- "terraform/$NEW_PROVIDER" terraform/modules .infra-copilot/config.md mise.toml mise.lock) || {
        echo "git status failed - cannot verify working tree state" >&2
        exit 1
      }
      if [ -n "$dirty_status" ]; then
        echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
        exit 1
      fi
      # Find the newest commit that changed relevant paths
      target_sha=$(git log --format=%H -1 -- "terraform/$NEW_PROVIDER" terraform/modules .infra-copilot/config.md mise.toml mise.lock 2>/dev/null)
      [ -n "$target_sha" ] || exit 1
      # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
      branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
      run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
        --json databaseId,conclusion,event,headSha \
        -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null)
      [ -n "$run_info" ] || exit 1
      run_id=$(printf '%s' "$run_info" | jq -r '.databaseId')
      run_sha=$(printf '%s' "$run_info" | jq -r '.headSha')
      conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion')
      # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
      git merge-base --is-ancestor "$target_sha" "$run_sha" || exit 1
      [ "$conclusion" = "success" ] || exit 1
      gh run view "$run_id" --repo "$REPO" --json jobs \
        -q ".jobs[] | select(.name==\"plan-$NEW_PROVIDER\" and .conclusion==\"success\") | .name" 2>/dev/null | grep -q "plan-$NEW_PROVIDER"
    produces: green plan for new provider leaf in GitHub Actions
    docs: docs/state.md#object-storage-backend
