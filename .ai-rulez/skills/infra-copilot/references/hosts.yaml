# Per-host capability records for the four hosts infra-copilot ships to.
#
# WHY THIS FILE EXISTS
#
# Three separate surfaces need the same fact — "what does this host call that, and
# where does it read it from": the question tool a skill may use for a real choice,
# the dialect a subagent manifest must be written in, and the path a host discovers
# a hook manifest at. Written three times they drift three ways, so they are written
# here once and every consumer reads this table.
#
# WHO GENERATES IT: nobody. `ai-rulez` emits rules, context, and skills only — it has
# no agent or hook surface (`ai-rulez add --help` lists context/rule/skill). So the
# per-host artifacts this table describes are HAND-AUTHORED, and scripts/validate.py
# holds them to this file instead. This file itself is copied verbatim into every host
# package by `make generate`, exactly as steps.yaml is, so every host ships the table
# it is described by. Do not add a second generator for one agent and two manifests.
#
# EVIDENCE. Every `verified: true` below was established by running the host, not by
# reading a convention off another repository. `verified: false` records what could not
# be established and why — it is a finding, not a TODO, and shipping wiring on a guess
# is what these records exist to prevent.
#
# Field contract
#   question_tool.name     the host's native single-decision tool
#   question_tool.modes    binary | single | multi — which this host actually supports
#   question_tool.choices  [min, max] selectable options, excluding the custom-input escape
#   agent.path             where the host discovers a subagent manifest, relative to plugin root
#   agent.tools_dialect    how that manifest's `tools` key must be shaped
#   agent.tool_names       this host's names for the read+shell capabilities infra-auditor needs
#   hook.path              where the host discovers a hook manifest, relative to plugin root
#   hook.matcher           the matcher value that host accepts for SessionStart

hosts:
  claude:
    display_name: Claude Code
    question_tool:
      name: AskUserQuestion
      modes: [binary, single, multi]
      choices: [2, 4]
      verified: true  # declared in commands/*.md allowed-tools and available in-session
    agent:
      path: agents/
      tools_dialect: comma_string   # tools: Read, Bash, Glob, Grep
      tool_names: [Read, Bash, Glob, Grep]
      verified: true
      # Root agents/, NOT .claude-plugin/agents/. Established with
      # `claude plugin details infra-copilot`: hiding .claude-plugin/agents/ still
      # reported "Agents (1)", hiding root agents/ reported "Agents (0)". A plugin.json
      # may name an explicit `agents` array instead, as litestar's does, but ours is
      # generated by ai-rulez, which drops the key silently -- so root agents/ is the
      # only path this repository has, and Antigravity's claim on it is why that host
      # goes without.
    hook:
      path: hooks/hooks.json
      matcher: startup|resume|clear|compact
      verified: true  # shipped since #18; auto-discovered with no plugin.json reference

  antigravity:
    display_name: Antigravity
    question_tool:
      name: ask_question
      modes: [binary, single, multi]
      choices: [2, 4]
      verified: false  # tool name present in the agy binary; modes/choices not exercised
    agent:
      path: agents/
      tools_dialect: yaml_list      # tools:\n  - view_file
      tool_names: [view_file, grep_search, find_by_name, run_command]
      verified: false
      # NOT SHIPPED, and this is a collision rather than a missing fact.
      #
      # The dialect itself is established: installing a probe plugin with Claude's
      # comma-string form was reported "1 processed" by `agy plugin validate` and then
      # never appeared in `agy agent`; re-authored as the YAML list above, it appeared.
      # A wrong dialect fails silently, which is the whole argument for this table.
      #
      # But Antigravity and Claude BOTH discover root agents/ and neither offers an
      # override: an `agents` key in the hand-authored root plugin.json was ignored by
      # `agy plugin install`, which copied root agents/ regardless and left `agy agent`
      # showing none. One path, two incompatible `tools` shapes, so the agent ships to
      # exactly one host. Claude has it because that is where the rest of this plugin's
      # surface lives. Antigravity's absence is silent and harmless; shipping the YAML
      # list instead would hand Claude an agent whose whole tool grant is names it does
      # not have.
    hook:
      path: hooks.json              # ROOT, not hooks/hooks.json
      matcher: "*"
      verified: true
      # `agy plugin validate` reports "hooks: skipped (not found)" for this repo's
      # hooks/hooks.json and "hooks: 1 processed" once a root hooks.json exists.
      # Claude keeps reading hooks/hooks.json, so the two coexist and each fires once.
      # The root manifest takes NO extra top-level keys: a "_comment" array beside
      # "hooks" was counted as a second hook ("hooks: 2 processed"), so the rationale
      # for that file lives here instead of in it.

  codex:
    display_name: Codex CLI
    question_tool:
      name: request_user_input
      modes: [binary, single]
      choices: [2, 3]
      verified: false
      # Gated behind `tools.experimental_request_user_input`, so it is frequently absent
      # even on a current Codex. The declared-and-allowed test in protocol.md covers this.
    agent:
      path: .codex/agents/          # <name>.toml, body under developer_instructions
      tools_dialect: toml_inherited # no tools key; the session's tools are inherited
      tool_names: []
      verified: false               # dialect read off an installed plugin, not exercised here
    hook:
      path: hooks/hooks-codex.json
      matcher: "*"
      verified: false
      # NOT SHIPPED. Codex 0.154.0 fired no SessionStart hook from root hooks.json,
      # hooks/hooks.json, or hooks/hooks-codex.json, with and without
      # `--enable plugin_hooks`, and with `"hooks": "./hooks.json"` in
      # .codex-plugin/plugin.json. The binary carries a hook trust review
      # ("hooks need review before they can run") that a non-interactive session
      # cannot satisfy. Ship the manifest when a real session proves it fires.

  opencode:
    display_name: OpenCode
    question_tool:
      name: question
      modes: [binary, single, multi]
      choices: [2, 4]
      verified: false
    agent:
      path: .opencode/agents/
      tools_dialect: bool_map       # mode: subagent, then tools: {read: true, ...}
      tool_names: [read, grep, glob, bash]
      verified: false               # dialect read off an installed plugin, not exercised here
    hook:
      path: null
      matcher: null
      verified: false
      # OpenCode has no hook manifest. It installs by copying skills into the consuming
      # repo (`skills add --copy`, see `make smoke-opencode`), so there is no plugin root
      # to discover one from. A JS entrypoint would be a second install surface for one
      # announcement; #42 declined it.
