  - id: new-provider-fork-safety
    operation: provider-fork-safety
    implementation: hcp
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$NEW_PROVIDER_BACKEND" = "hcp" ]'
    title: Confirm fork speculative plans are disabled before adding credentials
    why: The fork-specific UI toggle can expose sensitive workspace variables to untrusted fork code.
    check_summary: Config records fork_speculative_plans_disabled as true and the workspace ID of $NEW_PROVIDER_WORKSPACE, committed.
    ui:
      - form: Disable speculative plans from forks (separate from the API's speculative-enabled attribute)
        url: https://app.terraform.io/app/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE/settings/vcs
        fields: |
          Page | Settings, then Version Control
          Automatic speculative plans | Leave enabled
          Run speculative plans on pull requests from forks | Disabled (unchecked)
          After changing | Save settings
    cli:
      - effect: Prints the workspace's immutable ws- ID to record as fork_speculative_plans_workspace_id. It only reads, with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            curl -sf --config <(auth) \
              "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" | jq -er '.data.id'
          )
    run: |
      After the human confirms the toggle, they set this provider entry's
      `fork_speculative_plans_disabled` to `true` and record the ID printed above as
      `fork_speculative_plans_workspace_id`, commit the README and reload its Config block; then re-run this
      durable attestation check.
    check: |
      test "$NEW_PROVIDER_FORK_PLANS_DISABLED" = "true" || exit 1
      git ls-files --error-unmatch README.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- README.md || exit 1
      git diff --cached --quiet HEAD -- README.md || exit 1
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      body=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      actual_id=$(printf '%s' "$body" \
        | jq -er '.data.id | select(type == "string" and test("^ws-[A-Za-z0-9]+$"))' \
          2>/dev/null) || exit 2
      test "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID" = "$actual_id"
    tri_state: true
    produces: durable human attestation that fork plans cannot receive provider credentials
    docs: docs/setup.md#2-hcp-terraform--workspaces

  - id: new-provider-plan-access-gha
    operation: provider-plan-access
    implementation: object-storage
    phase: 6
    provider: repo
    actor: AGENT
    when: '[ "$NEW_PROVIDER_BACKEND" = "object-storage" ]'
    not_applicable: No local workspace team grant; use the protected runner and approval contract in provision-provider-execution.
    title: Record execution-specific non-applicability
    why: The shared operation must account for both implementations.
    run: Follow object-storage.md's safety contract; do not invent a local credential.
    check: 'true'
    produces: documented not-applicable result
    docs: object-storage.md#plan-access

  - id: new-provider-fork-safety-gha
    operation: provider-fork-safety
