# Machine-readable manifest shared by the infra-skills skills
# (setup/import/prune/add/status).
#
# Read this alongside protocol.md and whichever action skill (setup/import/prune/add/status)
# routes into it. An agent walks these steps
# top-to-bottom. On every run it FIRST executes each step's `check` to find where
# setup already is (resume protocol), then resumes at the first red check.
#
# Field contract
#   id        stable slug, referenced by SKILL.md
#   operation backend-neutral contract slug; see operations.md
#   implementation hcp | object-storage | both (shared implementation)
#   not_applicable explicit reason; report N/A, never treat as proved safety
#   phase     0..6, matches SKILL.md phases
#   provider  hcp | cloudflare | github | gcp | repo
#   actor     AGENT  -> agent executes directly
#             HUMAN  -> agent STOPS, emits the handoff block (see SKILL.md), waits
#                       for "done", then runs `check` before continuing
#   title     one line
#   why       what this unblocks (goes in the handoff block's "Why:")
#   run       AGENT steps: the command(s) the agent runs
#             HUMAN steps: the human_action text (browser instructions). On a step that also
#             carries `cli` or `ui`, only what the agent does around the human's work (record
#             a decision or evidence); the human's commands and forms live in `cli`/`ui`.
#   when      optional shell condition. If present and evaluates false, skip this step.
#             Use the scope-specific selectors in operations.md, never $BACKEND.
#   refresh_credentials optional. Refresh selected config exports after this member
#             passes, before checking its next member (never wait for the whole operation).
#   tri_state optional. `true` means this check reserves exit 2 for "could not verify"
#             (see protocol.md). Absent/false: any non-zero exit is red, which is the
#             default because ordinary tools use 2 for their own errors — jq exits 2 on
#             a missing input file.
#   cli       optional, HUMAN steps. A list of `- effect:` (one line saying what the command
#             changes) plus `run: |` (the exact command, non-secret values filled from the
#             Config block). A command never carries a secret as an argument: it reads one
#             from a hidden prompt, `read -rs`, or a file redirect.
#   ui        optional, HUMAN steps. A list of forms, each with `url:` (a link using the
#             variables Step 0 exports), an optional one-line `form:` name, and `fields: |`
#             (one `field | value` row per line). Every form is a complete table.
#             `$VAR` in a cli `run` or a ui row is a Config export (see config.md Step 0); the
#             agent substitutes the value before printing. The manifest holds no
#             probe list: pacing probes are the read-only counterpart of a command's verb
#             (see protocol.md, The handoff block).
#   check_summary required once a step carries `cli` or `ui`: one line saying what the
#             step's `check` proves. A description only; `check` stays the authority.
#   check     command whose success (exit 0) means the step is DONE. Idempotent.
#             `null` means "no scriptable check — prove it via the next plan".
#   produces  the artifact/credential this step yields
#   docs      canonical section to read for the fine print — a path relative to
#             references/ (this file's dir), e.g. docs/setup.md#... or cloudflare.md
#
# RUNNER SETUP — the fields below (org, hcp_api, …) are YAML metadata, NOT shell
# variables. Before running any `check`/`run`, the agent MUST source the repo-local
# config per config.md's Step 0: read the Config block from the consuming repo's
# README.md and export the vars every command below actually references.
#
# Common vars (both modes):
#     export BACKEND=<backend>  # required: hcp | object-storage
#     export LEAF_BACKENDS='<validated optional map as JSON, {} when absent>'
# Resolve checks/leaf-routing.sh per config.md before preflight. Export its effective
# map, service flags HAS_HCP/HAS_OBJECT_STORAGE, bootstrap flags/leaf arrays,
# CLOUDFLARE_BACKEND/GITHUB_BACKEND and each entry's NEW_PROVIDER_BACKEND.
# BACKEND remains the repository default; both service export sections apply in mixed mode.
#     export GITHUB_ORG=<github_org>
#     export DOMAIN=<apex_domain>
#     export CF_ACCOUNT_ID=<cloudflare_account_id>
#     export CF_ZONE_ID=<cloudflare_zone_id>
#     export REPO=<managed_repos[0]>
#     export ADDITIONAL_PROVIDER_NAMES='<additional_providers names as compact JSON>'
#     export ADDITIONAL_PROVIDER_MISE_TOOLS='<all entry.mise_tools flattened as compact JSON>'
#     export INFRA_REFERENCES=<absolute path to references/ directory>
#
# HCP service present (HAS_HCP=true, even with an object-storage default):
#     export ORG=<hcp_org>
#     export HCP_STATUS_CHECK_ID=<hcp_status_check_id>
#     export ADDITIONAL_PROVIDER_WORKSPACES='<only HCP-routed entry.workspace values as compact JSON>'
#     export hcp_api=https://app.terraform.io/api/v2
#     export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' ~/.terraform.d/credentials.tfrc.json)}
#
# Object-storage service present (HAS_OBJECT_STORAGE=true, even with an HCP default):
#     export STATE_BACKEND=<state_backend>  # gcs | s3 | azurerm | ...
#     export STATE_BUCKET=<state_bucket>
#     export STATE_PREFIX=<state_prefix>
#     export STATE_LOCK_TABLE=<state_lock_table>  # for S3
#     export STATE_REGION=<state_region>  # for S3/azurerm; the GCS bucket location
#     export ADDITIONAL_PROVIDER_SECRETS='<only object-storage-routed [entry: {name, credential_secrets}, ...] as compact JSON>'
#
# Step 0 must stop and hand off if backend is missing, empty, or invalid, before
# preflight or any when/check/run. Never infer a mode from an empty BACKEND.
# Steps with `when` conditions are skipped when the condition evaluates false.
#
# Phase 6 runs its inventory once, then instantiates the remaining steps per entry.
# Common exports for both modes:
#     export NEW_PROVIDER=<entry.name>
#     export NEW_PROVIDER_BACKEND=<effective backend for entry.name, never the unexamined default>
#     export NEW_PROVIDER_MISE_TOOLS='<entry.mise_tools as compact JSON>'
#     export NEW_PROVIDER_MISE_CONFIG_BLOB=<entry.mise_config_blob>
#     export NEW_PROVIDER_MISE_LOCK_BLOB=<entry.mise_lock_blob>
#     export NEW_PROVIDER_CREDENTIALS_VERIFIED_AT=<entry.credentials_verified_at>
#     export NEW_PROVIDER_CREDENTIALS_BACKEND=<entry.credentials_backend; hcp only when legacy field absent>
# The once-per-phase inventory also receives every declared provider tool:
#     export ADDITIONAL_PROVIDER_MISE_TOOLS='<all entry.mise_tools flattened as compact JSON>'
#
# Effective HCP entry Phase 6 exports:
#     export NEW_PROVIDER_WORKSPACE=<entry.workspace>
#     export NEW_PROVIDER_FORK_PLANS_DISABLED=<entry.fork_speculative_plans_disabled>
#     export NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID=<entry.fork_speculative_plans_workspace_id>
#     export NEW_PROVIDER_CREDENTIALS='<entry.credential_variables as compact JSON>'
#
# Effective object-storage entry Phase 6 exports:
#     export NEW_PROVIDER_SECRETS='<entry.credential_secrets as compact JSON>'
# Preflight exports TERRAFORM_VERSION from the validated repository pin before any
# Phase 1 workspace check or run uses it.
# Never guess or invent these values — if the config file is missing, treat it as a
# HUMAN step per config.md. See the "Configuring for your org" section in SKILL.md.
org: $ORG  # sourced from config — see config.md
domain: $DOMAIN  # sourced from config — see config.md
hcp_api: https://app.terraform.io/api/v2
# managed_repos come from README.md (see config.md) — not hardcoded here.

# TOOLCHAIN CONTRACT — pinned, not merely present.
#
# The requirement: the consuming repo pins its tool versions in `mise.toml`, commits
# that file and `mise.lock`, and matches what HCP runs. The checks read the named
# repository file explicitly; `mise current` is intentionally not used because it
# reports active user/global configuration as well as repository configuration.
#
#   pin    exact key in the committed file that records the pin.
#   check  exit 0 == the running binary exactly matches that committed pin.
#
# The lock check enumerates the `[tools]` keys of the committed file and dry-runs a
# locked install over exactly those. Naming a fixed list would leave conditionally
# added tools (gcloud, cf-terraforming) unvalidated, and running `mise install`
# with no tool arguments would pull in user/global config — the same leak that
# rules out `mise current`.
#
# It also asserts every configured *value* is an exact version. The per-tool checks
# below only cover terraform/gh/jq/gcloud, so without this an import-added pin such
# as cf-terraforming could sit at `latest` or a range, pass a refreshed lock, and
# still report a healthy exact-pin contract. Any value this cannot read as an exact
# version fails closed — a table-form entry has to be rewritten as a plain pin.
#
# `mise trust --show` has no machine-readable mode, and since 2026.9 it prints a path
# under $HOME as `~/…` (and $HOME itself as `~`). The trust match accepts that form
# alongside the absolute path, abbreviating only on a whole-component $HOME prefix, as
# mise does. mise strips $HOME as a literal string, so a trailing slash in $HOME yields
# `~repo`, not `~/repo`; the match reproduces that rather than normalising $HOME.
preflight:
  - tool: mise
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      repo_dir=$(pwd -P) &&
      shown_dir=$repo_dir &&
      case $HOME in ''|/) ;;
      */) case $repo_dir in "$HOME"*) shown_dir="~${repo_dir#"$HOME"}" ;; esac ;;
      *) case $repo_dir in "$HOME") shown_dir="~" ;;
      "$HOME"/*) shown_dir="~${repo_dir#"$HOME"}" ;; esac ;; esac &&
      mise trust --show 2>/dev/null |
      grep -Fx -e "$repo_dir: trusted" -e "$shown_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s\n' "$pinned" |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1 || exit 1;
      done
  - tool: terraform
    pin: mise.toml#tools.terraform
    check: >-
      ver=$(terraform version -json 2>/dev/null | jq -r '.terraform_version // empty');
      pin=$(mise config get --file ./mise.toml tools.terraform 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: gh
    pin: mise.toml#tools.gh
    check: >-
      ver=$(gh --version 2>/dev/null | head -1 | awk '{print $3}');
      pin=$(mise config get --file ./mise.toml tools.gh 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: jq
    pin: mise.toml#tools.jq
    check: >-
      ver=$(jq --version 2>/dev/null | sed 's/^jq-//');
      pin=$(mise config get --file ./mise.toml tools.jq 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: gcloud
    when: >-
      printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" |
      jq -e 'index("gcloud") != null' >/dev/null ||
      { [ "$HAS_OBJECT_STORAGE" = "true" ] && [ "$STATE_BACKEND" = "gcs" ]; }
    pin: mise.toml#tools.gcloud
    check: >-
      needs_gcloud=false;
      printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" | jq -e 'index("gcloud") != null' >/dev/null && needs_gcloud=true;
      [ "$HAS_OBJECT_STORAGE" = "true" ] && [ "$STATE_BACKEND" = "gcs" ] && needs_gcloud=true;
      [ "$needs_gcloud" = "false" ] && exit 0;
      ver=$(gcloud version --format=json 2>/dev/null |
      jq -r '."Google Cloud SDK" // empty' | tr -d '[:space:]');
      pin=$(mise config get --file ./mise.toml tools.gcloud 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: aws
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ] && [ "$STATE_BACKEND" = "s3" ]'
    pin: mise.toml#tools.awscli
    check: >-
      [ "$HAS_OBJECT_STORAGE" != "true" ] || [ "$STATE_BACKEND" != "s3" ] && exit 0;
      ver=$(aws --version 2>&1 | sed -n 's|^aws-cli/\([0-9.]*\).*|\1|p' | head -1);
      pin=$(mise config get --file ./mise.toml tools.awscli 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: az
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ] && [ "$STATE_BACKEND" = "azurerm" ]'
    pin: mise.toml#tools.azure-cli
    check: >-
      [ "$HAS_OBJECT_STORAGE" != "true" ] || [ "$STATE_BACKEND" != "azurerm" ] && exit 0;
      ver=$(az version --query '"azure-cli"' -o tsv 2>/dev/null | tr -d '[:space:]');
      pin=$(mise config get --file ./mise.toml tools.azure-cli 2>/dev/null | tr -d '[:space:]');
      printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      [ -n "$ver" ] && [ "$ver" = "$pin" ]
  - tool: infra-references
    check: 'test -n "$INFRA_REFERENCES" && test -d "$INFRA_REFERENCES/checks"'
    why: >-
      Steps whose check is a shipped script resolve it from this path, because a check
      runs with the consuming repo as its working directory. Unset, the step runs
      sh "/checks/..." and fails with a bare shell error — and the script's own
      "export it per config.md" diagnostic is inside the file that could not be found.
    human_action: >-
      Export INFRA_REFERENCES per references/config.md: the absolute path to the
      loaded skill's references/ directory (the one holding config.md and checks/).

  - tool: uv
    when: '[ ! -f .copier-answers.yml ]'   # only the render path runs Copier
    check: "uv --version >/dev/null"   # system-provided; runs the pinned Copier

  - tool: curl
    check: "curl --version >/dev/null"   # system-provided; pinning it buys nothing

steps:
  # ── Phase 0 — Common bootstrap ──────────────────────────────────────────
  - id: template-render
    phase: 0
    provider: repo
    actor: AGENT
    title: Render the copier-infra Template and commit its answers
    why: The Template owns the skeleton, Terraform roots, README Config block and Decisions table; nothing else writes them, and later Template updates need the committed answers file.
    run: |
      Setup only. Red means no committed .copier-answers.yml or no README Config block.
      An untracked answers file is a render of unknown completeness, a Config block with no
      answers file is hand-written, and a tracked answers file or README with uncommitted
      changes is a partial render or update: hand off for review in every case, never commit
      or re-render over them. The human clears the directory to empty and the step restarts,
      or verifies the whole skeleton and commits it themselves.
      Run `copier copy` only when the destination is empty apart from `.git`; any other
      content, tracked or not, is a hand-off, because Copier would overwrite it and the
      render commit would absorb it. Otherwise:
      0. Export INFRA_REFERENCES first (config.md), require `uv` and `mise` on the path (a
         HUMAN install if either is absent; step 3 needs `mise`, so check before copying), and run `git init` if the directory is not a repository.
      1. Clone the Template at its newest release tag into a scratch directory and read its
         copier.yml: those are the questions to ask, never a remembered set. A question with
         `choices` is a decision per protocol.md, the Template's default first; a free-form
         question (an org name, an ID) is a plain text prompt, validated against the
         question's `validator`, with no invented candidates. Evaluate each question's `when`
         in file order against the answers so far and ask only the ones that are true; pass
         no answer for the rest.
      2. Render with the pinned Copier, passing every answer with --data and --defaults:
         uv run --no-project --with-requirements "$INFRA_REFERENCES/copier-requirements.txt" \
           copier copy --vcs-ref <tag> --defaults --data key=value \
           gh:hasansezertasan/copier-infra .
      3. Run `mise trust --untrust` in the repo first: mise trust survives a change of file
         contents, so this revokes any earlier trust of that path, and it must happen before
         the commit below so a resumed run can never see a committed render with stale trust.
      4. Commit the render, including .copier-answers.yml, before any other step; Copier does
         not initialize Git and its update reads tracked files and HEAD.
      Never edit a file the Template owns afterwards, apart from the pins `toolchain-pin` reviews; change answers with `copier update`,
      run through the pinned Copier (the same `uv run ... copier` command, `update` in place of `copy`).
      Do not trust the rendered mise.toml: `toolchain-pin` is still the human's review.
    check: >-
      git ls-files --error-unmatch .copier-answers.yml README.md >/dev/null 2>&1 &&
      git diff --quiet HEAD -- .copier-answers.yml README.md &&
      git diff --cached --quiet HEAD -- .copier-answers.yml README.md &&
      sh "$INFRA_REFERENCES/checks/template-contract.sh" --source-only &&
      grep -q '<!-- infra:config start -->' README.md &&
      grep -q '<!-- infra:config end -->' README.md
    produces: committed .copier-answers.yml and the Template-rendered repository
    docs: docs/setup.md#0-scaffold-with-the-template

  - id: template-contract
    phase: 0
    provider: repo
    actor: AGENT
    tri_state: true
    when: '[ -f .copier-answers.yml ]'
    title: Check the recorded Template version against the minimum
    why: The Skills accept a Template release at or above a minimum tag; an older tag needs the Template's update, and a bare commit cannot be compared so it goes to the human.
    run: |
      Red (exit 1, older tag): propose `copier update` run from the repo root on a clean
      tree through the pinned Copier (`uv run --no-project --with-requirements
      "$INFRA_REFERENCES/copier-requirements.txt" copier update`; `uv` is a HUMAN install if absent, since
      preflight skips it once the answers file exists),
      show the conflicts for review, resolve them with the human, and commit the result;
      copier leaves the update uncommitted, and this check reads the working tree. Then
      restart the scan at `template-render`, which requires a committed, clean render, before
      re-running this check. Never overwrite silently.
      Exit 2 (bare commit, between-tags value, no answers file): emit the handoff block
      and wait; never assume the Template is compatible.
    check: sh "$INFRA_REFERENCES/checks/template-contract.sh"
    produces: a recorded Template version at or above the minimum
    docs: docs/setup.md#0-scaffold-with-the-template

  - id: toolchain-pin
    phase: 0
    provider: repo
    actor: HUMAN
    title: Create and commit the pinned mise.toml + mise.lock
    why: Preflight and every per-tool check compare installed binaries against these pins; nothing else creates them.
    check_summary: mise.toml and mise.lock are committed unchanged, mise trusts the repository config, and every pinned tool is installed at its exact pinned version.
    cli:
      - effect: Prints the whole mise.toml so you can review it before trusting it, because repository config can enable templates, plugins and other executable behavior. If the file is absent, author it first with exact versions per docs/setup.md#6-local-development.
        run: |
          cat -- mise.toml
      - effect: Trusts the reviewed config, initializes and populates mise.lock, installs exactly the pinned tools from the lock, and activates them in this shell. Changing a rendered pin is a deliberate decision, and a later copier update merges it.
        run: |
          mise trust mise.toml
          touch mise.lock
          mise lock
          pinned=$(mise config get --file ./mise.toml tools |
            sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p')
          printf '%s\n' "$pinned" |
            while IFS= read -r tool; do
              [ -z "$tool" ] && continue
              MISE_LOCKED=1 mise install "$tool" || exit 1
            done
          eval "$(mise activate bash)"   # zsh: mise activate zsh
          command -v terraform && terraform version
      - effect: Commits mise.toml and mise.lock together, and only those two files, so other staged work stays out of the commit.
        run: |
          git add mise.toml mise.lock
          git diff --cached --quiet -- mise.toml mise.lock || git commit -m "build: pin the toolchain" -- mise.toml mise.lock
    # Keep this byte-for-byte identical to the mise preflight check. The repository
    # validator enforces that invariant so the step and fail-fast gate cannot drift.
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      repo_dir=$(pwd -P) &&
      shown_dir=$repo_dir &&
      case $HOME in ''|/) ;;
      */) case $repo_dir in "$HOME"*) shown_dir="~${repo_dir#"$HOME"}" ;; esac ;;
      *) case $repo_dir in "$HOME") shown_dir="~" ;;
      "$HOME"/*) shown_dir="~${repo_dir#"$HOME"}" ;; esac ;; esac &&
      mise trust --show 2>/dev/null |
      grep -Fx -e "$repo_dir: trusted" -e "$shown_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s\n' "$pinned" |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1 || exit 1;
      done
    produces: committed mise.toml + mise.lock
    docs: docs/setup.md#6-local-development

  - id: backend-cli-pin
    operation: backend-cli-pin
    implementation: both
    phase: 0
    provider: repo
    actor: HUMAN
    title: Pin the state backend's CLI in mise.toml
    why: The rendered Template pins only terraform, gh and jq, and preflight fails without an exact pin for the CLI of an object-storage state backend; an HCP-only repository needs none.
    check_summary: For an object-storage state backend, mise.toml and mise.lock are committed with an exact plain-string pin for the backend's CLI (awscli, gcloud or azure-cli); otherwise nothing is required.
    cli:
      - effect: For an s3 or S3-compatible state backend, lists the newest versions of its CLI, awscli. Add it by editing mise.toml, as a plain string under [tools] (for example awscli = "2.38.5") with the comment `# infra-skills:general-tool awscli` on the line immediately before it, which the new-provider inventory requires for every non-bootstrap pin, then review the diff. Do not use mise use, which installs while it writes and, for awscli, writes an inline table that the exact-pin check rejects.
        run: |
          mise ls-remote awscli | tail -3
          # edit mise.toml, then:
          git diff -- mise.toml
      - effect: For a gcs state backend, lists the newest versions of its CLI, gcloud. Add it to mise.toml as a plain exact version string under [tools], with `# infra-skills:general-tool gcloud` on the line immediately before it, and review the diff, as for awscli.
        run: |
          mise ls-remote gcloud | tail -3
          # edit mise.toml, then:
          git diff -- mise.toml
      - effect: For an azurerm state backend, lists the newest versions of its CLI, azure-cli, which installs through pip. Add it to mise.toml as a plain exact version string under [tools], with `# infra-skills:general-tool azure-cli` on the line immediately before it, and review the diff, as for awscli. Run only the command for the selected backend.
        run: |
          mise ls-remote azure-cli | tail -3
          # edit mise.toml, then:
          git diff -- mise.toml
      - effect: Updates mise.lock, installs exactly the pinned tools from the lock, and commits mise.toml and mise.lock together, and only those two files.
        run: |
          mise lock || exit 1
          pinned=$(mise config get --file ./mise.toml tools |
            sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') || exit 1
          for tool in $pinned; do
            MISE_LOCKED=1 mise install "$tool" || exit 1
          done
          git add mise.toml mise.lock
          git diff --cached --quiet -- mise.toml mise.lock || git commit -m "build: pin the backend CLI" -- mise.toml mise.lock
    run: |
      Propose the exact version for the selected backend's CLI and show the mise.toml diff;
      the human reviews and commits it, since the agent that proposes executable repository
      config must not approve its own trust boundary. An HCP-only repository is already green.
    # Routing comes from the validated Config (the service inventory), not from Terraform
    # text or the answers file, so a mixed HCP repository with an object-storage leaf is covered.
    check: >-
      [ "$HAS_OBJECT_STORAGE" != "true" ] && exit 0;
      case "$STATE_BACKEND" in s3) tool=awscli ;; gcs) tool=gcloud ;; azurerm) tool=azure-cli ;; *) exit 0 ;; esac;
      git ls-files --error-unmatch mise.toml mise.lock >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock &&
      mise config get --file ./mise.toml "tools.$tool" 2>/dev/null | tr -d '[:space:]' |
      grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      MISE_LOCKED=1 mise install --dry-run "$tool" >/dev/null 2>&1
    produces: committed mise.toml + mise.lock pinning the backend CLI
    docs: docs/setup.md#6-local-development

  # ── Phase 0 — HCP bootstrap (backend: hcp only) ──────────────────────────
  - id: hcp-login
    refresh_credentials: true
    operation: bootstrap-state
    implementation: hcp
    phase: 0
    provider: hcp
    actor: HUMAN
    when: '[ "$HAS_HCP" = "true" ]'
    title: Sign up and terraform login (mint the pivot HCP token)
    why: This browser login yields the API token needed to verify the organization and drive every later API step.
    check_summary: A user HCP credential exists (TF_TOKEN_app_terraform_io or the Terraform credentials file) and, on a cold repository, HCP accepts it for /account/details.
    ui:
      - form: Sign up for HCP Terraform (skip it if you already have an account; the free tier is enough to start)
        url: https://app.terraform.io/public/signup/account
        fields: |
          Username | The handle you want on HCP
          Email | The address you want HCP to use
          Password | A new password
          Terms of Use and Privacy Policy | Accept
          After submitting | Confirm the address from the email HCP sends
    cli:
      - effect: Opens a browser tab to approve a login, then writes the user API token to ~/.terraform.d/credentials.tfrc.json. This is the last interactive HCP CLI authentication; later providers still need their own human authorization or credential entry.
        run: |
          terraform login
    run: |
      After the human replies done, re-export HCP_TOKEN per config.md Step 0 before checking
      the next step.
    # Accepts either credential source, in terraform's own precedence order. A
    # file-only check marked phase 0 red for anyone following hcp-apply-scope's
    # environment-variable route, and setup then told them to run `terraform login`
    # again -- recreating the apply-capable user token that step exists to remove.
    #
    # Presence alone is not enough. On a machine already narrowed by
    # hcp-apply-scope, the plan-only team token satisfied a presence test, so
    # bootstrapping a SECOND repository skipped this handoff -- and then
    # vcs-connect could not read oauth-clients while no workspace existed yet for
    # its fallback, so setup stalled with no way to ask for the user credential.
    # /account/details exists only for a user token, so it distinguishes them.
    # Only a definitive negative turns this red: a transport failure leaves the
    # presence result standing rather than blocking a cold bootstrap offline.
    check: |
      token=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' \
        ~/.terraform.d/credentials.tfrc.json 2>/dev/null)}
      [ -n "$token" ] && [ "$token" != null ] || exit 1

      # Never send the credential to an unexpected endpoint. This check runs
      # earliest of all, so a repo-local config pointing $hcp_api elsewhere would
      # disclose the token before vcs-connect or hcp-apply-scope get to refuse
      # it. Degrade to the presence result instead of sending it: those two are
      # tri-state and will reject the endpoint loudly.
      if [ "$hcp_api" != "https://app.terraform.io/api/v2" ]; then
        echo "note: \$hcp_api is '$hcp_api', not https://app.terraform.io/api/v2, so the credential kind was not checked — vcs-connect and hcp-apply-scope will refuse that endpoint" >&2
        exit 0
      fi

      # A narrowed token is the intended steady state only after the complete
      # Phase 1 invariant is green. Names alone are insufficient: drift in the
      # version, VCS target, execution mode, or safety toggles still requires the
      # user credential so workspaces-create can reconcile it. Both steps call
      # one shared check so their definitions of "provisioned" cannot diverge.
      readiness=''
      # Pending Phase 6 provisioning does not invalidate an established service.
      [ "$HAS_HCP_BOOTSTRAP" = true ] || readiness=--login-readiness
      HCP_TOKEN=$token \
        sh "$INFRA_REFERENCES/checks/hcp-bootstrap-workspaces.sh" $readiness \
        >/dev/null 2>&1 && exit 0

      # Cold repository: phases 0 and 1 genuinely need the user credential, and a
      # team token cannot read organization VCS settings or complete the OAuth
      # flow. /account/details exists only for a user token. Only a definitive
      # negative is red; a transport failure or any other status leaves the
      # presence result standing so a bootstrap is not blocked offline.
      code=$(curl -s -o /dev/null -w '%{http_code}' "$hcp_api/account/details" \
        -H "Authorization: Bearer $token") || exit 0
      case "$code" in
        200) exit 0 ;;
        401|403|404)
          echo "this repository's complete Phase 1 workspace configuration is not visible and green, and the HCP credential in use is not a user token (account/details returned $code). Phases 0 and 1 need the user credential from 'terraform login': a team token cannot read organization VCS settings, complete the OAuth flow, create a missing workspace, or reconcile drift. Unset TF_TOKEN_app_terraform_io, or run 'terraform login' for this bootstrap and re-apply hcp-apply-scope afterwards." >&2
          exit 1
          ;;
        *) exit 0 ;;
      esac
    produces: an HCP account and an API token terraform can use
    docs: docs/setup.md#1-hcp-terraform--organization

  - id: hcp-signup
    operation: bootstrap-state
    implementation: hcp
    phase: 0
    provider: hcp
    actor: HUMAN
    when: '[ "$HAS_HCP" = "true" ]'
    title: Create HCP Terraform org and project
    why: HCP holds state and provider variables for HCP-routed leaves; those leaves need the organization.
    check_summary: The organization $ORG exists and holds a project named exactly infra.
    cli:
      - effect: Creates the HCP organization named $ORG, with the email you enter as its admin contact. Organization names are global, so it fails if another account already owns $ORG. It authenticates with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            printf 'Organization admin email: '; read -r email
            [ -n "$email" ] || { echo 'No email entered.' >&2; exit 1; }
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            org_name=$ORG org_email=$email
            export org_name org_email
            code=$(jq -n '{data:{type:"organizations",attributes:{name:env.org_name,email:env.org_email}}}' \
              | curl -s -o /dev/null -w '%{http_code}' -X POST --config <(auth) \
                  -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/organizations")
            [ "$code" = 200 ] || [ "$code" = 201 ] || { echo "HTTP $code (422 usually means it already exists)" >&2; exit 1; }
          )
      - effect: Creates the project infra in the $ORG organization. It fails if the organization does not exist yet. It authenticates with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            code=$(jq -n '{data:{type:"projects",attributes:{name:"infra"}}}' \
              | curl -s -o /dev/null -w '%{http_code}' -X POST --config <(auth) \
                  -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/organizations/$ORG/projects")
            [ "$code" = 200 ] || [ "$code" = 201 ] || { echo "HTTP $code (422 usually means it already exists)" >&2; exit 1; }
          )
    ui:
      - form: Create the organization in the browser instead
        url: https://app.terraform.io/app/organizations/new
        fields: |
          Organization name | $ORG
          Email address | The admin contact address you want HCP to use
      - form: Create the project in the browser instead
        url: https://app.terraform.io/app/$ORG/projects
        fields: |
          Start from | New project
          Name | infra
          Description | leave blank
    # Assert the project too, not just the org: this step produces both, and an org
    # without `infra` fails later workspace work with a far less obvious error.
    # filter[names] is case-insensitive, so re-assert the exact name in jq.
    check: |
      test -n "$HCP_TOKEN" || exit 1
      [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || exit 1
      curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '.data.id' >/dev/null || exit 1
      curl -sf "$hcp_api/organizations/$ORG/projects?filter%5Bnames%5D=infra" \
        -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '[.data[] | select(.attributes.name == "infra")] | any' >/dev/null
    produces: HCP org `$ORG`, project `infra`
    docs: docs/setup.md#1-hcp-terraform--organization

  - id: hcp-verify
    operation: bootstrap-state
    implementation: hcp
    phase: 0
    provider: hcp
    actor: AGENT
    when: '[ "$HAS_HCP" = "true" ]'
    title: Confirm HCP API reachable
    why: Gate for the HCP implementation's API calls, including HCP-routed additional providers.
    run: |
      # Same precedence as config.md Step 0. Reading only the credentials file
      # sent an empty bearer token when TF_TOKEN_app_terraform_io was the only
      # credential, which hcp-apply-scope's environment route makes a real case.
      export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r '.credentials["app.terraform.io"].token' ~/.terraform.d/credentials.tfrc.json)}
      curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" | jq -e '.data.id'
    check: '[ "$hcp_api" = "https://app.terraform.io/api/v2" ] && curl -sf "$hcp_api/organizations/$ORG" -H "Authorization: Bearer $HCP_TOKEN" | jq -e ".data.id"'
    produces: verified API access
    docs: docs/hcp-state.md#api-access

  # ── Phase 1 — HCP workspaces (backend: hcp only) ─────────────────────────
  - id: vcs-connect
    operation: provision-execution
    implementation: hcp
    phase: 1
    provider: hcp
    actor: HUMAN
    when: '[ "$HAS_HCP" = "true" ]'
    title: Connect GitHub to HCP via OAuth or the GitHub App
    why: Workspaces need a VCS provider to run speculative plans on PRs.
    check_summary: The organization has a GitHub OAuth client, or the leaf workspaces for $REPO are connected through an OAuth token or the GitHub App; a plan-only credential that cannot read VCS settings reports unverifiable rather than red.
    ui:
      - form: Connect GitHub through OAuth, scoped to this repository (use this or the GitHub App form, not both)
        url: https://app.terraform.io/app/$ORG/settings/version-control
        fields: |
          Page | Version Control, then Providers
          Add a VCS provider | GitHub, then GitHub.com
          Authorize on GitHub | Authorize HCP Terraform as the bootstrap user
          Organization access on GitHub | Grant access to $GITHUB_ORG, the owner of $REPO
      - form: Connect GitHub through the HCP Terraform GitHub App (use this or the OAuth form, not both)
        url: https://app.terraform.io/app/$ORG/settings/version-control
        fields: |
          Page | Version Control, then Providers
          Install the HCP Terraform GitHub App | On $GITHUB_ORG, Only select repositories, $REPO
          Authorize the App | On the bootstrap user's GitHub account, so HCP can link the installation to that user
    run: |
      The agent discovers the installation by $REPO's GitHub owner using the bootstrap user's
      token; keep that token through bootstrap, because team and organization tokens cannot
      create App links. If the organization has several GitHub connections, ask the human to
      choose one as a decision, then export OAUTH_TOKEN_ID (its ot- id) or
      GITHUB_APP_INSTALLATION_ID (HCP's ghain- id, not GitHub's numeric installation id) in your
      own environment, never both, and keep it exported for workspace creation.
    # Assert a GitHub-family VCS provider specifically, not just "any oauth client" —
    # otherwise a pre-existing GitLab/Bitbucket connection would false-green this step.
    # Tri-state, because this endpoint is organization-scoped and the plan-only
    # credential hcp-apply-scope installs cannot read it. Without the distinction a
    # resume scan stops here on the first non-zero check and re-emits the OAuth
    # handoff, so `setup` could never resume past phase 1 after that handoff -- and
    # the human would be told to redo a step that is already done. A 403 proves
    # nothing about whether the VCS connection exists, which is exactly a 2.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: |
      # Checked before any credential is sent. $hcp_api is exported by Step 0, so
      # a mistyped or edited value would put a bearer token in a request to an
      # arbitrary host -- in plaintext if the scheme were http. hcp-apply-scope
      # guards this for its own requests; these are separate ones.
      [ "$hcp_api" = "https://app.terraform.io/api/v2" ] \
        || { echo "CANNOT VERIFY: \$hcp_api is '$hcp_api', not https://app.terraform.io/api/v2; refusing to send an HCP credential to an unexpected endpoint" >&2; exit 2; }
      body=$(mktemp); trap 'rm -f "$body"' EXIT
      # Paginated: an organization with enough VCS clients pushes its GitHub one
      # onto a later page, and reading only the first concluded "no GitHub
      # client" and re-emitted the OAuth handoff for a connection that exists.
      oauth_page=1
      oauth_read=no
      while : ; do
        code=$(curl -s -o "$body" -w '%{http_code}' \
          "$hcp_api/organizations/$ORG/oauth-clients?page%5Bsize%5D=100&page%5Bnumber%5D=$oauth_page" \
          -H "Authorization: Bearer $HCP_TOKEN") \
          || { echo "CANNOT VERIFY: the request for $ORG's oauth-clients did not complete (curl exit $?) — DNS, TLS, a timeout, or an unwritable temporary file" >&2; exit 2; }
        [ "$code" = 200 ] || break
        # jq -e exits 4 on empty input and 5 on invalid JSON, and this step is
        # tri-state: protocol.md honours 0, 1 and 2 only, so `exit $?` would
        # surface those as an unexpected code instead of a stated cause.
        jq -e '[.data[] | select(.attributes["service-provider"] | test("github"))] | length > 0' \
          "$body" >/dev/null 2>&1
        rc=$?
        case "$rc" in
          0) exit 0 ;;
          1) : ;;   # not on this page; keep paging
          *) echo "CANNOT VERIFY: $ORG's oauth-clients response could not be parsed (jq exit $rc)" >&2; exit 2 ;;
        esac
        # A page shorter than the requested size is the last one, whatever the
        # metadata says -- so total-pages is only consulted when a page comes
        # back full. meta.pagination is not a required field in HCP's schema,
        # and demanding it unconditionally would have reported CANNOT VERIFY for
        # every organization whose response omits it.
        oauth_count=$(jq -e '.data | length' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $ORG's oauth-clients response was not the expected JSON" >&2; exit 2; }
        [ "$oauth_count" -eq 100 ] || { oauth_read=yes; break; }   # last page, no GitHub client
        oauth_pages=$(jq -er '.meta.pagination["total-pages"]
                      | if type == "number" and . == floor and . > 0
                        then (floor | tostring) else empty end' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $ORG's oauth-clients list filled a page but carried no positive-integer total-pages, so later pages could not be reached" >&2; exit 2; }
        [ "$oauth_page" -lt "$oauth_pages" ] || { oauth_read=yes; break; }   # every page read
        oauth_page=$((oauth_page + 1))
      done
      # Every page read and no GitHub client is not yet a verdict: a workspace
      # connected through the HCP GitHub App needs no OAuth client at all, so an
      # organization using only the App has an empty list and every workspace
      # connected. Exiting 1 there kept the step permanently red. That path falls
      # through to the workspace evidence below, but accepts only the App
      # installation id: with the full client list read and no GitHub client in
      # it, an oauth-token-id can only belong to another provider's client.
      if [ "$oauth_read" = yes ]; then
        cause="$ORG has no GitHub OAuth client"
      else
        case "$code" in
          401|403) ;;   # fall through to the workspace-scoped evidence below
          *) echo "CANNOT VERIFY: reading $ORG's oauth-clients returned $code" >&2; exit 2 ;;
        esac
        cause="this credential may not read $ORG's VCS settings ($code)"
      fi
      # On 401/403: the plan-only credential from hcp-apply-scope cannot read organization VCS
      # settings, and stopping here would leave `setup` unable to resume past phase 1
      # after that handoff. A workspace connected to $REPO is stronger evidence of the
      # same fact anyway -- it is the connection actually being used -- and it is
      # workspace-scoped, so the narrowed credential can read it. Only available once
      # workspaces exist, which on a resume they do.
      # Without $REPO there is nothing to match, so the readable path below could
      # only conclude "not connected" -- a verdict it has no evidence for.
      [ "$oauth_read" = no ] || [ -n "${REPO:-}" ] \
        || { echo "CANNOT VERIFY: $cause, and \$REPO is unset so no workspace can be matched" >&2; exit 2; }
      page=1
      while : ; do
        curl -sf "$hcp_api/organizations/$ORG/workspaces?page%5Bsize%5D=100&page%5Bnumber%5D=$page" \
          -H "Authorization: Bearer $HCP_TOKEN" >"$body" \
          || { echo "CANNOT VERIFY: $cause, and page $page of the workspace list could not be read either" >&2; exit 2; }
        # Require an actual VCS connection, by either mechanism -- or, when the
        # organization has no GitHub OAuth client, by the App alone. hcp.md
        # supports both mechanisms; a resume preserves either connection.
        #
        # This cannot establish the provider family: a workspace's vcs-repo
        # carries no service-provider field, and resolving the oauth token to its
        # client needs an organization-scoped read the narrowed credential does
        # not have. So an organization holding a GitLab workspace with the same
        # owner/name would satisfy this. Accepted deliberately: the primary path
        # above does check GitHub specifically, and the 401/403 branch runs only
        # after the handoff, when phase 1 is complete and was verified under the
        # user token. Recorded in docs/policy.md's limits. The no-GitHub-client
        # branch does not share the gap: it counts only the App installation id,
        # which only a GitHub connection carries.
        if jq -e --arg repo "${REPO:-}" --arg app_only "$oauth_read" --argjson leaves "$HCP_LEAVES" \
             '[.data[] | select(.attributes["vcs-repo"].identifier == $repo)
                       | select(.attributes["working-directory"] as $dir
                                | $leaves | map("terraform/" + .) | index($dir) != null)
                       | select(((.attributes["vcs-repo"]["github-app-installation-id"] // "") != "")
                                or ($app_only != "yes"
                                    and .attributes["vcs-repo"]["oauth-token-id"] != null))]
              | length > 0' "$body" >/dev/null 2>&1; then
          exit 0
        fi
        # `arrays` makes a body without a .data array (an errors object, null)
        # fail here rather than read as an empty last page.
        ws_count=$(jq -e '.data | arrays | length' "$body" 2>/dev/null) \
          || { echo "CANNOT VERIFY: $cause, and page $page of the workspace list was not the expected JSON" >&2; exit 2; }
        pages=$(jq -er '.meta.pagination["total-pages"]
                        | if type == "number" and . == floor and . > 0
                          then (floor | tostring) else empty end' "$body" 2>/dev/null) \
          || pages=
        # total-pages decides when present. Only when it is absent does a short
        # page count as the last one, as for oauth-clients above: otherwise a
        # missing meta.pagination would turn a clean red into CANNOT VERIFY.
        if [ -z "$pages" ]; then
          [ "$ws_count" -eq 100 ] || break
          echo "CANNOT VERIFY: $cause, and the workspace list carried no positive-integer total-pages so later pages could not be reached" >&2; exit 2
        fi
        [ "$page" -lt "$pages" ] || break
        page=$((page + 1))
      done
      # Before the first workspace exists, check user-scoped App installations.
      # Installation and user authorization do not prove repository access:
      # workspace creation must still succeed. Narrowed tokens use the workspace
      # evidence above and do not require this user-scoped read.
      if [ "$oauth_read" = yes ]; then
        sh "$INFRA_REFERENCES/checks/hcp-github-app.sh" >/dev/null
        rc=$?
        case "$rc" in
          0) exit 0 ;;
          1|3|4) echo "$cause, and no unique GitHub App installation for $REPO; finish authorization or select GITHUB_APP_INSTALLATION_ID" >&2; exit 1 ;;
          *) echo "CANNOT VERIFY: $cause, and user-scoped GitHub App installations could not be read" >&2; exit 2 ;;
        esac
      fi
      echo "CANNOT VERIFY: $cause, and no VCS-connected workspace for ${REPO:-<REPO unset>} is visible; if the plan-only identity is in use, phase 1 was verified under the user token" >&2
      exit 2
    produces: GitHub<->HCP VCS connection
    docs: docs/setup.md#2-hcp-terraform--workspaces

  - id: workspaces-create
    operation: provision-execution
    implementation: hcp
    phase: 1
    provider: hcp
    actor: AGENT
    when: '[ "$HAS_HCP_BOOTSTRAP" = "true" ]'
    title: Create the HCP-routed bootstrap workspaces
    why: One workspace per leaf; carries working dir, path filter, safety toggles.
    run: |
      SOURCE OF TRUTH: the `create_ws` helper in hcp.md (Phase 1). Run that.
      Iterate only HCP_BOOTSTRAP_LEAVES, never the historical fixed pair. Do not
      reconnect, recreate, or reconcile an object-storage-routed leaf's workspace.
      The summary below is a reminder, not a second copy to maintain — if it disagrees
      with hcp.md, hcp.md wins. A POST to
      $hcp_api/organizations/$ORG/workspaces per workspace with:
        working-directory:   terraform/cloudflare  (and terraform/github)
        file-triggers-enabled: true
        trigger-patterns:    ["terraform/cloudflare/**", "terraform/modules/**", "README.md", "mise.toml"]  (and terraform/github/** plus the shared paths)
        execution-mode:      remote
        terraform-version:   $TERRAFORM_VERSION  # exact committed mise.toml pin
        auto-apply:          false
        auto-destroy-at:     null
        auto-destroy-activity-duration: null
        speculative-enabled: true       # plans on PRs
        vcs-repo:            identifier $REPO, selected oauth-token-id OR github-app-installation-id, branch main
      Then in each workspace's UI -> Version Control, confirm FORK speculative plans are OFF
      (separate toggle, no clean create-time attribute; defaults off).
    # The same complete invariant decides whether hcp-login may accept a narrowed
    # team token. Keep it in one executable source rather than duplicating jq.
    check: sh "$INFRA_REFERENCES/checks/hcp-bootstrap-workspaces.sh"
    produces: configured workspaces for HCP_BOOTSTRAP_LEAVES only
    docs: docs/hcp-state.md#workspaces

  # ── Phase 0 — Object-storage bootstrap (backend: object-storage only) ───
  - id: state-bucket
    operation: bootstrap-state
    implementation: object-storage
    phase: 0
    provider: repo
    actor: HUMAN
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    title: Create the state storage bucket
    why: Terraform state needs a durable, versioned bucket before any init.
    check_summary: The bucket exists, is private, has versioning enabled and, for GCS, sits at state_region (plus a lock table on AWS S3). With a Cloudflare R2 state_endpoint it only proves the bucket exists, because R2 has no versioning or public-access-block API (a recorded decision and a human review stand in); the locked "State history" row must exist; any other state_endpoint (MinIO) must also have versioning enabled and no wildcard-principal bucket policy.
    cli:
      - effect: For gcs, creates a private bucket at the location in state_region (a bucket location cannot change later) with uniform access, enforced public access prevention and object versioning; locking is native.
        run: |
          gcloud storage buckets create "gs://$STATE_BUCKET" \
            --location="$STATE_REGION" --uniform-bucket-level-access --public-access-prevention
          gcloud storage buckets update "gs://$STATE_BUCKET" --versioning
      - effect: For AWS s3 (no state_endpoint) in us-east-1, creates the bucket, turns on versioning, blocks all public access, and creates the lock table.
        run: |
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region us-east-1
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          aws dynamodb create-table --table-name "$STATE_LOCK_TABLE" \
            --region "$STATE_REGION" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
      - effect: For AWS s3 (no state_endpoint) in any other region, creates the bucket with its LocationConstraint, turns on versioning, blocks all public access, and creates the lock table.
        run: |
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$STATE_REGION" \
            --create-bucket-configuration LocationConstraint="$STATE_REGION"
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          aws dynamodb create-table --table-name "$STATE_LOCK_TABLE" \
            --region "$STATE_REGION" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
      - effect: For s3 with state_endpoint (Cloudflare R2, MinIO), creates the bucket at that endpoint. Run it with the store's own admin key in AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in your shell, never pasted into the conversation. There is no lock table (locking is use_lockfile) and R2 has neither versioning nor a public-access-block API; its buckets stay private until an r2.dev URL or custom domain is attached.
        run: |
          aws s3api create-bucket --endpoint-url "$STATE_ENDPOINT" --region "$STATE_REGION" --bucket "$STATE_BUCKET"
      - effect: For azurerm, creates the resource group, a storage account with blob versioning, and a private container; locking is native.
        run: |
          az group create --name "$AZURE_RESOURCE_GROUP" --location "$STATE_REGION"
          az storage account create --name "$AZURE_STORAGE_ACCOUNT" --resource-group "$AZURE_RESOURCE_GROUP" --sku Standard_LRS --encryption-services blob
          az storage account blob-service-properties update --account-name "$AZURE_STORAGE_ACCOUNT" --enable-versioning true
          az storage container create --account-name "$AZURE_STORAGE_ACCOUNT" --name "$STATE_BUCKET" --public-access off
    run: |
      With a Cloudflare R2 state_endpoint, first explain that R2 does not implement
      PutBucketVersioning, so a bad apply cannot be rolled back from the bucket, and obtain
      explicit approval. Only then record a locked "State history" row with choice
      "no-versioning" in the README Decisions table. Do not mark the step green on versioning evidence the store cannot
      give. Other S3-compatible stores (MinIO) support versioning:
      enable it with `aws s3api put-bucket-versioning --endpoint-url "$STATE_ENDPOINT"
      --region "$STATE_REGION" --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled`
      and the check requires it.
    check: |
      case "$STATE_BACKEND" in
        gcs)
          gcloud storage buckets describe "gs://$STATE_BUCKET" --format='value(name)' 2>/dev/null \
            | grep -Fxq "$STATE_BUCKET" || exit 1
          gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --format='value(iamConfiguration.uniformBucketLevelAccess.enabled)' 2>/dev/null \
            | grep -Fxq "True" || exit 1
          # Verify the bucket sits where config says (a location cannot change after creation)
          if [ -n "$STATE_REGION" ]; then
            loc=$(gcloud storage buckets describe "gs://$STATE_BUCKET" --format='value(location)' 2>/dev/null) || exit 1
            [ "$(printf '%s' "$loc" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$STATE_REGION" | tr '[:upper:]' '[:lower:]')" ] || {
              echo "Bucket location '$loc' does not match state_region '$STATE_REGION'" >&2
              exit 1
            }
          fi
          # Verify object versioning is enabled
          gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --format='value(versioning.enabled)' 2>/dev/null | grep -Fxiq "true" || exit 1
          # Require Public Access Prevention to be enforced (blocks inherited project-level grants)
          pap=$(gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --format='value(iamConfiguration.publicAccessPrevention)' 2>/dev/null)
          if [ "$pap" = "enforced" ]; then
            : # Public Access Prevention enforced - bucket is private
          else
            # Fall back to checking bucket-level IAM (may miss inherited grants)
            iam_policy=$(gcloud storage buckets get-iam-policy "gs://$STATE_BUCKET" \
              --format='value(bindings.members)' 2>/dev/null) || exit 1
            ! printf '%s' "$iam_policy" | grep -Eq '(allUsers|allAuthenticatedUsers)' || {
              echo "Warning: Public Access Prevention not enforced and public members found" >&2
              exit 1
            }
          fi
          ;;
        s3)
          if [ -n "$STATE_ENDPOINT" ]; then
            # S3-compatible store: no DynamoDB lock table (use_lockfile).
            aws s3api head-bucket --endpoint-url "$STATE_ENDPOINT" --region "$STATE_REGION" --bucket "$STATE_BUCKET" 2>/dev/null || exit 1
            case "$STATE_ENDPOINT" in
              https://*.r2.cloudflarestorage.com|https://*.r2.cloudflarestorage.com/*)
                # Cloudflare R2 implements neither PutBucketVersioning nor PutPublicAccessBlock.
                # Existence is provable; the rest is the locked "State history" decision
                # row (required here) and the backend-identity-trust review.
                awk -F '|' '
                  function clean(v) { gsub(/^[[:space:]`]+|[[:space:]`]+$/, "", v); return tolower(v) }
                  /^<!-- infra:decisions start -->[[:space:]]*$/ { if (in_table || ++starts > 1) bad=1; in_table=1; next }
                  /^<!-- infra:decisions end -->[[:space:]]*$/ { if (!in_table || ++ends > 1) bad=1; in_table=0; next }
                  !in_table { next }
                  clean($2) == "state history" && clean($3) == "no-versioning" && clean($4) == "locked" {found=1}
                  END {exit !(found && !bad && !in_table && starts == 1 && ends == 1)}
                ' README.md 2>/dev/null || exit 1
                exit 0 ;;
            esac
            # Any other store (MinIO, ...) supports versioning, so it is still required.
            aws s3api get-bucket-versioning --endpoint-url "$STATE_ENDPOINT" --region "$STATE_REGION" --bucket "$STATE_BUCKET" \
              --query "Status" --output text 2>/dev/null | grep -Fxq "Enabled" || exit 1
            # ... and must not allow anonymous access. No bucket policy is fine. Any policy is
            # parsed: an Allow statement for a wildcard principal (as the principal itself or any
            # value of its object) or with NotPrincipal fails, and so does a policy that is
            # unreadable or not JSON.
            if policy=$(aws s3api get-bucket-policy --endpoint-url "$STATE_ENDPOINT" --region "$STATE_REGION" --bucket "$STATE_BUCKET" \
              --query Policy --output text 2>&1); then
              printf '%s' "$policy" | jq -e '
                [(.Statement // []) | (if type == "array" then . else [.] end)[]
                 | select((.Effect // "Allow") == "Allow")
                 | select(has("NotPrincipal") or .Principal == "*"
                          or ((.Principal | type) == "object"
                              and ([.Principal[] | (if type == "array" then .[] else . end)] | any(. == "*"))))]
                | length == 0' >/dev/null 2>&1 || exit 1
            else
              printf '%s' "$policy" | grep -Fq 'NoSuchBucketPolicy' || exit 1
            fi
            exit 0
          fi
          [ -n "$STATE_LOCK_TABLE" ] || exit 1
          aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null || exit 1
          aws s3api get-bucket-versioning --bucket "$STATE_BUCKET" --query "Status" --output text 2>/dev/null \
            | grep -Fxq "Enabled" || exit 1
          # Verify table exists, is active, and has correct key schema (LockID string)
          # Use --output json to avoid depending on user's AWS CLI default output format
          table_info=$(aws dynamodb describe-table --table-name "$STATE_LOCK_TABLE" --region "$STATE_REGION" --output json 2>/dev/null) || exit 1
          printf '%s' "$table_info" | jq -e '.Table.TableStatus == "ACTIVE"' >/dev/null || exit 1
          printf '%s' "$table_info" | jq -e '.Table.KeySchema == [{"AttributeName":"LockID","KeyType":"HASH"}]' >/dev/null || exit 1
          printf '%s' "$table_info" | jq -e '.Table.AttributeDefinitions | any(.AttributeName == "LockID" and .AttributeType == "S")' >/dev/null || exit 1
          # Verify all public-access-block settings are enabled
          pab=$(aws s3api get-public-access-block --bucket "$STATE_BUCKET" --output json 2>/dev/null)
          printf '%s' "$pab" | grep -q '"BlockPublicAcls": true' || exit 1
          printf '%s' "$pab" | grep -q '"IgnorePublicAcls": true' || exit 1
          printf '%s' "$pab" | grep -q '"BlockPublicPolicy": true' || exit 1
          printf '%s' "$pab" | grep -q '"RestrictPublicBuckets": true' || exit 1
          ;;
        azurerm)
          [ -n "$AZURE_STORAGE_ACCOUNT" ] || exit 1
          az storage container show --name "$STATE_BUCKET" --account-name "$AZURE_STORAGE_ACCOUNT" --query name -o tsv 2>/dev/null \
            | grep -Fxq "$STATE_BUCKET" || exit 1
          az storage container show --name "$STATE_BUCKET" --account-name "$AZURE_STORAGE_ACCOUNT" --query "properties.publicAccess" -o tsv 2>/dev/null \
            | grep -Eq '^(null|None)?$' || exit 1
          # Verify blob versioning is enabled on the storage account
          az storage account blob-service-properties show --account-name "$AZURE_STORAGE_ACCOUNT" \
            --query "isVersioningEnabled" -o tsv 2>/dev/null | grep -Fxq "true" || exit 1
          ;;
        *)
          echo "Unsupported state backend: $STATE_BACKEND" >&2; exit 1
          ;;
      esac
    produces: versioned, private state bucket
    docs: docs/object-storage-state.md#object-storage-backend

  - id: backend-config
    operation: bootstrap-state
    implementation: object-storage
    phase: 0
    provider: repo
    actor: AGENT
    tri_state: true
    when: '[ "$HAS_OBJECT_STORAGE_BOOTSTRAP" = "true" ]'
    title: Configure Terraform backend blocks
    why: Each leaf needs a backend block pointing to the state bucket with a unique key.
    run: |
      Only configure leaves in OBJECT_STORAGE_BOOTSTRAP_LEAVES; leave HCP-routed leaves alone.
      For an existing HCP leaf, stop and follow the authoritative HUMAN-gated cutover
      in docs/object-storage-state.md#migrating-from-hcp. The agent prepares the PR;
      the human locks that leaf's HCP workspace before pulling state, scans for secrets,
      uploads without overwriting and verifies bytes, serial, lineage and resource
      membership BEFORE merging the backend PR. Include the leaf_backends override,
      synchronized workflow routing literals, CI and required-check changes in that PR.
      After merge, disconnect only that migrated workspace, retire its nonterminal runs
      using advertised discard/cancel actions, verify Actions applies, then retire old
      credentials without revoking credentials still needed by HCP-routed leaves.
      Backend-block presence or a green mixed-backend scan does not prove state transfer
      or completion of those human cutover gates. Do not substitute a state pull/copy
      recipe or treat an empty destination as a fresh leaf. Complete the documented
      migration and verification before accepting backend-config or any plan/apply evidence.
      For a genuinely new leaf with no existing state, create a backend.tf with:
        terraform {
          backend "<state_backend>" {
            # For GCS:
            bucket = "<state_bucket>"
            prefix = "<state_prefix>/<leaf>"
            # For S3:
            bucket         = "<state_bucket>"
            key            = "<state_prefix>/<leaf>/terraform.tfstate"
            region         = "<state_region>"
            dynamodb_table = "<state_lock_table>"
            # For S3-compatible (state_endpoint set), instead of dynamodb_table:
            endpoints = { s3 = "<state_endpoint>" }
            use_lockfile = true
            use_path_style = true
            skip_credentials_validation = true
            skip_metadata_api_check = true
            skip_region_validation = true
            skip_requesting_account_id = true
            skip_s3_checksum = true
            # For azurerm:
            resource_group_name  = "<azure_resource_group>"
            storage_account_name = "<azure_storage_account>"
            container_name       = "<state_bucket>"
            key                  = "<state_prefix>/<leaf>/terraform.tfstate"
            use_azuread_auth     = true  # Required for federated identity (no access keys)
          }
        }
      The prefix/key ensures each leaf has isolated state within the shared bucket.
    check: |
      for name in $(printf '%s' "$OBJECT_STORAGE_BOOTSTRAP_LEAVES" | jq -er '.[]'); do
        leaf="terraform/$name"
        test -d "$leaf" || exit 1
        sh "$INFRA_REFERENCES/checks/state-transfer.sh" "$name" || exit $?
        grep -q "backend \"$STATE_BACKEND\"" "$leaf"/*.tf 2>/dev/null || exit 1
        # Use -F for literal string matching (bucket names may contain regex chars like .)
        grep -Fq "$STATE_BUCKET" "$leaf"/*.tf 2>/dev/null || exit 1
        # Ensure old HCP cloud block is removed (cannot have both backend and cloud)
        ! grep -q 'cloud[[:space:]]*{' "$leaf"/*.tf 2>/dev/null || exit 1
        if [ "$STATE_BACKEND" = "s3" ] && [ -n "$STATE_ENDPOINT" ]; then
          # Judge only the backend "s3" block, without comments or whitespace, so an
          # endpoint mentioned elsewhere in the leaf cannot satisfy the check.
          backend_block=$(cat "$leaf"/*.tf 2>/dev/null | awk '
            /^[[:space:]]*(#|\/\/)/ {next}
            !depth && /backend[[:space:]]+"s3"[[:space:]]*\{/ {inside=1}
            inside {print; depth += gsub(/\{/, "{") - gsub(/\}/, "}"); if (depth <= 0) {inside=0; depth=0}}
          ' | tr -d ' \t')
          # Either the multi-line map the Template renders or the inline form this step prescribes.
          printf '%s\n' "$backend_block" | grep -Fxq -e "s3=\"$STATE_ENDPOINT\"" \
            -e "endpoints={s3=\"$STATE_ENDPOINT\"}" || exit 1
          # A leftover DynamoDB lock would still contact AWS next to use_lockfile.
          ! printf '%s\n' "$backend_block" | grep -Eq '^dynamodb_table=' || exit 1
          for flag in use_lockfile use_path_style skip_credentials_validation skip_metadata_api_check \
            skip_region_validation skip_requesting_account_id skip_s3_checksum; do
            printf '%s\n' "$backend_block" | grep -Fxq "$flag=true" || exit 1
          done
        elif [ "$STATE_BACKEND" = "s3" ]; then
          grep -Fq "$STATE_LOCK_TABLE" "$leaf"/*.tf 2>/dev/null || exit 1
        elif [ "$STATE_BACKEND" = "azurerm" ]; then
          grep -Fq "$AZURE_STORAGE_ACCOUNT" "$leaf"/*.tf 2>/dev/null || exit 1
          # Require Azure AD auth for federated identity (no access keys)
          grep -q 'use_azuread_auth[[:space:]]*=[[:space:]]*true' "$leaf"/*.tf 2>/dev/null || exit 1
        fi
        leaf_name=$(basename "$leaf")
        # Verify complete prefix/key including STATE_PREFIX
        # Escape regex special chars in STATE_PREFIX (e.g., + . *)
        escaped_prefix=$(printf '%s' "$STATE_PREFIX" | sed 's/[.+*?^$[\]\\|(){}]/\\&/g')
        if [ "$STATE_BACKEND" = "gcs" ]; then
          grep -E "prefix[[:space:]]*=[[:space:]]*\"$escaped_prefix/$leaf_name\"" "$leaf"/*.tf 2>/dev/null || exit 1
        else
          grep -E "key[[:space:]]*=[[:space:]]*\"$escaped_prefix/$leaf_name/terraform\\.tfstate\"" "$leaf"/*.tf 2>/dev/null || exit 1
        fi
      done
    produces: backend blocks in each Terraform leaf
    docs: docs/object-storage-state.md#object-storage-backend

  # Runs before backend-identity: that step stores the apply credentials in this environment,
  # the resume scan stops at its first red HUMAN step, and `gh secret set --env` does not
  # create or restrict an environment. Its phase tag stays 1 because the members of one
  # operation share a phase; only its place in the walk moves.
  - id: gha-environments
    operation: provision-execution
    implementation: object-storage
    phase: 1
    provider: github
    actor: HUMAN
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    tri_state: true   # exit 2 = could not verify; see protocol.md
    title: Configure GitHub Environments for apply approval
    why: >-
      The production environment holds the apply credentials. A main-only branch policy
      stops other branches from using it; reviewers or a recorded gate supply the human
      approval HCP's confirm button gave.
    check_summary: A "production" environment exists whose deployment branch policy allows exactly main, with required reviewers or a locked "Apply gate" decision.
    cli:
      - effect: Creates the production environment (or updates it if it exists) restricted to selected branches, deletes every other branch or tag policy, then adds the one policy that allows main. On a rerun the last call reports that the policy already exists, which is harmless.
        run: |
          gh api -X PUT "repos/$REPO/environments/production" --input - <<EOF
          {"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true}}
          EOF
          stale_ids=$(gh api --paginate "repos/$REPO/environments/production/deployment-branch-policies" \
            --jq '.branch_policies[] | select(.name != "main" or .type != "branch") | .id')
          for policy_id in $stale_ids; do
            gh api -X DELETE "repos/$REPO/environments/production/deployment-branch-policies/$policy_id"
          done
          gh api -X POST "repos/$REPO/environments/production/deployment-branch-policies" \
            -f name=main -f type=branch
      - effect: Only where GitHub offers required reviewers (public repos, or GitHub Enterprise for private ones; Free, Pro and Team reject it with a 422). Sets one user as the required reviewer and keeps the main-only branch policy.
        run: |
          printf 'Reviewer GitHub login: '; read -r reviewer
          reviewer_id=$(gh api "users/$reviewer" --jq .id)
          gh api -X PUT "repos/$REPO/environments/production" --input - <<EOF
          {"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true},
           "reviewers":[{"type":"User","id":$reviewer_id}]}
          EOF
    run: |
      Without required reviewers, lock an "Apply gate" row in the README Decisions table whose
      choice is "merge-approval" or "dispatch" (docs/object-storage-ci.md#github-environments).
      The terraform-apply workflow references the production environment.
    check: sh "$INFRA_REFERENCES/checks/gha-apply-gate.sh"
    produces: main-only GitHub Environment with reviewers or a recorded apply gate
    docs: docs/object-storage-ci.md#github-environments

  # ── Phase 2 — Cloudflare credentials (backend: object-storage) ──────────
  - id: backend-identity
    operation: bootstrap-state
    implementation: object-storage
    phase: 0
    provider: repo
    actor: HUMAN
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    title: Configure cloud identity for backend state access
    why: GitHub Actions needs to authenticate to the state backend; the agent cannot create cloud-side federation or install secrets.
    check_summary: The plan identity's secrets exist at repository scope and the apply identity's in the production environment, for the configured state backend; the check lists names only, so it cannot prove the IAM behind them.
    cli:
      - effect: For gcs, creates a dedicated Workload Identity pool for this repository, named gha- plus its numeric repository ID so a project shared with another repository never reuses its pool or accounts, with a plan provider and an apply provider that pin the immutable repository and owner IDs, the workflow file and, for apply, the main branch and the production environment, plus the tf-plan and tf-apply service accounts; tf-apply admits only production-environment identities and tf-plan admits this repository's identities (the documented binding, which apply tokens also match). An existing pool or service account is kept and an existing provider is updated to the current conditions, so it is safe to rerun, including after a repository rename. Run it in your own terminal with your gcloud login.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          POOL="gha-$REPO_ID"
          OWNER_ID=$(gh api "repos/$REPO" -q '.owner.id')
          gcloud services enable \
            cloudresourcemanager.googleapis.com iam.googleapis.com \
            iamcredentials.googleapis.com sts.googleapis.com serviceusage.googleapis.com \
            --project="$PROJECT_ID"
          gcloud iam workload-identity-pools describe "$POOL" --project="$PROJECT_ID" --location=global >/dev/null 2>&1 \
            || gcloud iam workload-identity-pools create "$POOL" \
              --project="$PROJECT_ID" --location=global --display-name="GitHub Actions ($POOL)"
          MAPPING_PLAN="google.subject=assertion.repository_id,attribute.repository_id=assertion.repository_id,attribute.repository_owner_id=assertion.repository_owner_id,attribute.ref=assertion.ref,attribute.event_name=assertion.event_name,attribute.workflow_ref=assertion.workflow_ref"
          MAPPING_APPLY="$MAPPING_PLAN,attribute.environment=assertion.environment"
          REPO_PIN="assertion.repository_id == '$REPO_ID' && assertion.repository_owner_id == '$OWNER_ID'"
          if gcloud iam workload-identity-pools providers describe apply --project="$PROJECT_ID" --location=global --workload-identity-pool="$POOL" >/dev/null 2>&1; then verb=update-oidc; else verb=create-oidc; fi
          gcloud iam workload-identity-pools providers "$verb" apply \
            --project="$PROJECT_ID" --location=global --workload-identity-pool="$POOL" \
            --issuer-uri="https://token.actions.githubusercontent.com" \
            --no-disabled \
            --attribute-mapping="$MAPPING_APPLY" \
            --attribute-condition="$REPO_PIN && assertion.ref == 'refs/heads/main' && assertion.workflow_ref == '$REPO/.github/workflows/terraform-apply.yml@refs/heads/main' && has(assertion.environment) && assertion.environment == 'production'"
          if gcloud iam workload-identity-pools providers describe plan --project="$PROJECT_ID" --location=global --workload-identity-pool="$POOL" >/dev/null 2>&1; then verb=update-oidc; else verb=create-oidc; fi
          gcloud iam workload-identity-pools providers "$verb" plan \
            --project="$PROJECT_ID" --location=global --workload-identity-pool="$POOL" \
            --issuer-uri="https://token.actions.githubusercontent.com" \
            --no-disabled \
            --attribute-mapping="$MAPPING_PLAN" \
            --attribute-condition="$REPO_PIN && assertion.event_name in ['pull_request', 'push', 'workflow_dispatch'] && assertion.workflow_ref.startsWith('$REPO/.github/workflows/terraform-plan.yml@') && !has(assertion.environment)"
          gcloud iam service-accounts describe "tf-apply-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" >/dev/null 2>&1 \
            || gcloud iam service-accounts create "tf-apply-$REPO_ID" --project="$PROJECT_ID" --display-name="Terraform Apply"
          gcloud iam service-accounts describe "tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" >/dev/null 2>&1 \
            || gcloud iam service-accounts create "tf-plan-$REPO_ID" --project="$PROJECT_ID" --display-name="Terraform Plan"
          gcloud iam service-accounts add-iam-policy-binding "tf-apply-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" \
            --project="$PROJECT_ID" --role=roles/iam.workloadIdentityUser \
            --member="principalSet://iam.googleapis.com/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL/attribute.environment/production"
          gcloud iam service-accounts add-iam-policy-binding "tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" \
            --project="$PROJECT_ID" --role=roles/iam.workloadIdentityUser \
            --member="principalSet://iam.googleapis.com/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL/attribute.repository_id/$REPO_ID"
      - effect: For gcs, gives tf-plan read-only access to the state bucket and tf-apply read, write and lock access.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          gcloud storage buckets add-iam-policy-binding "gs://$STATE_BUCKET" \
            --member="serviceAccount:tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --role=roles/storage.objectViewer
          gcloud storage buckets add-iam-policy-binding "gs://$STATE_BUCKET" \
            --member="serviceAccount:tf-apply-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --role=roles/storage.objectAdmin
      - effect: For gcs, removes a leftover objectAdmin grant from tf-plan, including the earlier legacy tf-plan account name, on the state bucket; it prints an error and changes nothing if there is none. Inherited grants at the project or folder still need a manual review.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          gcloud storage buckets remove-iam-policy-binding "gs://$STATE_BUCKET" \
            --member="serviceAccount:tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --role=roles/storage.objectAdmin
          gcloud storage buckets remove-iam-policy-binding "gs://$STATE_BUCKET" \
            --member="serviceAccount:tf-plan@$PROJECT_ID.iam.gserviceaccount.com" --role=roles/storage.objectAdmin
      - effect: For gcs, stores the plan identity's two public coordinates as repository secrets.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          printf %s "projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/gha-$REPO_ID/providers/plan" \
            | gh secret set GCP_WORKLOAD_IDENTITY_PROVIDER --repo "$REPO"
          printf %s "tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" \
            | gh secret set GCP_SERVICE_ACCOUNT --repo "$REPO"
      - effect: For gcs, stores the apply identity's two public coordinates in the production environment. Run it after gha-environments, which this step follows, has restricted the production environment to main.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          printf %s "projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/gha-$REPO_ID/providers/apply" \
            | gh secret set GCP_WORKLOAD_IDENTITY_PROVIDER --repo "$REPO" --env production
          printf %s "tf-apply-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" \
            | gh secret set GCP_SERVICE_ACCOUNT --repo "$REPO" --env production
      - effect: For s3, stores the plan role ARN as a repository secret and the apply role ARN in the production environment (run it after that environment allows exactly main).
        run: |
          printf 'Plan role ARN: '; read -r plan_role_arn
          printf %s "$plan_role_arn" | gh secret set AWS_ROLE_ARN --repo "$REPO"
          printf 'Apply role ARN: '; read -r apply_role_arn
          printf %s "$apply_role_arn" | gh secret set AWS_ROLE_ARN --repo "$REPO" --env production
      - effect: For s3 with state_endpoint (Cloudflare R2, MinIO), which have no OIDC, stores a read-only plan key at repository scope and a separate read-write apply key in the production environment (run it after that environment allows exactly main). Mint both keys scoped to the state bucket only. The secret is read from a hidden prompt and never shown to the agent.
        run: |
          printf 'Plan access key ID: '; read -r plan_key_id
          printf %s "$plan_key_id" | gh secret set STATE_ACCESS_KEY_ID --repo "$REPO"
          printf 'Plan secret access key: '; read -rs plan_secret; printf '\n'
          printf %s "$plan_secret" | gh secret set STATE_SECRET_ACCESS_KEY --repo "$REPO"
          printf 'Apply access key ID: '; read -r apply_key_id
          printf %s "$apply_key_id" | gh secret set STATE_ACCESS_KEY_ID --repo "$REPO" --env production
          printf 'Apply secret access key: '; read -rs apply_secret; printf '\n'
          printf %s "$apply_secret" | gh secret set STATE_SECRET_ACCESS_KEY --repo "$REPO" --env production
          unset plan_secret apply_secret
      - effect: For azurerm, stores the plan identity's three IDs as repository secrets and the separate apply identity's in the production environment (run it after that environment allows exactly main).
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            printf 'Plan %s: ' "$name"; read -r value
            printf %s "$value" | gh secret set "$name" --repo "$REPO"
            printf 'Apply %s: ' "$name"; read -r value
            printf %s "$value" | gh secret set "$name" --repo "$REPO" --env production
          done
    run: |
      With state_endpoint set, the human mints two bucket-scoped keys in the store's dashboard
      (Cloudflare R2: Object Read only for plan, Object Read & Write for apply); plan jobs run
      with -lock=false, so the plan key never needs to write. The keys are stored as
      STATE_ACCESS_KEY_ID and STATE_SECRET_ACCESS_KEY, not AWS_*, and the workflows pass them to
      `terraform init -backend-config`, which beats any AWS_* environment, so an AWS provider in the
      same job keeps its own credentials.
      For s3 and azurerm the identity itself is created by the human, and these references hold
      no commands for it. When rendering, give the rules from docs/object-storage-ci.md and
      object-storage.md: S3 needs an IAM OIDC provider and separate plan and apply roles with
      distinct trust policies (plan reads state and never writes objects or locks; apply reads,
      writes and takes the lock); Azure needs separate plan and apply App Registrations with
      their own federated credentials (plan holds Storage Blob Data Reader, apply Storage Blob
      Data Contributor on the state container). For cloud resource leaves, plan also needs narrow
      per-service refresh roles, never broad roles/viewer, secret-value access, resource writes
      or apply impersonation. Review effective IAM, because secret names prove nothing about it.
    check: |
      # Verify secrets exist in the repo (exact name match)
      repo_secrets=$(gh secret list --repo "$REPO" --json name -q '.[].name' 2>/dev/null) || exit 1
      env_secrets=$(gh secret list --repo "$REPO" --env production --json name -q '.[].name' 2>/dev/null) || exit 1
      case "$STATE_BACKEND" in
        gcs)
          printf '%s\n' "$repo_secrets" | grep -Fxq "GCP_WORKLOAD_IDENTITY_PROVIDER" || exit 1
          printf '%s\n' "$repo_secrets" | grep -Fxq "GCP_SERVICE_ACCOUNT" || exit 1
          env_secrets=$(gh secret list --repo "$REPO" --env production --json name -q '.[].name' 2>/dev/null) || exit 1
          printf '%s\n' "$env_secrets" | grep -Fxq "GCP_WORKLOAD_IDENTITY_PROVIDER" || exit 1
          printf '%s\n' "$env_secrets" | grep -Fxq "GCP_SERVICE_ACCOUNT" || exit 1
          ;;
        s3)
          if [ -n "$STATE_ENDPOINT" ]; then
            for name in STATE_ACCESS_KEY_ID STATE_SECRET_ACCESS_KEY; do
              printf '%s\n' "$repo_secrets" | grep -Fxq "$name" || exit 1
              printf '%s\n' "$env_secrets" | grep -Fxq "$name" || exit 1
            done
          else
            printf '%s\n' "$repo_secrets" | grep -Fxq "AWS_ROLE_ARN" || exit 1
            printf '%s\n' "$env_secrets" | grep -Fxq "AWS_ROLE_ARN" || exit 1
          fi
          ;;
        azurerm)
          printf '%s\n' "$repo_secrets" | grep -Fxq "AZURE_CLIENT_ID" || exit 1
          printf '%s\n' "$repo_secrets" | grep -Fxq "AZURE_TENANT_ID" || exit 1
          printf '%s\n' "$repo_secrets" | grep -Fxq "AZURE_SUBSCRIPTION_ID" || exit 1
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            printf '%s\n' "$env_secrets" | grep -Fxq "$name" || exit 1
          done
          ;;
      esac
    produces: Cloud identity federation and GitHub secrets for backend access
    docs: docs/object-storage-ci.md#gcp-workload-identity-federation

  - id: backend-identity-trust
    operation: bootstrap-state
    implementation: object-storage
    phase: 0
    provider: repo
    actor: HUMAN
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    title: Review effective backend IAM and initialize fresh state
    why: Secret names cannot prove read-only IAM, especially when resuming a legacy installation.
    check_summary: Nothing is checked; the review is ephemeral, so repeat it on every resume, because matching secret names is not evidence.
    cli:
      - effect: For gcs, prints who holds which role on the state bucket, to confirm tf-plan holds only objectViewer and that no unexpected principal can write.
        run: |
          gcloud storage buckets get-iam-policy "gs://$STATE_BUCKET" --format=json
      - effect: For gcs, prints the principals allowed to impersonate each service account, to confirm tf-apply admits only production-environment identities and tf-plan only this repository's identities.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          gcloud iam service-accounts get-iam-policy "tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" --format=json
          gcloud iam service-accounts get-iam-policy "tf-apply-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" --format=json
          gcloud iam service-accounts get-iam-policy "tf-plan@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" --format=json 2>/dev/null || echo "no legacy tf-plan account"
      - effect: Prints the branch policies of the production environment, which must allow exactly main.
        run: |
          gh api "repos/$REPO/environments/production/deployment-branch-policies" --jq '.branch_policies[].name'
      - effect: For gcs, checks that the state object exists under the state prefix.
        run: |
          gcloud storage ls "gs://$STATE_BUCKET/$STATE_PREFIX/"
      - effect: For s3, checks that the state object exists under the state prefix.
        run: |
          aws s3api list-objects-v2 --bucket "$STATE_BUCKET" --prefix "$STATE_PREFIX/"
      - effect: For s3 with state_endpoint, checks that the state object exists under the state prefix, using a read key in your shell.
        run: |
          aws s3api list-objects-v2 --endpoint-url "$STATE_ENDPOINT" --region "$STATE_REGION" --bucket "$STATE_BUCKET" --prefix "$STATE_PREFIX/"
      - effect: For Cloudflare R2, confirm in the dashboard (R2 > bucket > Settings) that Public Development URL (r2.dev) is not enabled and no custom domain is connected, and that the plan key is Object Read only and both keys are scoped to this bucket. There is no API check for this, so this review stands in for the public-access-block check the store lacks.
        run: |
          printf 'Open https://dash.cloudflare.com/?to=/:account/r2/default/buckets/%s and review Settings.\n' "$STATE_BUCKET"
      - effect: For azurerm, checks that the state blob exists under the state prefix.
        run: |
          az storage blob list --account-name "$AZURE_STORAGE_ACCOUNT" --container-name "$STATE_BUCKET" \
            --prefix "$STATE_PREFIX" --auth-mode login --query '[].name' -o tsv
    run: |
      Remove old GCS plan objectAdmin grants with the removal command in backend-identity, and review
      inherited grants at the project and folder too.
      For s3 and azurerm, also have the human review the equivalent read-only plan permissions
      and the separate trust paths. For a genuinely new state destination, point the human at
      docs/object-storage-state.md#fresh-leaf-bootstrap to initialize empty state before the first
      branch plan; existing unmanaged resources need an import-only first plan, and empty state is
      never a substitute for transferring existing managed state. Credential values are never
      returned to the agent.
    check: ~
    produces: HUMAN-verified read-only backend plan identity and initialized leaf state
    docs: docs/object-storage-state.md#fresh-leaf-bootstrap

  # ── Phase 1 — GitHub Actions CI (backend: object-storage only) ──────────
  - id: gha-workflows
    operation: provision-execution
    implementation: object-storage
    phase: 1
    provider: github
    actor: AGENT
    tri_state: true
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    title: Create GitHub Actions workflows for plan and apply
    why: CI replaces HCP's VCS integration — plan on PR, apply on merge.
    run: |
      Create .github/workflows/terraform-plan.yml:
        - Triggers on pull_request and workflow_dispatch
        - Filters only PR paths; plans changed object-storage leaves on PRs and every object-storage leaf on dispatch
        - Configures state-backend authentication for $STATE_BACKEND (GCS Workload Identity, AWS assume-role, or Azure login)
        - Posts plan output as PR comment, with deletes/replacements above the collapsed plan
        - Emits aggregate plan check

      Create .github/workflows/terraform-apply.yml:
        - Triggers on every main push without path filters and workflow_dispatch; omit push for a locked dispatch gate
        - Uses the protected production environment and serializes workflow runs by ref
        - Backend-only routing selects every object-storage leaf on every run; never use leaf-change conditions for apply
        - Refuses non-main refs and stale commits immediately before each apply
        - Retry by dispatching on main; commit both workflows before rechecking
        - Saves a fresh tfplan, inspects it for deletes/replacements using the shared helper, then applies that same tfplan
        - Requires allow-destroy on the producing merged PR for any action containing delete; forget-only removals stay allowed
        - Retry failed applies by dispatching the workflow on main
      Copy templates/terraform-destroy.cjs to .github/scripts/terraform-destroy.cjs alongside both workflow templates.
      Include that helper and .github/workflows/terraform-*.yml in every leaf's plan path filter.
      Re-scaffolding must update the helper and workflows together, preserving recorded decisions.
      Commit both workflows and the helper before re-running this check.
    check: sh "$INFRA_REFERENCES/checks/gha-workflows.sh"
    produces: GitHub Actions workflows for Terraform CI
    docs: docs/object-storage-ci.md#github-actions

  - id: gha-destroy-label
    operation: provision-execution
    implementation: object-storage
    phase: 1
    provider: github
    actor: HUMAN
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    title: Create the destructive apply intent label
    why: Deletes and replacements require explicit intent on the producing merged PR.
    check_summary: The allow-destroy label exists in the repository and the README Decisions table has a locked "Destructive apply" row with choice allow-destroy.
    cli:
      - effect: Creates the allow-destroy label in the repository. It fails if the label already exists, which leaves it untouched.
        run: |
          gh label create allow-destroy --repo "$REPO" --color B60205 \
            --description "Explicit opt-in to Terraform deletes and replacements"
    run: |
      Before printing the command, explain that allow-destroy is an intent marker, not
      authorization: any writer can add it, and it opts into all deletes in the refreshed
      apply plan, including drift. Obtain explicit approval first. After the label exists,
      record a locked "Destructive apply" decision with choice "allow-destroy" and the
      intent-marker limitations in the README Decisions table.
    tri_state: true
    check: |
      labels=$(gh label list --repo "$REPO" --limit 1000 --json name --jq '.[].name') || exit 2
      printf '%s\n' "$labels" | grep -Fxq 'allow-destroy' || exit 1
      awk -F '|' '
        function clean(v) { gsub(/^[[:space:]`]+|[[:space:]`]+$/, "", v); return tolower(v) }
        /^<!-- infra:decisions start -->[[:space:]]*$/ { if (in_table || ++starts > 1) bad=1; in_table=1; next }
        /^<!-- infra:decisions end -->[[:space:]]*$/ { if (!in_table || ++ends > 1) bad=1; in_table=0; next }
        !in_table { next }
        clean($2) == "destructive apply" && clean($3) == "allow-destroy" && clean($4) == "locked" {found=1}
        END {exit !(found && !bad && !in_table && starts == 1 && ends == 1)}
      ' README.md 2>/dev/null
    produces: allow-destroy label and a locked destructive apply decision
    docs: docs/object-storage-ci.md#destructive-apply-opt-in

  - id: cf-token-gha
    operation: store-cloudflare-credential
    implementation: object-storage
    phase: 2
    provider: cloudflare
    actor: HUMAN
    tri_state: true
    when: '[ "$CLOUDFLARE_BACKEND" = "object-storage" ]'
    title: Mint Cloudflare token and add as GitHub Actions secret
    why: The Terraform workflow authenticates to Cloudflare with this token.
    check_summary: The production main-only gate holds, CLOUDFLARE_API_TOKEN_READ is a repository secret, and CLOUDFLARE_API_TOKEN exists only in the production environment (not at repository or organization scope).
    ui:
      - form: Create the read-only plan token (the value is shown once, so keep the page open until it is stored)
        url: https://dash.cloudflare.com/profile/api-tokens
        fields: |
          Start from | Create Token, then Custom token, then Get started
          Token name | infra-cloudflare-plan
          Permissions (row 1) | Zone, DNS, Read
          Permissions (row 2) | Zone, Zone Settings, Read
          Permissions (more rows) | Add only resource-specific Read permissions as the leaf grows; never an Edit permission
          Account Resources | Include, the account with ID $CF_ACCOUNT_ID
          Zone Resources | Include, Specific zone, $DOMAIN
          Client IP filtering and TTL | leave blank
          Before you copy the token | The summary page lists only Read permissions
      - form: Create the apply token (the value is shown once, so keep the page open until it is stored)
        url: https://dash.cloudflare.com/profile/api-tokens
        fields: |
          Start from | Create Token, then Custom token, then Get started
          Token name | infra-cloudflare-apply
          Permissions (row 1) | Zone, DNS, Edit
          Permissions (row 2) | Zone, Zone Settings, Edit
          Permissions (more rows) | Add resource-specific permissions only as the leaf needs them
          Account Resources | Include, the account with ID $CF_ACCOUNT_ID
          Zone Resources | Include, Specific zone, $DOMAIN
          Client IP filtering and TTL | leave blank
    cli:
      - effect: Stores the plan token as the repository secret CLOUDFLARE_API_TOKEN_READ. The value comes from a hidden prompt, so run it in your own terminal.
        run: |
          gh secret set CLOUDFLARE_API_TOKEN_READ --repo "$REPO"
      - effect: Stores the apply token as CLOUDFLARE_API_TOKEN in the production environment only. The value comes from a hidden prompt, so run it in your own terminal.
        run: |
          gh secret set CLOUDFLARE_API_TOKEN --repo "$REPO" --env production
      - effect: Deletes any repository-level CLOUDFLARE_API_TOKEN left over from an earlier setup. It prints an error and changes nothing if there is none.
        run: |
          gh secret delete CLOUDFLARE_API_TOKEN --repo "$REPO"
    check: |
      sh "$INFRA_REFERENCES/checks/gha-apply-gate.sh" || exit $?
      repo_secrets=$(gh secret list --repo "$REPO" --json name -q '.[].name' 2>/dev/null) || exit 2
      env_secrets=$(gh secret list --repo "$REPO" --env production --json name -q '.[].name' 2>/dev/null) || exit 2
      owner_type=$(gh api "repos/$REPO" --jq '.owner.type' 2>/dev/null) || exit 2
      case "$owner_type" in
        Organization) org_secrets=$(gh api --paginate "repos/$REPO/actions/organization-secrets" --jq '.secrets[].name' 2>/dev/null) || exit 2 ;;
        User) org_secrets='' ;; # personal repositories cannot inherit organization secrets
        *) exit 2 ;;
      esac
      printf '%s\n' "$repo_secrets" | grep -Fxq CLOUDFLARE_API_TOKEN_READ || exit 1
      if printf '%s\n' "$repo_secrets" | grep -Fxq CLOUDFLARE_API_TOKEN; then exit 1; fi
      if printf '%s\n' "$org_secrets" | grep -Fxq CLOUDFLARE_API_TOKEN; then exit 1; fi
      printf '%s\n' "$env_secrets" | grep -Fxq CLOUDFLARE_API_TOKEN
    produces: read-only repository token and production-only edit token
    docs: cloudflare.md

  # ── Phase 3 — GitHub App credentials (backend: object-storage) ──────────
  - id: gh-app-gha
    operation: store-github-credential
    implementation: object-storage
    phase: 3
    provider: github
    actor: HUMAN
    tri_state: true
    when: '[ "$GITHUB_BACKEND" = "object-storage" ]'
    title: Configure GitHub App credentials in GitHub Actions secrets
    why: The Terraform workflow authenticates to GitHub with these App credentials.
    check_summary: 'Both Apps'' secrets exist by name: the plan App''s three at repository scope and the apply App''s three only in the production environment (not at repository or organization scope).'
    ui:
      - form: Create the read-only plan App, generate its key and install it (the .pem downloads once, so keep it private)
        url: https://github.com/organizations/$GITHUB_ORG/settings/apps/new
        fields: |
          GitHub App name | A unique name, for example $GITHUB_ORG-terraform-plan
          Homepage URL | A URL you control
          Callback URL | A URL you control
          Webhook, Active | Unchecked
          Repository permissions: Administration | Read-only
          Repository permissions: Actions | Read-only (reads environments and deployment branch policies on refresh)
          Repository permissions: Contents | Read-only
          Repository permissions: Metadata | Read-only
          Repository permissions: Pull requests | Read-only
          Organization permissions: Members | Read-only (the plan App never has a write permission, including for team membership)
          Organization permissions: Administration | Read-only
          Where can this GitHub App be installed | Only on this account
          After Create GitHub App: App ID | Copy it from the About section of the App's settings page
          After Create GitHub App: Private keys | Generate a private key; the .pem downloads once
          Install App | Install on $GITHUB_ORG, Only select repositories, every repository in managed_repos
          Installation ID | The number at the end of the settings URL after installing (.../installations/<number>)
      - form: Create the apply App, generate its key and install it (a second App with its own key; never reuse the plan App's .pem)
        url: https://github.com/organizations/$GITHUB_ORG/settings/apps/new
        fields: |
          GitHub App name | A unique name, for example $GITHUB_ORG-terraform-apply
          Homepage URL | A URL you control
          Callback URL | A URL you control
          Webhook, Active | Unchecked
          Repository permissions: Administration | Read and write
          Repository permissions: Actions | Read-only (reads environments and deployment branch policies on refresh)
          Repository permissions: Contents | Read and write (reads merge settings accurately on apply refresh)
          Repository permissions: Metadata | Read-only
          Repository permissions: Pull requests | Read and write
          Organization permissions: Members | Read and write (required when Terraform manages organization or team membership)
          Organization permissions: Administration | Read and write
          Where can this GitHub App be installed | Only on this account
          After Create GitHub App: App ID | Copy it from the About section of the App's settings page
          After Create GitHub App: Private keys | Generate a private key; the .pem downloads once
          Install App | Install on $GITHUB_ORG, Only select repositories, every repository in managed_repos
          Installation ID | The number at the end of the settings URL after installing (.../installations/<number>)
    cli:
      - effect: Copies the plan and apply App manifests into .github/apps/ so you can customize their names and URLs and review the permissions before registering each App. It never overwrites a manifest that is already there.
        run: |
          mkdir -p .github/apps
          cp -n "$INFRA_REFERENCES/templates/apps/terraform-plan.json" .github/apps/terraform-plan.json
          cp -n "$INFRA_REFERENCES/templates/apps/terraform-apply.json" .github/apps/terraform-apply.json
      - effect: Stores the plan App's three credentials as repository Actions secrets. The IDs and the key path are prompted for; the key is read from the file, so run it in your own terminal.
        run: |
          printf 'Plan App ID: '; read -r app_id
          printf %s "$app_id" | gh secret set GH_APP_READ_ID --repo "$REPO"
          printf 'Plan App installation ID: '; read -r installation_id
          printf %s "$installation_id" | gh secret set GH_APP_READ_INSTALLATION_ID --repo "$REPO"
          printf 'Absolute path to the plan App private key (.pem): '; read -r pem_file
          gh secret set GH_APP_READ_PEM --repo "$REPO" < "$pem_file"
      - effect: Stores the apply App's three credentials in the production environment only. Run it after the main-only production gate holds, in your own terminal.
        run: |
          printf 'Apply App ID: '; read -r app_id
          printf %s "$app_id" | gh secret set GH_APP_ID --repo "$REPO" --env production
          printf 'Apply App installation ID: '; read -r installation_id
          printf %s "$installation_id" | gh secret set GH_APP_INSTALLATION_ID --repo "$REPO" --env production
          printf 'Absolute path to the apply App private key (.pem): '; read -r pem_file
          gh secret set GH_APP_PEM --repo "$REPO" --env production < "$pem_file"
      - effect: Deletes any repository-level copy of the apply App's secrets. It prints an error for each name that is not there and changes nothing.
        run: |
          for name in GH_APP_ID GH_APP_INSTALLATION_ID GH_APP_PEM; do
            gh secret delete "$name" --repo "$REPO"
          done
    run: |
      The manifests in .github/apps/ are the reviewed source of each App's permissions
      (github.md#versioned-app-manifests); the forms register the same permissions by hand.
      The agent never sees a PEM. Once the human replies done and says both live permission
      sets and both secret scopes were verified, record, and commit,
      the distinct public IDs in config.github_apps.plan_app_id and apply_app_id, the current
      strict UTC time in github_apps.reviewed_at, and the `git hash-object` of the two customized
      committed manifests as github_apps.plan_manifest_blob and apply_manifest_blob. Re-review
      after any secret update or live permission change; a manifest change invalidates the review.
    check: |
      sh "$INFRA_REFERENCES/checks/gha-apply-gate.sh" || exit $?
      repo_secrets=$(gh secret list --repo "$REPO" --json name -q '.[].name' 2>/dev/null) || exit 2
      env_secrets=$(gh secret list --repo "$REPO" --env production --json name -q '.[].name' 2>/dev/null) || exit 2
      owner_type=$(gh api "repos/$REPO" --jq '.owner.type' 2>/dev/null) || exit 2
      case "$owner_type" in
        Organization) org_secrets=$(gh api --paginate "repos/$REPO/actions/organization-secrets" --jq '.secrets[].name' 2>/dev/null) || exit 2 ;;
        User) org_secrets='' ;;
        *) exit 2 ;;
      esac
      for name in GH_APP_READ_ID GH_APP_READ_INSTALLATION_ID GH_APP_READ_PEM; do
        printf '%s\n' "$repo_secrets" | grep -Fxq "$name" || exit 1
      done
      for name in GH_APP_ID GH_APP_INSTALLATION_ID GH_APP_PEM; do
        if printf '%s\n' "$repo_secrets" | grep -Fxq "$name"; then exit 1; fi
        if printf '%s\n' "$org_secrets" | grep -Fxq "$name"; then exit 1; fi
        printf '%s\n' "$env_secrets" | grep -Fxq "$name" || exit 1
      done
    produces: GitHub Actions secrets for GitHub App authentication
    docs: github.md

  # ── Phase 4 — First plan (backend: object-storage) ──────────────────────
  - id: plan-cloudflare-gha
    operation: plan-cloudflare
    implementation: object-storage
    phase: 4
    provider: cloudflare
    actor: AGENT
    tri_state: true
    when: '[ "$CLOUDFLARE_BACKEND" = "object-storage" ]'
    title: verify plan for cloudflare via GitHub Actions
    why: Proves the Cloudflare token and backend configuration end-to-end via CI.
    run: |
      Trigger or inspect the GitHub Actions plan workflow for terraform/cloudflare.
      You can dispatch it via `gh workflow run terraform-plan.yml --repo "$REPO" --ref "$(git branch --show-current)"` or open a PR.
      Verify that the plan-cloudflare job runs and finishes successfully.
    check: |
      sh "$INFRA_REFERENCES/checks/workflow-routing.sh" || exit $?
      # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
      # Fail closed: if git status fails, treat as dirty rather than clean
      dirty_status=$(git status --porcelain -- terraform/cloudflare terraform/modules README.md mise.toml mise.lock .github/workflows/terraform-plan.yml .github/workflows/terraform-apply.yml) || {
        echo "git status failed - cannot verify working tree state" >&2
        exit 1
      }
      if [ -n "$dirty_status" ]; then
        echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
        exit 1
      fi
      # Find the newest commit that changed relevant paths
      target_sha=$(git log --format=%H -1 -- terraform/cloudflare terraform/modules README.md mise.toml mise.lock .github/workflows/terraform-plan.yml .github/workflows/terraform-apply.yml 2>/dev/null)
      [ -n "$target_sha" ] || exit 1
      # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
      branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
      run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
        --json databaseId,conclusion,event,headSha \
        -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null) || exit 2
      [ -n "$run_info" ] && [ "$run_info" != null ] || exit 1
      run_id=$(printf '%s' "$run_info" | jq -er '.databaseId | select(type == "number")') || exit 2
      run_sha=$(printf '%s' "$run_info" | jq -er '.headSha | select(type == "string" and length > 0)') || exit 2
      conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion') || exit 2
      # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
      git merge-base --is-ancestor "$target_sha" "$run_sha" || exit 1
      [ "$conclusion" = "success" ] || exit 1
      jobs=$(gh run view "$run_id" --repo "$REPO" --json jobs \
        -q '.jobs[] | select(.name=="plan-cloudflare" and .conclusion=="success") | .name' 2>/dev/null) || exit 2
      printf '%s\n' "$jobs" | grep -Fxq 'plan-cloudflare'
    produces: green plan for cloudflare in GitHub Actions
    docs: docs/object-storage-ci.md#github-actions

