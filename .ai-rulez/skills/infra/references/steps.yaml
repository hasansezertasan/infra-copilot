  - id: status-check-context
    operation: required-check-context
    implementation: hcp
    phase: 4
    provider: github
    actor: AGENT
    when: '[ "$HAS_HCP" = "true" ]'
    title: Required status check context matches what HCP publishes
    why: >-
      A required context HCP no longer posts blocks every PR on
      "Expected — Waiting for status to be reported", forever, while every other
      check stays green.
    run: >-
      Read the context HCP actually published, then in
      terraform/github/branch_protection.tf replace ONLY the stale
      "Terraform Cloud/…" entry with it. Keep every other required context —
      terraform fmt and both terraform validate checks — exactly as they are;
      dropping them would allow merges with no CI at all. The stale context
      blocks the very PR carrying this fix, so follow the break-glass sequence
      in docs/hcp-ci.md#break-glass-the-fix-cannot-merge-through-the-normal-path.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: sh "$INFRA_REFERENCES/checks/status-check-context.sh"
