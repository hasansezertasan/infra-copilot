  - id: status-check-gha
    operation: required-check-context
    implementation: object-storage
    phase: 4
    provider: github
    actor: AGENT
    tri_state: true
    when: '[ "$HAS_OBJECT_STORAGE" = "true" ]'
    title: Required status checks match GitHub Actions job names
    why: Branch protection must reference the actual job names from the workflows.
    run: |
      In terraform/github/branch_protection.tf, ensure required_status_checks
      includes the published job contexts: "validate (cloudflare)", "validate (github)",
      and "plan" (the aggregate check from terraform-plan.yml).
      In mixed mode retain the HCP context for remaining HCP leaves as well.
      The GitHub leaf's backend does not select the repository's protection mechanism.
      Verify the aggregate covers every object-storage leaf including additional providers.
    check: |
      sh "$INFRA_REFERENCES/checks/workflow-routing.sh" || exit $?
      # Verify HCL declares the required contexts
      test -f terraform/github/branch_protection.tf || exit 1
      contexts=$(sed -n '/required_status_checks/,/}/p' terraform/github/branch_protection.tf)
      echo "$contexts" | grep -q '"plan"' || exit 1
      echo "$contexts" | grep -q '"validate (cloudflare)"' || exit 1
      echo "$contexts" | grep -q '"validate (github)"' || exit 1
      # Live verification is deferred to workflow execution - if protection isn't applied,
      # PRs will merge without required checks which is immediately visible.
      # The HCL source-of-truth above ensures the Terraform run will configure it correctly.
    produces: branch protection references GitHub Actions job names
    docs: docs/object-storage-ci.md#branch-protection

  # ── Phase 2 — Cloudflare credentials (backend: hcp) ──────────────────────
  - id: cf-token
    operation: store-cloudflare-credential
    implementation: hcp
    phase: 2
    provider: cloudflare
    actor: HUMAN
    when: '[ "$CLOUDFLARE_BACKEND" = "hcp" ]'
    title: Mint Cloudflare token and paste into HCP
    why: The cloudflare workspace authenticates to Cloudflare with this token.
    check_summary: The cloudflare workspace has a sensitive Terraform variable named cloudflare_api_token.
    ui:
      - form: Create the Cloudflare API token (the value is shown once, so copy it before leaving the page)
        url: https://dash.cloudflare.com/profile/api-tokens
        fields: |
          Start from | Create Token, then Custom token, then Get started
          Token name | infra-cloudflare
          Permissions (row 1) | Zone, DNS, Edit
          Permissions (row 2) | Zone, Zone Settings, Edit
          Account Resources | Include, the account with ID $CF_ACCOUNT_ID
          Zone Resources | Include, Specific zone, $DOMAIN
          Client IP filtering and TTL | leave blank
    cli:
      - effect: Creates the sensitive Terraform variable cloudflare_api_token in the cloudflare HCP workspace. The token is read from a hidden prompt and the call authenticates with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            printf 'Cloudflare API token: '; read -rs value; echo
            [ -n "$value" ] || { echo 'No token entered.' >&2; exit 1; }
            hcp_login='"header = \"Authorization: Bearer " + .credentials["app.terraform.io"].token + "\""'
            ws=$(curl -sf --config <(jq -r "$hcp_login" ~/.terraform.d/credentials.tfrc.json) \
              "$hcp_api/organizations/$ORG/workspaces/cloudflare" | jq -er '.data.id')
            printf %s "$value" \
              | jq -Rs '{data:{type:"vars",attributes:{key:"cloudflare_api_token",value:.,category:"terraform",sensitive:true}}}' \
              | curl -sf -X POST --config <(jq -r "$hcp_login" ~/.terraform.d/credentials.tfrc.json) \
                  -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/workspaces/$ws/vars" >/dev/null
          )
    check: |
      WS_ID=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/cloudflare" -H "Authorization: Bearer $HCP_TOKEN" | jq -r '.data.id')
      curl -sf "$hcp_api/workspaces/$WS_ID/vars" -H "Authorization: Bearer $HCP_TOKEN" \
        | jq -e '[.data[]
            | select(.attributes.key == "cloudflare_api_token")
            | .attributes.category == "terraform" and .attributes.sensitive == true] | any' >/dev/null
    produces: sensitive var `cloudflare_api_token`
    docs: cloudflare.md

  # ── Phase 3 — GitHub App credentials (backend: hcp) ──────────────────────
  - id: gh-app
    operation: store-github-credential
    implementation: hcp
    phase: 3
    provider: github
    actor: HUMAN
    when: '[ "$GITHUB_BACKEND" = "hcp" ]'
    title: Create + install GitHub App, paste creds into HCP
    why: The github-org workspace authenticates as a GitHub App (not a PAT).
    check_summary: The github-org workspace has Terraform variables github_owner plus sensitive github_app_id, github_app_installation_id and github_app_pem.
    ui:
      - form: Create the GitHub App, generate its key and install it (the .pem downloads once, so keep it private)
        url: https://github.com/organizations/$GITHUB_ORG/settings/apps/new
        fields: |
          GitHub App name | A unique name, for example $GITHUB_ORG-terraform
          Homepage URL | A URL you control
          Webhook, Active | Unchecked
          Repository permissions: Administration | Read and write
          Repository permissions: Actions | Read-only (reads environments and deployment branch policies on refresh)
          Repository permissions: Contents | Read-only
          Repository permissions: Metadata | Read-only
          Repository permissions: Pull requests | Read and write
          Organization permissions: Members | Read and write (needed when Terraform manages organization or team membership; read-only only lets the provider inspect memberships)
          Organization permissions: Administration | Read and write
          Where can this GitHub App be installed | Only on this account
          After Create GitHub App: App ID | Copy it from the About section of the App's settings page
          After Create GitHub App: Private keys | Generate a private key; the .pem downloads once
          Install App | Install on $GITHUB_ORG, Only select repositories, every repository in managed_repos
          Installation ID | The number at the end of the settings URL after installing (.../installations/<number>)
    cli:
      - effect: 'Creates the four Terraform variables in the github-org HCP workspace. github_owner is not sensitive; the App ID and installation ID come from hidden prompts and the key from the .pem file, so run it in your own terminal. It authenticates with your HCP login from the Terraform credentials file. Run it once: a variable that already exists makes the call fail, so delete it in the workspace first.'
        run: |
          (
            set -eu; set -o pipefail
            printf 'GitHub App ID: '; read -rs app_id; echo
            printf 'GitHub App installation ID: '; read -rs installation_id; echo
            printf 'Absolute path to the private key (.pem): '; read -r pem_file
            [ -n "$app_id" ] && [ -n "$installation_id" ] && [ -r "$pem_file" ] \
              || { echo 'Missing App ID, installation ID or readable key file.' >&2; exit 1; }
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            ws=$(curl -sf --config <(auth) \
              "$hcp_api/organizations/$ORG/workspaces/github-org" | jq -er '.data.id')
            set_var() {
              var_key=$1 var_sensitive=$2 jq -Rs '{data:{type:"vars",attributes:{key:env.var_key,value:.,category:"terraform",sensitive:(env.var_sensitive == "true")}}}' \
                | curl -sf -X POST --config <(auth) \
                    -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/workspaces/$ws/vars" >/dev/null
            }
            printf %s "$GITHUB_ORG" | set_var github_owner false
            printf %s "$app_id" | set_var github_app_id true
            printf %s "$installation_id" | set_var github_app_installation_id true
            set_var github_app_pem true < "$pem_file"
          )
    check: |
      WS_ID=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/github-org" -H "Authorization: Bearer $HCP_TOKEN" | jq -r '.data.id')
      curl -sf "$hcp_api/workspaces/$WS_ID/vars" -H "Authorization: Bearer $HCP_TOKEN" | jq -e '
        [.data[] | select(.attributes.category == "terraform") | .attributes] as $tf
        | ($tf | map(.key)) as $keys
        | ($tf | map(select(.sensitive == true) | .key)) as $sensitive
        | ((["github_app_id", "github_app_installation_id", "github_app_pem"] - $sensitive) | length) == 0
          and ((["github_owner"] - $keys) | length) == 0' >/dev/null
    produces: sensitive vars github_app_id / _installation_id / _pem, plus github_owner
    docs: github.md

  # ── Phase 4 — First plan (backend: hcp) ──────────────────────────────────
  - id: hcp-apply-scope
    operation: plan-access
    implementation: hcp
    phase: 4
    provider: hcp
    actor: HUMAN
    when: '[ "$HAS_HCP" = "true" ]'
    title: The HCP credential this repo uses cannot apply
    why: >-
      docs/policy.md works through every host-level permission control and finds
      that none of them constrain this plugin: Bash denies are wrapped by
      `mise exec --`, Read denies do not govern subprocesses, and a Skill deny is
      reached around by the command. Narrowing the credential is the strongest
      control left, and `terraform login` mints a user token that can apply
      anything the operator can. It is not a boundary against a hostile actor:
      HCP treats plan as security-equivalent to write, because a plan runs the
      configuration's code with access to workspace variables and state. What it
      buys is the removal of the direct apply path, so an accidental apply takes
      deliberate steps. Nothing here applies — setup stops at speculative plans — but
      a repo bootstrapped by this plugin leaves its agent apply rights on
      production until someone narrows them. First step of phase 4, so the plan
      steps that follow already run under the narrowed credential — and, like
      every other HUMAN step, the scan stops here and hands off rather than
      continuing past it.
    check_summary: The credential this machine offers HCP (TF_TOKEN_app_terraform_io, else the Terraform credentials file) is a plan-only team token, not a user token or one that can apply.
    cli:
      - effect: Creates the team infra-plan-only with every organization permission off, or resets an existing one to that state and fails unless every organization permission in the response is off; this needs an HCP plan that includes teams. Never add "Manage version control settings" or any other organization permission to it; organization permissions are the self-elevation risk this step removes. It authenticates with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            team=$(curl -sf --config <(auth) "$hcp_api/organizations/$ORG/teams?filter%5Bnames%5D=infra-plan-only" \
              | jq -r '[.data[] | select(.attributes.name == "infra-plan-only")][0].id // empty')
            if [ -n "$team" ]; then
              resp=$(team_id=$team jq -n '{data:{id:env.team_id,type:"teams",attributes:{name:"infra-plan-only","organization-access":{"manage-policies":false,"manage-policy-overrides":false,"manage-workspaces":false,"manage-vcs-settings":false,"manage-providers":false,"manage-modules":false,"manage-run-tasks":false,"manage-projects":false,"read-projects":false,"read-workspaces":false,"manage-membership":false,"manage-teams":false,"manage-organization-access":false,"manage-agent-pools":false}}}}' \
                | curl -s -w '\n%{http_code}' -X PATCH --config <(auth) \
                    -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/teams/$team")
            else
              resp=$(jq -n '{data:{type:"teams",attributes:{name:"infra-plan-only","organization-access":{"manage-policies":false,"manage-policy-overrides":false,"manage-workspaces":false,"manage-vcs-settings":false,"manage-providers":false,"manage-modules":false,"manage-run-tasks":false,"manage-projects":false,"read-projects":false,"read-workspaces":false,"manage-membership":false,"manage-teams":false,"manage-organization-access":false,"manage-agent-pools":false}}}}' \
                | curl -s -w '\n%{http_code}' -X POST --config <(auth) \
                    -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/organizations/$ORG/teams")
            fi
            code=${resp##*$'\n'}
            case "$code" in 200|201) ;; *) echo "HTTP $code: $resp" >&2; exit 1 ;; esac
            printf '%s' "${resp%$'\n'*}" | jq -e '.data.attributes["organization-access"] | type == "object" and all(.[]; . == false)' >/dev/null \
              || { echo 'infra-plan-only still has an organization permission switched on; turn it off before minting its token.' >&2; exit 1; }
          )
      - effect: Removes any project-level access the team holds on every project in $ORG, because HCP combines project, workspace and organization access at the most permissive level and a leftover Write, Maintain, Admin or custom project role would keep the credential able to apply. Only the team's own project-access relationships are deleted, after every page of each project's list has been read. It authenticates with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            team=$(curl -sf --config <(auth) "$hcp_api/organizations/$ORG/teams?filter%5Bnames%5D=infra-plan-only" \
              | jq -er '[.data[] | select(.attributes.name == "infra-plan-only")][0].id')
            page=1
            while :; do
              body=$(curl -sf --config <(auth) \
                "$hcp_api/organizations/$ORG/projects?page%5Bsize%5D=100&page%5Bnumber%5D=$page")
              for project in $(printf '%s' "$body" | jq -r '.data[].id'); do
                tp_ids=''
                tp_page=1
                while :; do
                  tp_body=$(curl -sf --config <(auth) \
                    "$hcp_api/team-projects?filter%5Bproject%5D%5Bid%5D=$project&page%5Bsize%5D=100&page%5Bnumber%5D=$tp_page")
                  tp_ids="$tp_ids $(printf '%s' "$tp_body" | team_id=$team jq -r '.data[] | select(.relationships.team.data.id == env.team_id) | .id')"
                  tp_page=$(printf '%s' "$tp_body" | jq -r '.meta.pagination["next-page"] // empty')
                  [ -n "$tp_page" ] || break
                done
                for tp in $tp_ids; do
                  code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE --config <(auth) "$hcp_api/team-projects/$tp")
                  [ "$code" = 204 ] || { echo "team-project $tp: HTTP $code" >&2; exit 1; }
                done
              done
              page=$(printf '%s' "$body" | jq -r '.meta.pagination["next-page"] // empty')
              [ -n "$page" ] || break
            done
          )
      - effect: Grants the team the Plan permission, not Write (which includes apply), on every workspace in $ORG connected to $REPO. Sets a workspace's existing grant to Plan if it is at another level, so run it again whenever add creates a new workspace. It reads every page of workspaces. It authenticates with your HCP login from the Terraform credentials file.
        run: |
          (
            set -eu; set -o pipefail
            cred=$(printenv TF_TOKEN_app_terraform_io || jq -r '.credentials["app.terraform.io"].token // empty' ~/.terraform.d/credentials.tfrc.json)
            [ -n "$cred" ] || { echo 'No HCP credential found.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$cred"; }
            team=$(curl -sf --config <(auth) \
              "$hcp_api/organizations/$ORG/teams?filter%5Bnames%5D=infra-plan-only" \
              | jq -er '[.data[] | select(.attributes.name == "infra-plan-only")][0].id')
            page=1
            while :; do
              body=$(curl -sf --config <(auth) \
                "$hcp_api/organizations/$ORG/workspaces?page%5Bsize%5D=100&page%5Bnumber%5D=$page")
              printf '%s' "$body" \
                | repo=$REPO jq -r '.data[] | select(.attributes["vcs-repo"].identifier == env.repo) | .id' \
                | while read -r ws; do
                    tw=$(curl -sf --config <(auth) "$hcp_api/team-workspaces?filter%5Bworkspace%5D%5Bid%5D=$ws" \
                      | team_id=$team jq -r '[.data[] | select(.relationships.team.data.id == env.team_id)][0].id // empty')
                    if [ -n "$tw" ]; then
                      resp=$(printf '%s' '{"data":{"type":"team-workspaces","attributes":{"access":"plan"}}}' \
                        | curl -s -w '\n%{http_code}' -X PATCH --config <(auth) \
                            -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/team-workspaces/$tw")
                    else
                      resp=$(team_id=$team ws_id=$ws jq -n '{data:{type:"team-workspaces",attributes:{access:"plan"},relationships:{workspace:{data:{type:"workspaces",id:env.ws_id}},team:{data:{type:"teams",id:env.team_id}}}}}' \
                        | curl -s -w '\n%{http_code}' -X POST --config <(auth) \
                            -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/team-workspaces")
                    fi
                    code=${resp##*$'\n'}
                    case "$code" in 200|201) ;; *) echo "HTTP $code: $resp" >&2; exit 1 ;; esac
                  done
              page=$(printf '%s' "$body" | jq -r '.meta.pagination["next-page"] // empty')
              [ -n "$page" ] || break
            done
          )
    ui:
      - form: Mint the team token (the value is shown once, so keep the page open until it is stored; run this last, after phases 0 and 1)
        url: https://app.terraform.io/app/$ORG/settings/teams
        fields: |
          Open | The team infra-plan-only, then Team API Token
          Create a team token | Generate token, with no expiration or one you will renew
          Store it | Replace the token in ~/.terraform.d/credentials.tfrc.json, or export TF_TOKEN_app_terraform_io from a place every shell and the agent's environment get it; the variable wins over the file
          Remove the user token | Leave no user token on this machine, because a team token cannot complete the OAuth flow vcs-connect needs and the user token can apply
          Never | Paste the token into the conversation or into the agent
    run: |
      `terraform` never reads $HCP_TOKEN: it reads TF_TOKEN_app_terraform_io, else the
      credentials file, and the variable wins, so a plan-only $HCP_TOKEN beside an
      apply-capable file leaves the CLI able to apply. Step 0 resolves HCP_TOKEN in the same
      order, so either route survives later runs; a variable exported in one shell only is
      not enough. vcs-connect stays green or reports `?` under this credential, because its
      check falls back to the workspace connected to $REPO; do not grant organization
      permissions to turn it green, and re-verify phase 1 with the user token if needed.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    # The credentials-file route replaces a file but cannot update the current
    # process environment. Resolve HCP_TOKEN again here so a user token exported
    # during Step 0 cannot create a false SPLIT-BRAIN verdict after the handoff.
    check: >-
      export HCP_TOKEN=${TF_TOKEN_app_terraform_io:-$(jq -r
      '.credentials["app.terraform.io"].token'
      ~/.terraform.d/credentials.tfrc.json)} &&
      sh "$INFRA_REFERENCES/checks/hcp-apply-scope.sh"
    produces: an agent credential with no direct apply path (not a boundary against a hostile actor — see docs/policy.md)
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: gha-plan-access
