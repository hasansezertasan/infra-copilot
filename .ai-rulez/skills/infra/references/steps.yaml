  # ── Phase 5 — Migration (only if resources pre-exist) ───────────────────
  # template-adopt is the exception to "phase 5 is optional": it is infra-import's
  # prerequisite, and runs first, on a repo that pre-dates the Template.
  - id: template-adopt
    phase: 5
    provider: repo
    actor: AGENT
    title: Adopt the copier-infra Template into an existing repo, with conflicts reviewed
    why: A repo that pre-dates the Template, including one made from the old infra-template GitHub template, has no answers file, so the Template's update cannot work and the Config block the other steps read is missing.
    run: |
      Import only. Follow docs/import.md#adopt-the-template-first, which owns the procedure
      and every step of it. The rules that matter here: collect every answer from the tagged
      copier.yml as `template-render` does, from the repo's actual state, never the defaults;
      render the Template into a scratch
      directory, never `copier copy` into the repo itself; reconcile file by file, showing
      the human the diff of every file that differs, README.md included, and never
      overwriting on your own; mise.toml and mise.lock are always shown to the human, even
      when absent, and `mise trust --untrust` runs before the commit; compare the whole scratch
      render with the repo and commit the answers file last, on a branch that does not apply. A legacy `.infra-copilot/`
      stops the skill before this step (config.md#unsupported-legacy-state). Then run
      `template-contract` and `toolchain-pin`.
    # The check reads what survives a restart: the answers file, the Config block and the
    # files every render carries. The complete file set can only be compared against the
    # scratch render, which is gone by then, so that comparison is a run step in the runbook.
    check: >-
      git ls-files --error-unmatch .copier-answers.yml README.md mise.toml mise.lock
      AGENTS.md >/dev/null 2>&1 &&
      git diff --quiet HEAD -- .copier-answers.yml README.md mise.toml mise.lock AGENTS.md &&
      git diff --cached --quiet HEAD -- .copier-answers.yml README.md mise.toml mise.lock AGENTS.md &&
      git ls-files 'terraform/*/backend.tf' | grep -q . &&
      sh "$INFRA_REFERENCES/checks/template-contract.sh" --source-only &&
      grep -q '<!-- infra:config start -->' README.md &&
      grep -q '<!-- infra:config end -->' README.md
    produces: a committed .copier-answers.yml, the Template's Config block and its tool pins in the existing repo
    docs: docs/import.md#adopt-the-template-first

  - id: migrate-discovery-token
    phase: 5
    provider: cloudflare
    actor: HUMAN
    title: Mint short-lived read-only Cloudflare discovery token
    why: cf-terraforming reads existing resources; use a throwaway READ token, not the HCP edit token.
    check_summary: Nothing is checked; the token is ephemeral, so the discovery run itself proves it works.
    ui:
      - form: Create the throwaway read-only discovery token (the value is shown once; delete the token after the import)
        url: https://dash.cloudflare.com/profile/api-tokens
        fields: |
          Start from | Create Token, then Custom token, then Get started
          Token name | infra-discovery-read
          Permissions (row 1) | Zone, DNS, Read
          Permissions (more rows) | One Read row for each other resource type you want discovered, as a Zone row for a zone resource (for example Zone, Email Routing Rules, Read) or an Account row for an account resource (for example Account, Email Routing Addresses, Read); never an Edit permission
          Account Resources | Include, the account with ID $CF_ACCOUNT_ID
          Zone Resources | Include, Specific zone, $DOMAIN
          Client IP filtering | leave blank
          TTL | Start date now, end date a few hours from now
    check: ~   # YAML null — ephemeral credential, no scriptable check (see header contract)
    produces: throwaway read token (deleted after import)
    docs: docs/import.md#discovery-token

  - id: migrate-import
    operation: import-resources
    implementation: both
    phase: 5
    provider: cloudflare
    actor: AGENT
    tri_state: true   # exit 2 = could not verify; see protocol.md
    title: Generate HCL + import blocks, verify plan imports (not creates)
    why: Bring existing zone/records under management without recreating them.
    run: |
      Follow docs/import.md: cf-terraforming generate + import (--modern-import-block)
      into terraform/cloudflare/generated.tf, then verify plan shows imports only.
      In HCP mode: run terraform plan locally (credentials are in HCP workspace vars).
      In object-storage mode: commit generated.tf, push, trigger the plan workflow via
      `gh workflow run terraform-plan.yml --ref "$(git branch --show-current)"`, and inspect the workflow run logs.
    # One plan, captured once to a private mktemp file (0600, auto-removed), not a fixed
    # world-readable /tmp path. Success = at least one import AND zero creates. (If a change
    # legitimately adds a new resource alongside the import, review by hand — this check
    # intentionally treats any 'will be created' as not-done.)
    check: |
      if [ "$CLOUDFLARE_BACKEND" = "object-storage" ]; then
        sh "$INFRA_REFERENCES/checks/workflow-routing.sh" || exit $?
        # In object-storage mode, verify via the GitHub Actions plan workflow
        # A real cf-terraforming adoption splits its output by zone and resource type, so
        # `generated.tf` is one possible name among several, not the name.
        [ -n "$(git --no-optional-locks ls-files -- ':/terraform/cloudflare/generated*.tf')" ] || exit 1
        # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
        # Fail closed: if git status fails, treat as dirty rather than clean
        dirty_status=$(git status --porcelain -- terraform/cloudflare terraform/modules README.md mise.toml mise.lock .github/workflows/terraform-plan.yml .github/workflows/terraform-apply.yml) || {
          echo "git status failed - cannot verify working tree state" >&2
          exit 1
        }
        if [ -n "$dirty_status" ]; then
          echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
          exit 1
        fi
        # Find the newest commit that changed relevant paths
        target_sha=$(git log --format=%H -1 -- terraform/cloudflare terraform/modules README.md mise.toml mise.lock .github/workflows/terraform-plan.yml .github/workflows/terraform-apply.yml 2>/dev/null)
        [ -n "$target_sha" ] || exit 1
        # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
        branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
        # gh's own status, separately from what it returned: `gh help exit-codes` gives 1
        # for any failure and 4 for authentication, so an outage or an expired login is
        # indistinguishable from "no run" unless the code is read. Reporting either as a
        # failed step would route someone to corrective work on no evidence at all.
        run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
          --json databaseId,conclusion,event,headSha \
          -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null)
        gh_rc=$?
        [ "$gh_rc" -eq 0 ] || {
          echo "gh run list failed (exit $gh_rc) - cannot verify the plan" >&2
          exit 2
        }
        [ -n "$run_info" ] || {
          echo "no plan run for this branch - cannot verify the plan" >&2
          exit 2
        }
        run_id=$(printf '%s' "$run_info" | jq -r '.databaseId')
        run_sha=$(printf '%s' "$run_info" | jq -r '.headSha')
        conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion')
        # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
        # --is-ancestor gives 0/1 for yes/no and >1 for "could not evaluate" -- a shallow
        # clone need not hold an older commit at all. Collapsing those into "no" reports
        # an unreadable history as an unfinished import.
        git merge-base --is-ancestor "$target_sha" "$run_sha" 2>/dev/null
        anc_rc=$?
        [ "$anc_rc" -le 1 ] || {
          echo "cannot evaluate ancestry (git exit $anc_rc; shallow clone?) - cannot verify" >&2
          exit 2
        }
        [ "$anc_rc" -eq 0 ] || exit 1
        [ "$conclusion" = "success" ] || exit 1
        # Get the job ID for plan-cloudflare
        job_id=$(gh run view "$run_id" --repo "$REPO" --json jobs \
          -q '.jobs[] | select(.name=="plan-cloudflare" and .conclusion=="success") | .databaseId' 2>/dev/null)
        gh_rc=$?
        [ "$gh_rc" -eq 0 ] || {
          echo "gh run view failed (exit $gh_rc) - cannot verify the plan" >&2
          exit 2
        }
        [ -n "$job_id" ] || {
          echo "no successful plan-cloudflare job in run $run_id - cannot verify" >&2
          exit 2
        }
        # Get logs for the specific job (avoids parsing issues with full run logs)
        job_logs=$(gh run view "$run_id" --repo "$REPO" --job "$job_id" --log 2>/dev/null)
        gh_rc=$?
        [ "$gh_rc" -eq 0 ] && [ -n "$job_logs" ] || {
          echo "could not read the plan log (gh exit $gh_rc) - cannot verify" >&2
          exit 2
        }
        # Completion predicate:
        # - Reject if plan creates or destroys resources (import must be additive-only)
        # - Accept if 'will be imported' (pending) OR 'No changes' (done - post-apply no-op)
        if printf '%s' "$job_logs" | grep -q 'will be created'; then
          echo "Import check failed: plan would create resources" >&2
          exit 1
        fi
        if printf '%s' "$job_logs" | grep -qE 'will be destroyed|will be deleted'; then
          echo "Import check failed: plan would destroy resources" >&2
          exit 1
        fi
        # Reject state-forget actions (removed { destroy = false })
        if printf '%s' "$job_logs" | grep -qE 'will no longer be managed|will be forgotten'; then
          echo "Import check failed: plan would forget resources from state" >&2
          exit 1
        fi
        # Accept pending imports
        if printf '%s' "$job_logs" | grep -q 'will be imported'; then
          exit 0  # Pending imports - ready for apply
        fi
        # Accept no-op plan only if imports were actually applied (check apply workflow)
        if printf '%s' "$job_logs" | grep -qE 'No changes|Your infrastructure matches the configuration'; then
          # Verify imports were applied by checking for a successful apply-cloudflare run
          # this revision descends from. NOT one that descends from target_sha: on a prune
          # branch target_sha IS the prune commit, and nothing can have applied it before
          # the merge -- which would report every valid prune PR as an unfinished import.
          # The weaker test is still safe here, because a plan with pending imports says
          # 'will be imported' and a premature prune says 'will be created'; both are
          # rejected above, so only a genuinely realized leaf reaches this point.
          # --limit caps what is FETCHED, before any filtering, and the apply workflow
          # runs for every terraform/** push -- so ten runs of history can easily predate
          # nothing at all. A prune deferred by a couple of weeks needs to still find the
          # import's apply. --status success spends the budget only on runs that can
          # match; beyond 100, this reports red and a human confirms the apply.
          apply_runs=$(gh run list --repo "$REPO" --workflow terraform-apply.yml --branch main \
            --status success --limit 100 \
            --json databaseId,conclusion,headSha \
            -q '[.[] | select(.conclusion=="success")]' 2>/dev/null)
          gh_rc=$?
          [ "$gh_rc" -eq 0 ] || {
            echo "gh run list failed (exit $gh_rc) - cannot verify the apply" >&2
            exit 2
          }
          found_valid_apply=false
          for apply_run in $(printf '%s' "$apply_runs" | jq -r '.[] | @base64'); do
            apply_sha=$(printf '%s' "$apply_run" | base64 -d | jq -r '.headSha')
            apply_id=$(printf '%s' "$apply_run" | base64 -d | jq -r '.databaseId')
            # Verify this revision descends from the applied commit
            git merge-base --is-ancestor "$apply_sha" HEAD 2>/dev/null
            anc_rc=$?
            [ "$anc_rc" -le 1 ] || {
              echo "cannot evaluate ancestry (git exit $anc_rc; shallow clone?) - cannot verify" >&2
              exit 2
            }
            if [ "$anc_rc" -eq 0 ]; then
              apply_job=$(gh run view "$apply_id" --repo "$REPO" --json jobs \
                -q '.jobs[] | select(.name=="apply-cloudflare" and .conclusion=="success") | .databaseId' 2>/dev/null)
              gh_rc=$?
              [ "$gh_rc" -eq 0 ] || {
                echo "gh run view failed (exit $gh_rc) - cannot verify the apply" >&2
                exit 2
              }
              if [ -n "$apply_job" ]; then
                found_valid_apply=true
                break
              fi
            fi
          done
          if [ "$found_valid_apply" = "true" ]; then
            exit 0  # Import completed - apply workflow ran for the import commit
          fi
          echo "Import check: plan shows 'No changes' but this revision descends from no successful apply-cloudflare run" >&2
          echo "Run terraform-apply workflow to complete the import" >&2
          exit 1
        fi
        echo "Import check failed: expected 'will be imported' or 'No changes'" >&2
        exit 1
      else
        # HCP mode: local terraform plan. Accept EITHER pending imports OR a no-op plan:
        # once the import applies -- and especially once prune-spent-imports removes the
        # spent blocks -- the plan reads 'No changes.', which is the correct terminal
        # state. Demanding 'will be imported' made this step green only while work was
        # outstanding and permanently red once it was finished.
        # Committed HCL first, for BOTH outcomes below. A local plan reads the working
        # tree, so uncommitted generated HCL plans pending imports that no run can ever
        # apply -- and prune-spent-imports, which reads HEAD, would be green too, leaving
        # phase 5 all green with nothing committed. For the no-op outcome the same file is
        # what separates "everything was adopted" from "nothing ever was". Root-anchored,
        # because the plan below runs from inside the leaf.
        [ -n "$(git --no-optional-locks ls-files -- ':/terraform/cloudflare/generated*.tf')" ] || exit 1
        # Tracked is not committed: an edit to a tracked file still plans locally while
        # HEAD -- the thing CI applies, and the thing prune-spent-imports reads -- knows
        # nothing about it. Fail closed if the status read itself fails, as the
        # object-storage branch above does.
        # Same paths the object-storage branch above rejects on: a working-tree config.md
        # picks the backend and workspace this very check reads, and mise pins the
        # terraform that runs the plan -- so either one dirty means the plan came from a
        # configuration the commit does not describe.
        dirty=$(git --no-optional-locks status --porcelain -- ':/terraform/cloudflare' \
          ':/terraform/modules' ':/README.md' ':/mise.toml' ':/mise.lock') || {
          echo "git status failed - cannot verify the plan matches the commit" >&2
          exit 1
        }
        [ -z "$dirty" ] || {
          echo "uncommitted changes under terraform/cloudflare, the config, or the tool pins - commit before the plan is evidence" >&2
          exit 1
        }
        cd terraform/cloudflare
        p=$(mktemp)
        trap 'rm -f "$p"' EXIT
        terraform plan -input=false -no-color >"$p" 2>&1 || exit 1
        grep -q 'will be created' "$p" && exit 1
        grep -qE 'will be destroyed|will be deleted' "$p" && exit 1
        grep -qE 'will no longer be managed|will be forgotten' "$p" && exit 1
        grep -q 'will be imported' "$p" && exit 0
        grep -qE 'No changes|Your infrastructure matches the configuration' "$p"
      fi
    # Green means the COMMITTED config has no pending imports -- never that the provider
    # holds nothing else worth adopting: Terraform cannot see an unmanaged object, so a
    # second adoption request plans `No changes.` exactly like a finished one. An explicit
    # import run re-runs discovery regardless of this check; only the resume scan for work
    # already written into the config may trust it.
    produces: committed generated*.tf; a plan showing imports, or none left to make
    docs: migration.md

  - id: prune-spent-imports
    operation: prune-blocks
    implementation: both
    phase: 5
    provider: repo
    actor: AGENT
    title: No spent one-shot import/moved blocks left committed
    why: >-
      import/moved blocks execute once and go inert; nothing else removes them, so they
      accumulate in the consuming repo and the manifest cannot see them.
    run: |
      Follow docs/prune.md, one leaf per PR. It owns the procedure **and** which evidence
      each backend allows — how many plans, where they run, and whether a local
      `terraform state list` is available at all. Do not restate those mechanics here or
      in a router; they have changed twice and every copy drifted.
      Success is `No changes.` — capture it for the PR body.
      If a block is still pending the apply has not landed: stop, and finish the import.
    # Pure git read: no terraform, no network, nothing written -- so status may run it
    # directly, unlike the migrate-import check above.
    #
    # It greps HEAD, not the working tree, because the claim is "still committed": a file
    # deleted on disk but not yet committed is a prune in progress, not a finished one.
    # The pathspec is root-anchored (`:/`) so the answer does not depend on the working
    # directory -- migrate-import above ends with a bare `cd terraform/cloudflare`, and a
    # runner that shares one shell across checks would otherwise silently scan one leaf.
    #
    # Deliberate ceiling: this asserts the blocks are GONE, not that the ones present are
    # spent, because spent-ness needs `terraform state list` (an init, i.e. a mutating
    # check status could not run). So a repo mid-import -- blocks written, apply not yet
    # landed -- also reads red here; the message names both readings, and the prune skill
    # itself refuses to remove a block whose address is missing from state. Tighten only
    # by teaching status to read state membership without touching the working tree.
    tri_state: true   # exit 2 = could not verify; see protocol.md
    check: |
      # Not a repository, or one whose metadata cannot be read: that is ignorance, not
      # evidence, so it is exit 2 rather than a red step routing anyone to prune.
      git --no-optional-locks rev-parse --git-dir >/dev/null 2>&1 || exit 2
      # A repository with no commits yet: nothing CAN be committed, so nothing is left.
      git --no-optional-locks rev-parse --verify --quiet HEAD >/dev/null || exit 0
      # Structure is parsed, not pattern-matched: each committed blob is read once, `jq`
      # decides JSON and a single string-aware awk pass decides HCL. Both surfaces,
      # because phase 6 already accepts `*.tf.json` as leaf configuration.
      #
      # ONE primitive does the work: knowing whether a position is inside a quoted string.
      # Seven review rounds were spent adding special cases instead -- an end-of-line
      # anchor, a comment strip, an expression-position allow-list of `= ( , : [`, a
      # bounded header-comment state, and a rule against tracking /* */ at all -- and each
      # one was correct in isolation while the next context kept arriving: `#` inside a
      # string, `//` inside a string, `/*` inside `target = "example.com/*"`, `<<EOF`
      # inside `"cat <<EOF"`, a heredoc after `?`. They are all the same question. `scan()`
      # answers it once, and every one of those special cases is gone: no allow-list (so a
      # conditional arm opens a heredoc like any other expression), and /* */ is tracked
      # generally again (safe now, because a `/*` inside a string is not a comment).
      #
      # Consequence worth stating: dead HCL inside /* */ is a comment, so it is NOT
      # reported. That is a deliberate reversal -- it used to report, as the price of not
      # tracking regions -- and it is the correct reading of the file.
      #
      # Facts measured against terraform, not assumed, because the docs mislead on two:
      #   - the delimiter grammar is `[A-Za-z_][A-Za-z0-9_-]*`: `<<END-JSON` is valid,
      #     `<<END.JSON` and `<<1EOT` are rejected (1.16.1), and `checks/leaf-cloud.sh`
      #     already accepts the same class;
      #   - an indented terminator ends BOTH `<<EOT` and `<<-EOT`, so the trim is
      #     unconditional: a plain `<<EOT` body holding an indented `EOT` plus more text
      #     fails to parse with the error ON the following text (1.15.9 and 1.16.1);
      #   - a heredoc tag is never quoted -- `<<"EOT"` is shell, not HCL;
      #   - the opener brace ENDS its line: `import { to = x` with `id` on the next line is
      #     rejected as an "Invalid single-argument block definition" (1.15.9 and 1.16.1).
      #     HCL does allow a one-line single-argument block (`workspaces { name = "x" }`,
      #     see tests/test_hcp_apply_scope.py), but `import` and `moved` each require two
      #     arguments, so neither can take that form. Anchoring the opener at end of line
      #     is therefore complete, not a simplification.
      #
      # ponytail: a scanner, not an HCL parser, and the line is now a rule rather than a
      # list. A finding of the form "marker X inside context Y" is answered by `scan()` or
      # declined -- never by another special case, which is what turned this into seven
      # rounds. Declining is cheap: nothing destructive hangs off this step. It routes
      # status, it does not gate a deletion; a false positive sends someone to a runbook
      # that finds nothing, a false negative leaves inert blocks unflagged. The gate that
      # matters is the plan pair in docs/prune.md, which Terraform itself evaluates.
      # Known residual: `"${f(a, "b")}"` nests quotes inside interpolation, which this
      # counts naively. Reach for a real parser only if this ever gates something written.
      #
      # terraform/modules/ is excluded: one-shot blocks there are not this step's to call
      # leftover. Each consuming state reads them separately, so `moved` is the module's
      # upgrade path -- Terraform calls removing one a breaking change and recommends
      # retaining historical module moves -- and `import`, while genuinely spent once
      # applied, is spent only per consumer, a set no scan here can close. docs/prune.md
      # refuses both, so counting them would hold phase 5 red over work with no runbook.
      # ponytail: module blocks are left to a human; lift this when consumers are
      # enumerable (a lockfile of consuming states) rather than grepped for.
      # https://developer.hashicorp.com/terraform/language/modules/develop/refactoring
      command -v jq >/dev/null 2>&1 || {
        echo "jq is required to read Terraform JSON leaves - cannot verify" >&2
        exit 2
      }
      # A directory prefix, not a glob: ls-tree matches paths by prefix and takes no
      # :(exclude) magic, so extensions and terraform/modules/ are filtered in the loop.
      # --full-name and the root-anchored `:/` keep the answer independent of the working
      # directory -- migrate-import above ends with a bare `cd terraform/cloudflare`.
      list=$(mktemp) || exit 2
      found=$(mktemp) || exit 2
      trap 'rm -f "$list" "$found"' EXIT
      git --no-optional-locks ls-tree -r --full-name --name-only HEAD -- ':/terraform' >"$list" || {
        echo "git ls-tree failed - cannot verify what is committed" >&2
        exit 2
      }
      # An `import`/`moved` block opener, ignoring heredoc bodies and comments. HCL has no
      # nested one-shot blocks, so any surviving opener is top-level by definition.
      hcl_scan='
        # One string-aware pass. `q` (in a string) resets per line -- HCL strings do not
        # span lines; `c` (in a block comment) and `h` (in a heredoc) do not.
        function scan(s,   i, n, ch, out) {
          out = ""; n = length(s); i = 1
          while (i <= n) {
            ch = substr(s, i, 1)
            if (c) { if (ch == "*" && substr(s, i+1, 1) == "/") { c = 0; i += 2; out = out " " }
                     else i++
                     continue }
            if (q) { if (ch == "\\") { i += 2; continue }
                     if (ch == "\"") { q = 0; out = out "\""; i++; continue }
                     i++; continue }
            if (ch == "\"") { q = 1; out = out "\""; i++; continue }
            if (ch == "#") break
            if (ch == "/" && substr(s, i+1, 1) == "/") break
            if (ch == "/" && substr(s, i+1, 1) == "*") { c = 1; i += 2; out = out " "; continue }
            out = out ch; i++ }
          return out }
        { sub(/\r$/, "") }
        h != "" { t=$0; sub(/^[ \t]+/,"",t); sub(/[ \t]+$/,"",t); if (t == h) h=""; next }
        { q = 0; code = code scan($0)
          if (c) next                     # comment still open: one logical line continues
          if (code ~ /^[ \t]*(import|moved)[ \t]*\{[ \t]*$/) { f=1; exit }
          if (match(code, /<<[-~]?[A-Za-z_][A-Za-z0-9_-]*[ \t]*$/)) {
            m = substr(code, RSTART, RLENGTH)
            sub(/^<<[-~]?/, "", m); sub(/[ \t]*$/, "", m); h = m }
          code = "" }
        END { exit !f }'
      # Both lists are files, not shell strings: a literal newline inside a string -- or a
      # heredoc terminator, which must sit at column 0 -- dedents out of this YAML block
      # scalar and truncates the check. Redirecting a file in also keeps the loop out of a
      # pipeline subshell, where `exit 2` would exit only the subshell.
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        case "$f" in *.tf|*.tf.json) ;; *) continue ;; esac
        # Exactly what docs/prune.md discovers: root-level files of a leaf. A nested
        # `terraform/<leaf>/modules/...` is a module directory the runbook does not offer
        # as a candidate, so scanning it would hold phase 5 red with nothing to prune.
        rest=${f#terraform/}
        case "$rest" in */*) ;; *) continue ;; esac   # terraform/main.tf has no leaf
        case "${rest%%/*}" in modules) continue ;; esac
        case "${rest#*/}" in */*) continue ;; esac
        blob=$(git --no-optional-locks show "HEAD:$f") || {
          echo "cannot read HEAD:$f - cannot verify what is committed" >&2
          exit 2
        }
        case "$f" in
          *.tf.json)
            # A .tf.json that does not parse is not evidence either way: terraform would
            # reject it too, so say so rather than calling the leaf clean.
            printf '%s' "$blob" | jq -e . >/dev/null 2>&1 || {
              echo "$f is not valid JSON - cannot verify what is committed" >&2
              exit 2
            }
            # `has()` is true for `"import": []`, which is a key with no block under it.
            printf '%s' "$blob" | jq -e '[.import, .moved] | map(select(. != null))
              | map(if type == "array" then length else 1 end) | (add // 0) > 0' \
              >/dev/null 2>&1 && printf '%s\n' "$f" >>"$found"
            ;;
          *)
            printf '%s' "$blob" | awk "$hcl_scan" && printf '%s\n' "$f" >>"$found"
            ;;
        esac
      done <"$list"
      [ -s "$found" ] || exit 0
      echo "one-shot import/moved blocks still committed in:" >&2
      cat "$found" >&2
      echo "If their apply has landed they are spent: infra-skills:infra-prune removes them." >&2
      echo "If it has not, they are still pending: finish infra-skills:infra-import first." >&2
      exit 1
    produces: a leaf whose plan is `No changes.` with no inert instruction blocks left
    docs: docs/prune.md

  # ── Phase 6 — additional providers (parameterized; optional) ────────────
  # Run the inventory once, then instantiate the remaining sequence once per
  # config.md `additional_providers` entry.
  - id: new-provider-inventory
    operation: provider-inventory
    implementation: both
    phase: 6
    provider: repo
    actor: HUMAN
    title: Every additional Terraform leaf has a provider-adoption record
    why: An untracked leaf may be an interrupted adoption and must not disappear from resume scans.
    check_summary: Every terraform leaf other than cloudflare and github has a matching additional_providers entry in README.md, with no duplicate or reserved names and, for HCP, one workspace per leaf.
    run: |
      For every terraform/<leaf> other than cloudflare and github, add a matching
      `additional_providers` entry to README.md. Record the decision
      and credential inventory there; never delete an entry to hide red state.
    check: |
      # Validate provider names (common to both modes)
      jq -ne --argjson names "$ADDITIONAL_PROVIDER_NAMES" '
        $names | type == "array"
          and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
          and length == (unique | length)
          and index("cloudflare") == null
          and index("github") == null
          and index("modules") == null' >/dev/null || exit 1
      # HCP mode: also validate workspaces
      if [ "$HAS_HCP" = "true" ]; then
        jq -ne --argjson leaves "$HCP_LEAVES" \
          --argjson workspaces "$ADDITIONAL_PROVIDER_WORKSPACES" '
            ($workspaces | type == "array"
              and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
              and length == (unique | length)
              and index("cloudflare") == null
              and index("github-org") == null)
            and ($leaves | map(select(. != "cloudflare" and . != "github")) | length)
              == ($workspaces | length)' >/dev/null || exit 1
      fi
      declared_tools=$(printf '%s' "${ADDITIONAL_PROVIDER_MISE_TOOLS:-[]}" | jq -ce '
        select(type == "array")
        | select(all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:/+-]*$")))
        | unique') || exit 1
      if test -f mise.toml; then
        tools=$(mise config get --file ./mise.toml tools 2>/dev/null) || exit 1
        pinned=$(printf '%s\n' "$tools" |
          sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p')
        provider_tools=$(sed -n \
          's/^[[:space:]]*#[[:space:]]*infra-skills:provider-cli[[:space:]]\{1,\}\([A-Za-z0-9][A-Za-z0-9_-]*\)[[:space:]]*$/\1/p' \
          mise.toml)
        general_tools=$(sed -n \
          's/^[[:space:]]*#[[:space:]]*infra-skills:general-tool[[:space:]]\{1,\}\([^[:space:]]\{1,\}\)[[:space:]]*$/\1/p' \
          mise.toml)
        test "$(printf '%s\n' "$provider_tools" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$provider_tools" | sed '/^$/d' | wc -l | tr -d ' ')" || exit 1
        test "$(printf '%s\n' "$general_tools" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$general_tools" | sed '/^$/d' | wc -l | tr -d ' ')" || exit 1
        classified_tools=$(printf '%s\n%s\n' "$provider_tools" "$general_tools" | sed '/^$/d')
        test "$(printf '%s\n' "$classified_tools" | sort -u | wc -l | tr -d ' ')" \
          = "$(printf '%s\n' "$classified_tools" | wc -l | tr -d ' ')" || exit 1
        printf '%s\n' "$classified_tools" | while IFS= read -r tool; do
          test -z "$tool" && continue
          printf '%s\n' "$pinned" | grep -Fx "$tool" >/dev/null || exit 1
        done || exit 1
        printf '%s\n' "$pinned" | while IFS= read -r tool; do
          test -z "$tool" && continue
          case "$tool" in terraform|gh|jq|github:cloudflare/cf-terraforming) continue ;; esac
          printf '%s\n' "$classified_tools" | grep -Fx "$tool" >/dev/null || exit 1
        done || exit 1
        actual_tools=$(printf '%s\n' "$provider_tools" |
          jq -Rsc 'split("\n") | map(select(length > 0)) | unique') || exit 1
        jq -ne --argjson declared "$declared_tools" --argjson actual "$actual_tools" \
          '($actual - $declared | length) == 0' >/dev/null || exit 1
      fi
      for leaf in terraform/*/; do
        test -d "$leaf" || continue
        name=${leaf%/}; name=${name##*/}
        case "$name" in cloudflare|github|modules) continue ;; esac
        printf '%s' "$ADDITIONAL_PROVIDER_NAMES" \
          | jq -e --arg name "$name" 'index($name) != null' >/dev/null || exit 1
      done
    produces: complete durable inventory for every additional Terraform leaf
    docs: config.md

  - id: new-provider-decision
    operation: provider-decision
    implementation: both
    phase: 6
    provider: repo
    actor: HUMAN
    title: Record the new-provider decision and its verification inventory
    why: A provider changes a locked design decision, and later runs need durable names for every check.
    check_summary: The provider name, mise tool list, toolchain blobs and credentials timestamp in the README Config block are well formed, and the README Decisions table has the locked provider and authentication rows the entry's credential mechanism requires.
    run: |
      1. Add a row to the README Decisions table whose decision is exactly
         `Provider: <provider>`, choice is `adopt`, and status is `locked`, and a second
         locked row whose decision is exactly `<provider> authentication` and whose
         choice names the credential mechanism (e.g. `Workload Identity Federation` or
         `service-account key`). Auth is a decision of its own so a long-lived key is
         never the unexamined default. With effective backend hcp, for a GCP entry (one whose
         inventory has TFC_GCP_*, GOOGLE_*, GCLOUD_*, or CLOUDSDK_* keys, whose mise tools
         include gcloud, or whose choice is a service-account key), the choice must be exactly `Workload Identity Federation`
         (inventory declares TFC_GCP_PROVIDER_AUTH) or `service-account key` (inventory
         declares GOOGLE_CREDENTIALS as a sensitive env variable and not
         TFC_GCP_PROVIDER_AUTH).
      2. Add terraform/<provider> to terraform/README.md.
      3. For effective backend hcp:
         Add an `additional_providers` entry to README.md with its
         lowercase name, HCP workspace, and every authentication variable's key,
         category, and sensitive flag. Inventory every workspace variable so undeclared
         credentials cannot survive a reused workspace. Record provider mise tools (or
         `[]`) and set `mise_config_blob: ""` and `mise_lock_blob: ""` until the HUMAN
         reviews the toolchain. Set
         `fork_speculative_plans_disabled: false` until that HUMAN check is performed.
         Set `fork_speculative_plans_workspace_id: ""` until the same check binds the
         attestation to the immutable HCP workspace identity.
         Set `credentials_verified_at: ""` until the credential handoff is complete.
         Never put a credential value in the repo.
         For effective backend object-storage:
         Add an `additional_providers` entry to README.md with its
         lowercase name, provider mise tools (or `[]`), and `credential_secrets` list
         with `name`, `required`, and `scope` (plan or apply) for every GitHub Actions secret.
         Plan names are read-only repository secrets; apply names are distinct and production-only.
         Set `mise_config_blob: ""` and `mise_lock_blob: ""`.
         Set `credentials_verified_at: ""` until the secret handoff is complete.
      4. Reply `done`:
         For effective backend hcp: the agent reloads config, exports NEW_PROVIDER and NEW_PROVIDER_BACKEND,
         NEW_PROVIDER_WORKSPACE, and NEW_PROVIDER_CREDENTIALS, then re-runs this check.
         For effective backend object-storage: the agent reloads config, exports NEW_PROVIDER and NEW_PROVIDER_BACKEND
         and NEW_PROVIDER_SECRETS, then re-runs this check.
    check: |
      printf '%s' "$NEW_PROVIDER" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || exit 1
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -e '
        type == "array"
        and all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$"))
        and length == (unique | length)' >/dev/null || exit 1
      if test -n "$NEW_PROVIDER_MISE_CONFIG_BLOB"; then
        printf '%s\n' "$NEW_PROVIDER_MISE_CONFIG_BLOB" \
          | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || exit 1
      fi
      if test -n "$NEW_PROVIDER_MISE_LOCK_BLOB"; then
        printf '%s\n' "$NEW_PROVIDER_MISE_LOCK_BLOB" \
          | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$' || exit 1
      fi
      if test -n "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT"; then
        printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
          | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
        printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
          . as $raw
          | (try fromdateiso8601 catch null) as $epoch
          | ($epoch != null)
            and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
            and ($epoch <= now)' >/dev/null || exit 1
      fi
      if [ "$NEW_PROVIDER_BACKEND" = "object-storage" ]; then
        printf '%s' "$NEW_PROVIDER_SECRETS" | jq -e '
          type == "array"
          and all(.[];
            (.name | type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$"))
            and (.required | type == "boolean")
            and (.scope == "plan" or .scope == "apply"))
          and length == (map(.name | ascii_upcase) | unique | length)' \
          >/dev/null || exit 1
      else
        printf '%s' "$NEW_PROVIDER_WORKSPACE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || exit 1
        case "$NEW_PROVIDER_FORK_PLANS_DISABLED" in true|false) : ;; *) exit 1 ;; esac
        if test -n "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID"; then
          printf '%s\n' "$NEW_PROVIDER_FORK_PLANS_WORKSPACE_ID" \
            | grep -Eq '^ws-[A-Za-z0-9]+$' || exit 1
        fi
        printf '%s' "$NEW_PROVIDER_CREDENTIALS" | jq -e '
          type == "array" and length > 0
          and all(.[];
            (.key | type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$"))
            and (.category == "env" or .category == "terraform")
            and (.sensitive | type == "boolean"))
          and length == (map(.category + "\u0000" + .key) | unique | length)' \
          >/dev/null || exit 1
      fi
      auth_choice=$(awk -F '|' -v provider="$NEW_PROVIDER" '
        function clean(value) {
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
          return tolower(value)
        }
        /^<!-- infra:decisions start -->[[:space:]]*$/ { if (in_table || ++starts > 1) bad=1; in_table=1; next }
        /^<!-- infra:decisions end -->[[:space:]]*$/ { if (!in_table || ++ends > 1) bad=1; in_table=0; next }
        !in_table { next }
        BEGIN { found=0; auth=0; expected="provider: " tolower(provider)
          auth_expected=tolower(provider) " authentication" }
        clean($2) == expected && clean($3) == "adopt" && clean($4) == "locked" { found=1 }
        clean($2) == auth_expected && clean($3) != "" && clean($4) == "locked" {
          auth++; choice=clean($3)
        }
        # Exactly one locked authentication row: two would be simultaneously
        # authoritative, and "last one wins" would make row order the decision.
        END { ok = (found && auth == 1 && !bad && !in_table && starts == 1 && ends == 1); if (ok) print choice; exit !ok }
      ' README.md) || exit 1
      # The recorded mechanism must be the one the inventory actually installs, in both
      # directions: a locked keyless decision over a key inventory would otherwise skip
      # the WIF trust check and go green on the key it rejected.
      # Scoped to GCP inventories — any key in a family the Google provider or SDK reads
      # (TFC_GCP_*, GOOGLE_*, GCLOUD_*, CLOUDSDK_*). Other providers use the same words
      # for their own federation (Azure's ARM_USE_OIDC, say) and must not be held to a
      # GCP variable; a GCLOUD_KEYFILE_JSON inventory under a WIF decision must. Case
      # is ignored: a terraform-category google_credentials is the same family.
      # An entry is also GCP when it pins gcloud or chooses a service-account key, so a
      # key stored under a custom name (GCP_KEY) cannot skip these rules.
      is_gcp=false
      printf '%s' "$NEW_PROVIDER_CREDENTIALS" \
        | jq -e 'any(.[]; .key | test("^(TFC_GCP_|GOOGLE_|GCLOUD_|CLOUDSDK_)"; "i"))' >/dev/null \
        && is_gcp=true
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -e 'index("gcloud") != null' >/dev/null \
        && is_gcp=true
      case "$auth_choice" in "service-account key"|"service account key") is_gcp=true ;; esac
      if [ "$NEW_PROVIDER_BACKEND" = "hcp" ] && [ "$is_gcp" = true ]; then
        # Exactly one of the two documented mechanisms, never free text reduced to a
        # keyword: "do not use workload identity federation" is not a WIF decision.
        case "$auth_choice" in
          "workload identity federation") choice_wif=true ;;
          "service-account key"|"service account key") choice_wif=false ;;
          *) exit 1 ;;
        esac
        inventory_wif=false
        printf '%s' "$NEW_PROVIDER_CREDENTIALS" \
          | jq -e 'any(.[]; .key == "TFC_GCP_PROVIDER_AUTH")' >/dev/null && inventory_wif=true
        test "$choice_wif" = "$inventory_wif" || exit 1
        # The key must stay a sensitive env variable: declared non-sensitive, the vars
        # API would hand its value to the plan-only agent.
        # ...and it must be the only credential: an extra GOOGLE_OAUTH_ACCESS_TOKEN or
        # GCLOUD_KEYFILE_JSON could authenticate instead (and, non-sensitive, be read by
        # the agent). Only identity-free location settings may sit beside it.
        if [ "$choice_wif" = false ]; then
          printf '%s' "$NEW_PROVIDER_CREDENTIALS" | jq -e 'any(.[];
            .key == "GOOGLE_CREDENTIALS" and .category == "env" and .sensitive == true)' \
            >/dev/null || exit 1
          printf '%s' "$NEW_PROVIDER_CREDENTIALS" | jq -e 'all(.[];
            (.key | test("^(TFC_GCP_|GOOGLE_|GCLOUD_|CLOUDSDK_)"; "i") | not)
            or .key == "GOOGLE_CREDENTIALS"
            or (.key | IN("GOOGLE_PROJECT", "GOOGLE_REGION", "GOOGLE_ZONE",
                          "GOOGLE_CLOUD_PROJECT", "CLOUDSDK_CORE_PROJECT")))' \
            >/dev/null || exit 1
        fi
      fi
      grep -Eq "(^|[^A-Za-z0-9_-])terraform/$NEW_PROVIDER(/|[^A-Za-z0-9_-]|$)" \
        terraform/README.md || exit 1
      git ls-files --error-unmatch README.md terraform/README.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- README.md terraform/README.md || exit 1
      git diff --cached --quiet HEAD -- README.md terraform/README.md
    produces: locked provider and authentication decisions plus a non-secret verification inventory
    docs: config.md

  - id: new-provider-leaf
    operation: provider-leaf
    implementation: both
    phase: 6
    provider: repo
    actor: AGENT
    tri_state: true
    title: Create the new Terraform leaf
    why: The backend and plan need committed provider configuration to target.
    run: |
      Create terraform/$NEW_PROVIDER with its versions, provider, and initial resource
      configuration. Do not create resources before new-provider-decision is green.
      - HCP mode: Its cloud block must select workspace $NEW_PROVIDER_WORKSPACE by name.
      - Object-storage mode: Its backend block must point to $STATE_BUCKET with a unique prefix.
      If the leaf's committed history contains an HCP backend, stop for the ordered
      HUMAN cutover in docs/object-storage-state.md#migrating-from-hcp and record its
      checked state_transfers evidence. Never treat a missing attestation as a fresh leaf.
      If the provider runbook requires a new CLI, add `# infra-skills:provider-cli <key>`
      immediately before its exact same-name mise pin and refresh the lock, but
      do not execute the CLI or any later runbook commands until new-provider-toolchain is green.
      Commit the completed leaf, including the provider selections written to
      `.terraform.lock.hcl` by `terraform init -backend=false`, before re-running this check.
      Whenever HAS_OBJECT_STORAGE=true, add this leaf to the Actions backend-neutral
      validate matrix even if its own backend is HCP; credentialed jobs remain scoped.
    check: |
      test -d "terraform/$NEW_PROVIDER" || exit 1
      if [ "${HAS_OBJECT_STORAGE:-false}" = true ]; then
        git ls-files --error-unmatch .github/workflows/terraform-plan.yml >/dev/null 2>&1 || exit 1
        git diff --quiet HEAD -- .github/workflows/terraform-plan.yml || exit 1
        git diff --cached --quiet HEAD -- .github/workflows/terraform-plan.yml || exit 1
        matrix=$(awk '
          /^  validate:/ {inside=1; next}
          inside && /^  [^[:space:]#]/ {exit}
          inside && /^        leaf: \[/ {print}
        ' .github/workflows/terraform-plan.yml) || exit 1
        matrix=$(printf '%s\n' "$matrix" | sed 's/#.*//; s/^[[:space:]]*leaf:[[:space:]]*//; s/[[:space:]]*$//')
        printf '%s\n' "$matrix" | grep -Eq '^\[[a-z0-9, -]+\]$' || exit 1
        printf '%s\n' "$matrix" | tr -d '[]' | tr ', ' '\n' | grep -Fxq "$NEW_PROVIDER" || exit 1
      fi
      if [ "$NEW_PROVIDER_BACKEND" = "hcp" ]; then
        # HCP mode: verify cloud block
        settings=$(sh "$INFRA_REFERENCES/checks/leaf-cloud.sh" \
          "terraform/$NEW_PROVIDER" all)
        printf '%s\n' "$settings" | grep -Fx "workspaces.name=$NEW_PROVIDER_WORKSPACE" >/dev/null \
          || exit 1
        printf '%s\n' "$settings" | grep -Fx "organization=$ORG" >/dev/null || exit 1
        hostname=$(printf '%s\n' "$settings" | sed -n 's/^hostname=//p' | head -1)
        case "$hostname" in ""|app.terraform.io) : ;; *) exit 1 ;; esac
      else
        # Object-storage mode: verify backend block with complete path validation
        sh "$INFRA_REFERENCES/checks/state-transfer.sh" "$NEW_PROVIDER" || exit $?
        grep -q "backend \"$STATE_BACKEND\"" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
        # Use -F for literal string matching (bucket names may contain regex chars like .)
        grep -Fq "$STATE_BUCKET" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
        # Validate complete prefix/key path matches backend-config convention
        # Escape regex special chars in STATE_PREFIX (e.g., + . *)
        escaped_prefix=$(printf '%s' "$STATE_PREFIX" | sed 's/[.+*?^$[\]\\|(){}]/\\&/g')
        case "$STATE_BACKEND" in
          gcs)
            # GCS uses prefix = "STATE_PREFIX/NEW_PROVIDER"
            grep -E "prefix[[:space:]]*=[[:space:]]*\"$escaped_prefix/$NEW_PROVIDER\"" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
            ;;
          s3|azurerm)
            # S3/Azure uses key = "STATE_PREFIX/NEW_PROVIDER/terraform.tfstate"
            grep -E "key[[:space:]]*=[[:space:]]*\"$escaped_prefix/$NEW_PROVIDER/terraform\\.tfstate\"" "terraform/$NEW_PROVIDER"/*.tf 2>/dev/null || exit 1
            ;;
        esac
      fi
      git ls-files "terraform/$NEW_PROVIDER/*.tf" \
        "terraform/$NEW_PROVIDER/*.tf.json" | grep -q . || exit 1
      git ls-files --error-unmatch \
        "terraform/$NEW_PROVIDER/.terraform.lock.hcl" >/dev/null 2>&1 || exit 1
      test -z "$(git --no-optional-locks status --porcelain -- "terraform/$NEW_PROVIDER")"
    produces: terraform/$NEW_PROVIDER leaf with appropriate backend configuration
    docs: protocol.md#resume-protocol

  - id: new-provider-toolchain
    phase: 6
    provider: repo
    actor: HUMAN
    title: Review and trust the provider's changed executable toolchain
    why: A newly pinned provider CLI changes executable configuration after the initial setup trust gate.
    check_summary: mise.toml, mise.lock and README.md are committed, the recorded mise_config_blob and mise_lock_blob match their current hashes, mise trusts the repository, and every pinned tool is installed from the lock.
    cli:
      - effect: Shows the mise.toml and mise.lock changes to review, including every download URL in the lock.
        run: |
          git diff HEAD -- mise.toml mise.lock
      - effect: Prints the two hashes to record as this provider's mise_config_blob and mise_lock_blob in README.md.
        run: |
          git hash-object -- mise.toml
          git hash-object -- mise.lock
      - effect: Trusts the reviewed config and installs every configured tool strictly from the lock.
        run: |
          mise trust mise.toml
          pinned=$(mise config get --file ./mise.toml tools |
            sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p')
          printf '%s\n' "$pinned" |
            while IFS= read -r tool; do
              [ -z "$tool" ] && continue
              MISE_LOCKED=1 mise install "$tool" || exit 1
            done
    run: |
      Once the human has reviewed the diff and recorded the two hashes in README.md, they
      commit all four reviewed files (mise.toml, mise.lock, README.md and the leaf) together. When
      every provider toolchain gate is green, run the complete preflight once per provider entry,
      exporting that entry's NEW_PROVIDER_MISE_TOOLS so its conditional provider CLI is verified.
    check: >-
      mise --version >/dev/null &&
      git ls-files --error-unmatch mise.toml mise.lock README.md >/dev/null 2>&1 &&
      git diff --quiet HEAD -- mise.toml mise.lock README.md &&
      git diff --cached --quiet HEAD -- mise.toml mise.lock README.md &&
      current_mise_blob=$(git hash-object -- mise.toml) &&
      current_mise_lock_blob=$(git hash-object -- mise.lock) &&
      [ "$NEW_PROVIDER_MISE_CONFIG_BLOB" = "$current_mise_blob" ] &&
      [ "$NEW_PROVIDER_MISE_LOCK_BLOB" = "$current_mise_lock_blob" ] &&
      repo_dir=$(pwd -P) &&
      shown_dir=$repo_dir &&
      case $HOME in ''|/) ;;
      */) case $repo_dir in "$HOME"*) shown_dir="~${repo_dir#"$HOME"}" ;; esac ;;
      *) case $repo_dir in "$HOME") shown_dir="~" ;;
      "$HOME"/*) shown_dir="~${repo_dir#"$HOME"}" ;; esac ;; esac &&
      mise trust --show 2>/dev/null |
      grep -Fx -e "$repo_dir: trusted" -e "$shown_dir: trusted" >/dev/null &&
      tools=$(mise config get --file ./mise.toml tools 2>/dev/null) &&
      [ -n "$tools" ] &&
      pinned=$(printf '%s\n' "$tools" |
      sed -n 's/^[[:space:]]*"\{0,1\}\([^"=[:space:]]*\)"\{0,1\}[[:space:]]*=.*/\1/p') &&
      [ -n "$pinned" ] &&
      ! printf '%s\n' "$tools" |
      sed -n 's/^[^=]*=[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' |
      grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$' &&
      printf '%s' "$NEW_PROVIDER_MISE_TOOLS" | jq -r '.[]' |
      while IFS= read -r tool; do
      [ -z "$tool" ] && continue;
      printf '%s\n' "$pinned" | grep -Fx "$tool" >/dev/null || exit 1;
      MISE_LOCKED=1 mise install --dry-run-code "$tool" >/dev/null 2>&1 || exit 1;
      pin=$(mise config get --file ./mise.toml "tools.$tool" 2>/dev/null | tr -d '[:space:]');
      active=$(MISE_LOCKED=1 mise which "$tool" --version 2>/dev/null | tr -d '[:space:]');
      resolved=$(MISE_LOCKED=1 mise which "$tool" 2>/dev/null) || exit 1;
      [ -n "$pin" ] && [ "$active" = "$pin" ] && [ -x "$resolved" ] || exit 1;
      MISE_LOCKED=1 mise exec "$tool" -- sh -c
      '[ "$(command -v "$1")" = "$2" ]' sh "$tool" "$resolved" || exit 1;
      done
    produces: human-reviewed, trusted, locked provider toolchain; complete preflight green
    docs: docs/setup.md#6-local-development

  - id: new-provider-lock
    phase: 6
    provider: repo
    actor: AGENT
    title: Verify committed selections for every required provider
    tri_state: true
    why: The trust gate must activate Terraform before lock validation, while HCP must not invent missing selections remotely.
    run: |
      After new-provider-toolchain and the complete preflight are green, inspect the
      committed dependency lock. The check enumerates configuration requirements in a
      disposable copy without backend initialization, state reads, or HCP access; it
      never writes .terraform/ or the lock in the checkout. Exit 2 means requirements
      could not be enumerated (including unavailable child modules); exit 1 means a
      required selection or checksum is missing. If a selection is missing, run
      `terraform init -backend=false` in terraform/$NEW_PROVIDER and commit the reviewed
      `.terraform.lock.hcl` before re-running this check.
    check: |
      required_providers=$(sh "$INFRA_REFERENCES/checks/provider-requirements.sh" \
        "terraform/$NEW_PROVIDER") || exit 2
      printf '%s\n' "$required_providers" | while IFS= read -r provider; do
        case "$provider" in ""|terraform.io/builtin/*) continue ;; esac
        awk -v target="$provider" '
          $1 == "provider" {
            address=$2; gsub(/^"|"$/, "", address)
            selected=(address == target); version=0; in_hashes=0; checksum=0
          }
          selected && $1 == "version" && $2 == "=" && $3 ~ /^"[^"]+"$/ { version=1 }
          selected && $1 == "hashes" && $2 == "=" && $3 == "[" { in_hashes=1 }
          selected && in_hashes && $1 ~ /^"(h1:|zh:)[^"]+",?$/ { checksum=1 }
          selected && /^}/ { complete=(version && checksum); selected=0 }
          END { exit !complete }
        ' "terraform/$NEW_PROVIDER/.terraform.lock.hcl" || exit 1
      done
    produces: committed lock selections and checksums for every required provider
    docs: protocol.md#resume-protocol

  - id: new-provider-workflow-gha
    operation: provision-provider-execution
    implementation: object-storage
    phase: 6
    provider: github
    actor: AGENT
    tri_state: true
    when: '[ "$NEW_PROVIDER_BACKEND" = "object-storage" ]'
    title: Update GitHub Actions workflows for the new provider
    why: The plan and apply workflows must include the new leaf.
    run: |
      Update .github/workflows/terraform-plan.yml and terraform-apply.yml to:
      1. In terraform-plan.yml only, add a path filter for terraform/$NEW_PROVIDER/** AND shared inputs:
         - terraform/modules/**
         - mise.toml
         - mise.lock
         - README.md
         - .github/workflows/terraform-*.yml
         - .github/scripts/terraform-destroy.cjs
      2. Add plan/apply jobs for the new leaf
      3. Pass only scope=plan secrets from NEW_PROVIDER_SECRETS to plan and scope=apply
         secrets to apply as environment variables. Use -lock=false on every plan;
         keep locking and refresh enabled on apply. Use separate keyless identities too.
      4. Add the provider-specific authentication step before terraform init (e.g., google-github-actions/auth for GCP, aws-actions/configure-aws-credentials for AWS, azure/login for Azure).
         With state_endpoint set the backend keys are STATE_ACCESS_KEY_ID / STATE_SECRET_ACCESS_KEY,
         passed to `terraform init -backend-config`, so an AWS provider's own credentials (including those
         exported by aws-actions/configure-aws-credentials) do not collide with them.
      5. Add $NEW_PROVIDER to the validate matrix in terraform-plan.yml
      6. Add plan-$NEW_PROVIDER to the aggregate `plan` job's `needs` list
      7. Wire up routed outputs and job conditions for $NEW_PROVIDER in both workflows.
         The plan route input is workflow_dispatch=true OR the PR path filter output.
         The apply route input is static 'true': converge every object-storage leaf on
         every run, with the main-tip guard immediately before apply. Never path-filter apply.
      8. Add a top-level static LEAF_<UPPERCASE_PROVIDER_SLUG_WITH_UNDERSCORES>_BACKEND
         literal in both workflows, equal to NEW_PROVIDER_BACKEND. Route the changes
         output only when this literal is object-storage AND its route input is true,
         just like the bootstrap outputs. Auth/init/plan/apply must consume
         only that routed output; validation still covers HCP leaves. Update the literal
         together with config when cutting over an existing provider.
         Include BOTH workflow paths in every leaf's plan filters.
         Keep the route script in the supported template shape: bootstrap leaves first,
         additional leaves in lexical order, all false initializers, then guarded true
         decisions, then output writes. Use shell-safe leaf_<slug_with_underscores>
         variables and LEAF_<SLUG>_CHANGED inputs for additional leaves, even digit-leading names.
         Use bracket expression access for digit-leading output keys, e.g.
         needs.changes.outputs['1password'] and steps.route.outputs['1password'].
      9. Copy the saved-plan destructive guard and its read-only PR permission to the new apply job;
         inspect that same tfplan and apply it, never compute another plan after the guard
      10. Copy destructive JSON extraction and prominent plan-comment reporting to the new plan job
      Commit the updated workflows before re-running this check.
    check: |
      # File existence and git tracking
      ROUTING_PROVIDER="$NEW_PROVIDER" sh "$INFRA_REFERENCES/checks/workflow-routing.sh" || exit $?
      sh "$INFRA_REFERENCES/checks/gha-workflows.sh" "$NEW_PROVIDER" || exit $?
      test -f .github/workflows/terraform-plan.yml || exit 1
      test -f .github/workflows/terraform-apply.yml || exit 1
      git ls-files --error-unmatch \
        .github/workflows/terraform-plan.yml \
        .github/workflows/terraform-apply.yml >/dev/null 2>&1 || exit 1
      # Workflows are committed (no uncommitted changes)
      git diff --quiet HEAD -- .github/workflows/terraform-plan.yml \
        .github/workflows/terraform-apply.yml || exit 1
      # YAML syntax validation skipped - workflow execution will catch malformed files
      # Basic job existence for the new provider
      grep -q "plan-$NEW_PROVIDER:" .github/workflows/terraform-plan.yml || exit 1
      grep -q "apply-$NEW_PROVIDER:" .github/workflows/terraform-apply.yml || exit 1
      # Path filter mentions the new provider (either form)
      grep -q "terraform/$NEW_PROVIDER" .github/workflows/terraform-plan.yml || exit 1
      grep -q "terraform/$NEW_PROVIDER" .github/workflows/terraform-apply.yml || exit 1
      # Environment protection verified by gha-environments (phase 1): a main-only
      # production environment with reviewers or a recorded apply gate. New provider jobs
      # should copy the environment: production setting from apply-cloudflare/apply-github.
    produces: GitHub Actions workflows updated for new provider
    docs: docs/object-storage-ci.md#github-actions

  - id: new-provider-workspace-bootstrap
    operation: provision-provider-execution
    implementation: hcp
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$NEW_PROVIDER_BACKEND" = "hcp" ]'
    title: Create the workspace and make it visible to the plan-only team
    why: A missing or invisible workspace is expected setup work, not an unverifiable terminal state.
    check_summary: The workspace exists with the asserted VCS, working-directory, Terraform-version, trigger and safety settings, and is visible to the plan-only credential; the check separates that from network, authentication and API failures.
    ui:
      - form: Create a user API token for this step (the value is shown once; delete the token afterwards)
        url: https://app.terraform.io/app/settings/tokens
        fields: |
          Start from | Create an API token
          Description | infra-provision
          Expiration | A short expiry, for example 1 day
          After creating | Copy it into the command's hidden prompt; never paste it into the conversation
    cli:
      - effect: Creates and configures the workspace with the helpers from hcp.md Phase 1 (paste the function definitions from the sh block that defines load_tf_version through set_workspace_config into your shell first, with REPO, ORG and HCP_LEAVES exported per Step 0). It resolves the repository's VCS connection, so a GitHub App connection needs this user token. The token comes from a hidden prompt, so run it in your own terminal.
        run: |
          printf 'HCP user API token: '; read -rs HCP_TOKEN; echo; export HCP_TOKEN
          load_tf_version
          resolve_vcs_connection
          create_ws "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"
          set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"
          unset HCP_TOKEN
      - effect: Grants the team infra-plan-only the `Plan` permission, never `Write`, on $NEW_PROVIDER_WORKSPACE; a grant at any other level is set to Plan. The token comes from a hidden prompt, so run it in your own terminal.
        run: |
          (
            set -eu; set -o pipefail
            printf 'HCP user or organization API token: '; read -rs api_token; echo
            [ -n "$api_token" ] || { echo 'No token entered.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$api_token"; }
            team=$(curl -sf --config <(auth) "$hcp_api/organizations/$ORG/teams?filter%5Bnames%5D=infra-plan-only" \
              | jq -er '[.data[] | select(.attributes.name == "infra-plan-only")][0].id')
            ws=$(curl -sf --config <(auth) "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
              | jq -er '.data.id')
            tw=$(curl -sf --config <(auth) "$hcp_api/team-workspaces?filter%5Bworkspace%5D%5Bid%5D=$ws" \
              | team_id=$team jq -r '[.data[] | select(.relationships.team.data.id == env.team_id)][0].id // empty')
            if [ -n "$tw" ]; then
              resp=$(printf '%s' '{"data":{"type":"team-workspaces","attributes":{"access":"plan"}}}' \
                | curl -s -w '\n%{http_code}' -X PATCH --config <(auth) \
                    -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/team-workspaces/$tw")
            else
              resp=$(team_id=$team ws_id=$ws jq -n '{data:{type:"team-workspaces",attributes:{access:"plan"},relationships:{workspace:{data:{type:"workspaces",id:env.ws_id}},team:{data:{type:"teams",id:env.team_id}}}}}' \
                | curl -s -w '\n%{http_code}' -X POST --config <(auth) \
                    -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/team-workspaces")
            fi
            code=${resp##*$'\n'}
            case "$code" in 200|201) ;; *) echo "HTTP $code: $resp" >&2; exit 1 ;; esac
          )
    tri_state: true
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      code=$(curl -sS -o /dev/null -w '%{http_code}' \
        "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      case "$code" in
        200) exit 0 ;;
        404) exit 1 ;;
        *) exit 2 ;;
      esac
    produces: workspace exists and is visible to the restored plan-only credential
    docs: docs/policy.md#a-credential-that-cannot-apply

  - id: new-provider-workspace
    operation: provision-provider-execution
    implementation: hcp
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$NEW_PROVIDER_BACKEND" = "hcp" ]'
    title: Create and safely configure the new HCP workspace
    why: The leaf needs a remote, VCS-backed workspace with path-scoped plans and auto-apply disabled.
    check_summary: The workspace is VCS-backed to this repository at terraform/$NEW_PROVIDER, with path-scoped triggers, speculative plans on and auto-apply off, as seen by the plan-only credential.
    ui:
      - form: Create a user API token for this step (the value is shown once; delete the token afterwards)
        url: https://app.terraform.io/app/settings/tokens
        fields: |
          Start from | Create an API token
          Description | infra-provision
          Expiration | A short expiry, for example 1 day
          After creating | Copy it into the command's hidden prompt; never paste it into the conversation
    cli:
      - effect: Reconciles every asserted workspace setting with hcp.md's set_workspace_config, keeping the existing VCS connection (paste the helper definitions from hcp.md Phase 1 into your shell first, with REPO, ORG and HCP_LEAVES exported per Step 0). The token comes from a hidden prompt, so run it in your own terminal.
        run: |
          printf 'HCP user API token: '; read -rs HCP_TOKEN; echo; export HCP_TOKEN
          load_tf_version
          set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"
          unset HCP_TOKEN
      - effect: Only when the helper refuses because the workspace targets a different working directory. Inspect the workspace ID it names first, and enter it only when it is truly this provider's workspace; otherwise choose a different workspace name.
        run: |
          printf 'HCP user API token: '; read -rs HCP_TOKEN; echo; export HCP_TOKEN
          printf 'Workspace ID named by the helper (ws-...): '; read -r CONFIRM_WORKSPACE_ID; export CONFIRM_WORKSPACE_ID
          load_tf_version
          set_workspace_config "$NEW_PROVIDER_WORKSPACE" "terraform/$NEW_PROVIDER"
          unset HCP_TOKEN
    check: |
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      body=$(curl -sf "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      printf '%s' "$body" \
        | jq -e --arg dir "terraform/$NEW_PROVIDER" --arg repo "$REPO" --arg tf_version "$TERRAFORM_VERSION" '
            .data.attributes as $a
            | ($a["working-directory"] == $dir)
              and ($a["execution-mode"] == "remote")
              and ($a["terraform-version"] == $tf_version)
              and ($a["auto-apply"] == false)
              and ($a["auto-destroy-at"] == null)
              and ($a["auto-destroy-activity-duration"] == null)
              and ($a["speculative-enabled"] == true)
              and ($a["file-triggers-enabled"] == true)
              and ($a["queue-all-runs"] == false)
              and ($a["global-remote-state"] == false)
              and ((($a["trigger-patterns"] // []) | sort)
                   == ([$dir + "/**", "terraform/modules/**", "README.md", "mise.toml"] | sort))
              and (($a["vcs-repo"].identifier // "") == $repo)
              and (($a["vcs-repo"].branch // "") == "main")' >/dev/null
      rc=$?
      case "$rc" in
        0) exit 0 ;;
        1) exit 1 ;;
        *) exit 2 ;;
      esac
    tri_state: true
    produces: configured HCP workspace visible to the plan-only credential
    docs: hcp.md#phase-1--workspaces

