  - id: new-provider-credentials
    operation: store-provider-credential
    implementation: hcp
    phase: 6
    provider: hcp
    actor: HUMAN
    when: '[ "$NEW_PROVIDER_BACKEND" = "hcp" ]'
    title: Put the provider credential configuration in HCP
    why: The first plan must authenticate without exposing credential values to the agent or repository.
    check_summary: The workspace has exactly the declared variables by key, category and sensitive flag, no variable sets, and a committed credentials_backend of hcp with a fresh credentials_verified_at in the README Config block.
    ui:
      - form: Create a user API token for this step (the value is shown once; delete the token afterwards)
        url: https://app.terraform.io/app/settings/tokens
        fields: |
          Start from | Create an API token
          Description | infra-provision
          Expiration | A short expiry, for example 1 day
          After creating | Copy it into the command's hidden prompt; never paste it into the conversation
      - form: Clear what the workspace inherits or holds beyond the inventory
        url: https://app.terraform.io/app/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE/variables
        fields: |
          Variable sets | Remove every applied variable set; their inherited variables cannot be proven by the workspace-local inventory
          Workspace variables | Delete every key that is not in the declared credential inventory
    cli:
      - effect: Creates one workspace variable for each entry of the declared credential inventory (the agent prints the command with the inventory JSON already filled in where it shows $NEW_PROVIDER_CREDENTIALS, so run it as printed), asking for its value at the prompt, or for the path of a file holding it when the entry is sensitive, so a multi-line value such as a service-account JSON arrives whole. A key that already exists is skipped before its prompt, so edit or delete it in the page above. The token comes from a hidden prompt, so run it in your own terminal and never send a value to the agent.
        run: |
          (
            set -eu; set -o pipefail
            printf 'HCP user or organization API token: '; read -rs api_token; echo
            [ -n "$api_token" ] || { echo 'No token entered.' >&2; exit 1; }
            [ "$hcp_api" = "https://app.terraform.io/api/v2" ] || { echo "Refusing to send an HCP credential to $hcp_api." >&2; exit 1; }
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$api_token"; }
            ws=$(curl -sf --config <(auth) "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
              | jq -er '.data.id')
            existing=$(curl -sf --config <(auth) "$hcp_api/workspaces/$ws/vars" | jq -r '.data[].attributes.key')
            printf '%s' '$NEW_PROVIDER_CREDENTIALS' | jq -c '.[]' | while read -r entry; do
              key=$(printf '%s' "$entry" | jq -r .key)
              if printf '%s\n' "$existing" | grep -Fxq "$key"; then echo "$key already exists; left unchanged"; continue; fi
              category=$(printf '%s' "$entry" | jq -r .category)
              sensitive=$(printf '%s' "$entry" | jq -r .sensitive)
              if [ "$sensitive" = true ]; then
                printf 'File holding the value for %s: ' "$key"; read -r value_file </dev/tty
                [ -r "$value_file" ] || { echo "$key: no readable file at $value_file" >&2; exit 1; }
              else
                printf 'Value for %s: ' "$key"; read -r value </dev/tty
              fi
              code=$({ if [ "$sensitive" = true ]; then cat -- "$value_file"; else printf %s "$value"; fi; } \
                | var_key=$key var_category=$category var_sensitive=$sensitive jq -Rs '{data:{type:"vars",attributes:{key:env.var_key,value:.,category:env.var_category,sensitive:(env.var_sensitive == "true")}}}' \
                | curl -s -o /dev/null -w '%{http_code}' -X POST --config <(auth) \
                    -H "Content-Type: application/vnd.api+json" -d @- "$hcp_api/workspaces/$ws/vars")
              [ "$code" = 200 ] || [ "$code" = 201 ] || { echo "$key: HTTP $code" >&2; exit 1; }
              echo "set $key"
            done
          )
    run: |
      Mint or configure the provider's least-privilege credential as its runbook requires
      first. After every declared variable is installed, the human records
      `credentials_backend: hcp` and the current UTC time as `credentials_verified_at` in
      the README Config block (format in config.md) using strict `YYYY-MM-DDTHH:MM:SSZ`, commits the README, and replies `done`.
    check: |
      [ "${NEW_PROVIDER_CREDENTIALS_BACKEND-hcp}" = hcp ] || exit 1
      test "$hcp_api" = "https://app.terraform.io/api/v2" || exit 2
      workspace_body=$(curl -sf \
        "$hcp_api/organizations/$ORG/workspaces/$NEW_PROVIDER_WORKSPACE" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      WS_ID=$(printf '%s' "$workspace_body" \
        | jq -er '.data.id | select(type == "string" and length > 0)' 2>/dev/null) \
        || exit 2
      varset_body=$(curl -sf \
        "$hcp_api/workspaces/$WS_ID/varsets?page%5Bsize%5D=1&page%5Bnumber%5D=1" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      varset_count=$(printf '%s' "$varset_body" \
        | jq -er '.data | select(type == "array") | length' 2>/dev/null) || exit 2
      test "$varset_count" -eq 0 || exit 1
      # The workspace vars endpoint is not paginated: HCP's OpenAPI spec gives it no
      # page parameters and no meta in its response, so one response is the whole
      # list. Requiring meta.pagination left this step CANNOT VERIFY for every
      # workspace. Should HCP start paginating it, a next page would mean the list
      # below is partial, so that fails closed rather than judging half an inventory.
      body=$(curl -sf "$hcp_api/workspaces/$WS_ID/vars" \
        -H "Authorization: Bearer $HCP_TOKEN") || exit 2
      printf '%s' "$body" | jq -e '
        (.data | type == "array")
        and (.meta.pagination["next-page"] == null)' >/dev/null 2>&1 \
        || exit 2
      printf '%s' "$body" | jq -e --argjson expected "$NEW_PROVIDER_CREDENTIALS" '
        [.data[] | .attributes
          | {key: .key, category: .category, sensitive: .sensitive}]
          | sort_by(.category, .key) as $actual
        | ($expected
            | map({key: .key, category: .category, sensitive: .sensitive})
            | sort_by(.category, .key)) as $wanted
        | ($expected | type == "array" and length > 0)
          and ($actual == $wanted)' >/dev/null || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
        | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
        . as $raw
        | (try fromdateiso8601 catch null) as $epoch
        | ($epoch != null)
          and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
          and ($epoch <= now)' >/dev/null || exit 1
      git ls-files --error-unmatch README.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- README.md || exit 1
      git diff --cached --quiet HEAD -- README.md
    tri_state: true
    produces: exact declared workspace-variable metadata in HCP
    docs: docs/secrets.md

  - id: new-provider-gcp-wif-trust
    operation: provider-identity-trust
    implementation: hcp
    phase: 6
    provider: gcp
    actor: HUMAN
    # Runs for every GCP entry — WIF or key — keyed on the inventory, tools, and
    # decision rather than the provider's name. Skipped only when the inventory is
    # provably a list with no Google-family key, the entry does not pin gcloud, and no
    # locked WIF row exists; an unreadable inventory runs the check.
    when: >-
      [ "$NEW_PROVIDER_BACKEND" = "hcp" ] &&
      { ! printf '%s' "$NEW_PROVIDER_CREDENTIALS" |
        jq -e 'type == "array" and all(.[]; .key | test("^(TFC_GCP_|GOOGLE_|GCLOUD_|CLOUDSDK_)"; "i") | not)' >/dev/null 2>&1 ||
        printf '%s' "${NEW_PROVIDER_MISE_TOOLS:-[]}" | jq -e 'index("gcloud") != null' >/dev/null 2>&1 ||
        awk -F '|' -v provider="$NEW_PROVIDER" '
          function clean(v) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); return tolower(v) }
          /^<!-- infra:decisions start -->[[:space:]]*$/ { if (in_table || ++starts > 1) bad=1; in_table=1; next }
          /^<!-- infra:decisions end -->[[:space:]]*$/ { if (!in_table || ++ends > 1) bad=1; in_table=0; next }
          !in_table { next }
          clean($2) == tolower(provider) " authentication" &&
          clean($3) == "workload identity federation" && clean($4) == "locked" { found=1 }
          END { exit !(found && !bad && !in_table && starts == 1 && ends == 1) }' README.md 2>/dev/null; }
    title: Verify the GCP run identity (WIF trust scope, or key-only configuration)
    why: >-
      Every HCP customer shares the issuer, so an unconditioned or name-only trust lets
      another organization impersonate the service account while every plan stays green.
    check_summary: The pool has one active provider with issuer https://app.terraform.io and a condition binding the HCP organization and this workspace, only that pool's identities can use the run service accounts, and no variable set or outside federated principal reaches them.
    cli:
      - effect: Logs in to gcloud with an account that can read the pool and service-account IAM policies, which the check needs when it reports it could not verify.
        run: |
          mise exec -- gcloud auth login
      - effect: For a WIF entry, creates a pool and service account named hcp- plus a slug of this provider's name and a checksum of its HCP organization, workspace and name (valid, bounded Google IDs) and refuses an existing provider bound to another workspace, so another provider's trust is never reused, an HCP provider whose condition binds organization $ORG and workspace $NEW_PROVIDER_WORKSPACE, the service account, and the impersonation binding for that pool only. Point the workspace's TFC_GCP_* variables at the pool, provider and service account it creates. It sets the gcloud default project, skips creates that already exist, and should be run on your own gcloud login, keeping one active provider per pool.
        run: |
          (
          set -eu
          printf 'GCP project ID: '; read -r PROJECT_ID
          PROJECT_NUMBER=$(mise exec -- gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          slug=$(printf %s "$NEW_PROVIDER" | tr -cd 'a-z0-9-' | cut -c1-12 | sed 's/-*$//')
          tag=$(printf '%s/%s/%s' "$ORG" "$NEW_PROVIDER_WORKSPACE" "$NEW_PROVIDER" | cksum | cut -d' ' -f1)
          POOL="hcp-$slug-$tag"
          PROVIDER=hcp-terraform
          SA=$POOL
          mise exec -- gcloud config set project "$PROJECT_ID"
          mise exec -- gcloud services enable \
            cloudresourcemanager.googleapis.com iam.googleapis.com \
            iamcredentials.googleapis.com sts.googleapis.com serviceusage.googleapis.com
          mise exec -- gcloud iam workload-identity-pools describe "$POOL" --location=global >/dev/null 2>&1 \
            || mise exec -- gcloud iam workload-identity-pools create "$POOL" \
              --location=global --display-name="HCP Terraform"
          if mise exec -- gcloud iam workload-identity-pools providers describe "$PROVIDER" \
            --location=global --workload-identity-pool="$POOL" >/dev/null 2>&1; then
            mise exec -- gcloud iam workload-identity-pools providers describe "$PROVIDER" \
              --location=global --workload-identity-pool="$POOL" --format='value(attributeCondition)' \
              | grep -Fq "assertion.terraform_organization_name == '$ORG' && assertion.terraform_workspace_name == '$NEW_PROVIDER_WORKSPACE'" \
              || { echo "Pool $POOL already holds a provider bound to another workspace, and the trust check allows one active provider per pool. Delete that provider only after confirming it is unused, or rename this provider entry so a different pool is derived." >&2; exit 1; }
            verb=update-oidc
          else
            verb=create-oidc
          fi
          mise exec -- gcloud iam workload-identity-pools providers "$verb" "$PROVIDER" \
            --location=global --workload-identity-pool="$POOL" \
            --issuer-uri="https://app.terraform.io" \
            --no-disabled \
            --attribute-mapping="google.subject=assertion.sub,attribute.aud=assertion.aud,attribute.terraform_run_phase=assertion.terraform_run_phase,attribute.terraform_organization_name=assertion.terraform_organization_name,attribute.terraform_workspace_name=assertion.terraform_workspace_name,attribute.terraform_workspace_id=assertion.terraform_workspace_id" \
            --attribute-condition="assertion.terraform_organization_name == '$ORG' && assertion.terraform_workspace_name == '$NEW_PROVIDER_WORKSPACE'"
          mise exec -- gcloud iam service-accounts describe "$SA@$PROJECT_ID.iam.gserviceaccount.com" >/dev/null 2>&1 \
            || mise exec -- gcloud iam service-accounts create "$SA" --display-name="HCP Terraform ($NEW_PROVIDER_WORKSPACE workspace)"
          mise exec -- gcloud iam service-accounts add-iam-policy-binding \
            "$SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --role=roles/iam.workloadIdentityUser \
            --member="principalSet://iam.googleapis.com/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL/*"
          )
    run: |
      For a key-based entry the human removes every Google credential variable other than the
      sensitive GOOGLE_CREDENTIALS, and any credentials, access_token or
      impersonate_service_account argument from the google provider blocks. For WIF, fix what
      the check reported following gcp.md's "create the WIF trust" section: the issuer must be
      exactly https://app.terraform.io, the attribute condition must be `&&`-joined terms binding
      both the organization and this workspace (name or ws- ID), every member holding
      roles/iam.workloadIdentityUser on the run service accounts must be a principal of that
      pool, and no federated principal outside it may hold any role on those accounts or an
      impersonation role on their projects. Detach any variable sets, and keep the TFC_GCP_*
      coordinates non-sensitive so they can be read. Grant the service account its project
      roles one `gcloud projects add-iam-policy-binding` at a time.
    tri_state: true
    check: sh "$INFRA_REFERENCES/checks/gcp-wif-trust.sh"
    produces: runs that use only the declared identity (a WIF trust only this workspace can use, or the sensitive key)
    docs: gcp.md#human--create-the-wif-trust

  - id: new-provider-identity-trust-gha
    operation: provider-identity-trust
    implementation: object-storage
    phase: 6
    provider: repo
    actor: HUMAN
    when: '[ "$NEW_PROVIDER_BACKEND" = "object-storage" ]'
    title: Review the runner identity trust before storing provider credentials
    why: A workspace subject check does not verify the runner's cloud IAM binding.
    check_summary: Nothing is checked; the review is ephemeral, so repeat it on every resume rather than assume the IAM is unchanged.
    cli:
      - effect: Prints the branch policies of the production environment, which must allow exactly main.
        run: |
          gh api "repos/$REPO/environments/production/deployment-branch-policies" --jq '.branch_policies[].name'
      - effect: For gcs, prints the conditions of the plan and apply providers, to confirm each pins this repository's immutable IDs and workflow, and that no wildcard repository or fork subject is admitted.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          for provider in plan apply; do
            gcloud iam workload-identity-pools providers describe "$provider" \
              --project="$PROJECT_ID" --location=global --workload-identity-pool="gha-$REPO_ID" \
              --format='value(attributeCondition)'
          done
      - effect: For gcs, prints who can impersonate each service account, to confirm plan and apply are separate service accounts and that nothing lets plan impersonate apply.
        run: |
          printf 'GCP project ID: '; read -r PROJECT_ID
          REPO_ID=$(gh api "repos/$REPO" -q '.id')
          gcloud iam service-accounts get-iam-policy "tf-plan-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" --format=json
          gcloud iam service-accounts get-iam-policy "tf-apply-$REPO_ID@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" --format=json
          gcloud iam service-accounts get-iam-policy "tf-plan@$PROJECT_ID.iam.gserviceaccount.com" --project="$PROJECT_ID" --format=json 2>/dev/null || echo "no legacy tf-plan account"
    run: |
      Follow object-storage.md's provisioning trust checklist for the other clouds: review the
      exact OIDC subject for this repository and branch or protected environment, the runner role
      or service account, state key isolation and least-privilege provider permissions. Require
      separate read-only plan and write apply identities; plan must not write state, locks or
      resources, read secret values, or impersonate apply, and cloud refresh needs narrow
      service-specific viewer permissions. For a genuinely fresh leaf, initialize empty backend
      state with the human procedure in docs/object-storage-state.md#fresh-leaf-bootstrap before
      requiring its first plan. Never accept a wildcard repository or fork subject.
    check: ~
    produces: human-reviewed runner identity trust, without exposing credentials
    docs: object-storage.md#provision-execution

  - id: new-provider-plan
    operation: plan-provider
    implementation: hcp
    phase: 6
    provider: repo
    actor: AGENT
    when: '[ "$NEW_PROVIDER_BACKEND" = "hcp" ]'
    title: Run the first plan on the new leaf
    why: This proves the leaf, workspace access, and provider credentials end to end.
    run: |
      If the newest matching HCP run is `policy_soft_failed`, stop and emit a HUMAN
      handoff to review the policy result and either fix the configuration or explicitly
      override/discard it; do not queue another run while that decision is pending.
      Ensure the current non-main branch has an open pull request (a draft is enough;
      create one with `gh pr create --draft` when absent), then push the current
      committed branch to its configured upstream so HCP can ingest the branch tip;
      never push a dirty or detached checkout. Wait until the workspace's VCS run list
      contains an ingested commit whose `terraform/$NEW_PROVIDER`, shared
      `terraform/modules`, `README.md`, and `mise.toml` trees equal the
      current committed versions, then run
      `sh "$INFRA_REFERENCES/checks/hcp-current-plan.sh" queue` to queue a
      plan-only retry using that configuration version. The helper explicitly includes
      the configuration-version relationship in POST /runs; a CLI-driven or
      latest-configuration fallback run has no trustworthy commit correlation. Wait for
      the run to finish, then re-run this check.
    tri_state: true
    check: sh "$INFRA_REFERENCES/checks/hcp-current-plan.sh"
    produces: safe green plan, or a safe no-create plan after the adoption has applied resources
    docs: docs/hcp-api.md

  # ── Phase 6 — additional providers (object-storage mode) ────────────────
  - id: new-provider-secrets-gha
    operation: store-provider-credential
    implementation: object-storage
    phase: 6
    provider: github
    actor: HUMAN
    when: '[ "$NEW_PROVIDER_BACKEND" = "object-storage" ]'
    title: Verify the provider authentication handoff for GitHub Actions
    tri_state: true
    why: The workflow must authenticate to the provider without exposing credentials.
    check_summary: Each required plan secret exists at repository scope and each required apply secret only in the production environment, with a committed credentials_backend and a fresh credentials_verified_at in the README Config block.
    cli:
      - effect: Stores one read-only plan secret at repository scope. Run it once for each credential_secrets entry whose scope is plan, entering that entry's name at the first prompt and the value at the hidden one, in your own terminal.
        run: |
          printf 'Plan secret name: '; read -r name
          gh secret set "$name" --repo "$REPO"
      - effect: Stores one write apply secret in the production environment only. Run it once for each credential_secrets entry whose scope is apply, after the main-only production gate holds, entering that entry's name at the first prompt and the value at the hidden one, in your own terminal.
        run: |
          printf 'Apply secret name: '; read -r name
          gh secret set "$name" --repo "$REPO" --env production
      - effect: Deletes a repository-level copy of one apply secret. Run it once for each apply entry; it prints an error and changes nothing if there is no copy.
        run: |
          printf 'Apply secret name: '; read -r name
          gh secret delete "$name" --repo "$REPO"
    run: |
      Print the plan and apply names from NEW_PROVIDER_SECRETS above the commands, so the human
      enters each name from your list rather than looking it up. Use distinct names for plan
      and apply and never store a write key in an organization secret accessible to this repo.
      Verify effective permissions; secret-name checks cannot prove them. For an empty
      inventory there are no secrets to store: verify separate read-only plan and write apply
      keyless identities and trust instead (public identity identifiers do not belong in the
      secret inventory). After the handoff is complete, record `credentials_backend:
      object-storage` and a fresh current UTC time as `credentials_verified_at` in the README
      Config block (format in config.md) using strict `YYYY-MM-DDTHH:MM:SSZ`, commit the README, and reply `done`.
    check: |
      [ "${NEW_PROVIDER_CREDENTIALS_BACKEND:-}" != hcp ] || exit 1
      printf '%s' "$NEW_PROVIDER_SECRETS" | jq -e '
        type == "array" and all(.[];
          (.name | type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$"))
          and (.required | type == "boolean") and (.scope == "plan" or .scope == "apply"))
        and length == (map(.name | ascii_upcase) | unique | length)' >/dev/null || exit 1
      if [ "$(printf '%s' "$NEW_PROVIDER_SECRETS" | jq 'length')" -gt 0 ]; then
        repo_secrets=$(gh secret list --repo "$REPO" --json name -q '.[].name' 2>/dev/null) || exit 2
        env_secrets=$(gh secret list --repo "$REPO" --env production --json name -q '.[].name' 2>/dev/null) || exit 2
        owner_type=$(gh api "repos/$REPO" --jq '.owner.type' 2>/dev/null) || exit 2
        case "$owner_type" in
          Organization) org_secrets=$(gh api --paginate "repos/$REPO/actions/organization-secrets" --jq '.secrets[].name' 2>/dev/null) || exit 2 ;;
          User) org_secrets='' ;;
          *) exit 2 ;;
        esac
        printf '%s' "$NEW_PROVIDER_SECRETS" | jq -r '.[] | [.name | ascii_upcase] + [.scope, (.required | tostring)] | @tsv' |
          while read -r name scope required; do
            if [ "$scope" = apply ]; then
              if printf '%s\n' "$repo_secrets" | grep -Fxq "$name"; then exit 1; fi
              if printf '%s\n' "$org_secrets" | grep -Fxq "$name"; then exit 1; fi
              secrets=$env_secrets
            else
              secrets=$repo_secrets
            fi
            if [ "$required" = true ]; then
              printf '%s\n' "$secrets" | grep -Fxq "$name" || exit 1
            fi
          done || exit 1
      fi
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" \
        | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1
      printf '%s\n' "$NEW_PROVIDER_CREDENTIALS_VERIFIED_AT" | jq -Re '
        . as $raw
        | (try fromdateiso8601 catch null) as $epoch
        | ($epoch != null)
          and (($epoch | strftime("%Y-%m-%dT%H:%M:%SZ")) == $raw)
          and ($epoch <= now)' >/dev/null || exit 1
      git ls-files --error-unmatch README.md >/dev/null 2>&1 || exit 1
      git diff --quiet HEAD -- README.md || exit 1
      git diff --cached --quiet HEAD -- README.md
    produces: GitHub Actions secrets for provider authentication
    docs: docs/object-storage-ci.md#github-actions

  - id: new-provider-plan-gha
    operation: plan-provider
    implementation: object-storage
    phase: 6
    provider: repo
    actor: AGENT
    tri_state: true
    when: '[ "$NEW_PROVIDER_BACKEND" = "object-storage" ]'
    title: Verify plan on the new leaf in GitHub Actions
    why: Proves the leaf, backend, and provider credentials end to end in CI.
    run: |
      Inspect the GitHub Actions plan workflow for terraform/$NEW_PROVIDER.
      Trigger via `gh workflow run terraform-plan.yml --repo "$REPO" --ref "$(git branch --show-current)"` or open a PR,
      and verify the plan job for $NEW_PROVIDER succeeds.
    check: |
      ROUTING_PROVIDER="$NEW_PROVIDER" sh "$INFRA_REFERENCES/checks/workflow-routing.sh" || exit $?
      # Reject any dirty state in relevant paths (tracked changes, staged, or untracked files)
      # Fail closed: if git status fails, treat as dirty rather than clean
      dirty_status=$(git status --porcelain -- "terraform/$NEW_PROVIDER" terraform/modules README.md mise.toml mise.lock .github/workflows/terraform-plan.yml .github/workflows/terraform-apply.yml) || {
        echo "git status failed - cannot verify working tree state" >&2
        exit 1
      }
      if [ -n "$dirty_status" ]; then
        echo "Uncommitted, staged, or untracked changes in relevant paths - commit before accepting plan evidence" >&2
        exit 1
      fi
      # Find the newest commit that changed relevant paths
      target_sha=$(git log --format=%H -1 -- "terraform/$NEW_PROVIDER" terraform/modules README.md mise.toml mise.lock .github/workflows/terraform-plan.yml .github/workflows/terraform-apply.yml 2>/dev/null)
      [ -n "$target_sha" ] || exit 1
      # Get the newest run on the current branch (workflow_dispatch runs at HEAD, not target_sha)
      branch=$(git branch --show-current 2>/dev/null || git rev-parse --abbrev-ref HEAD)
      run_info=$(gh run list --repo "$REPO" --workflow terraform-plan.yml --branch "$branch" --limit 10 \
        --json databaseId,conclusion,event,headSha \
        -q '[.[] | select(.event=="pull_request" or .event=="workflow_dispatch")][0]' 2>/dev/null) || exit 2
      [ -n "$run_info" ] && [ "$run_info" != null ] || exit 1
      run_id=$(printf '%s' "$run_info" | jq -er '.databaseId | select(type == "number")') || exit 2
      run_sha=$(printf '%s' "$run_info" | jq -er '.headSha | select(type == "string" and length > 0)') || exit 2
      conclusion=$(printf '%s' "$run_info" | jq -r '.conclusion') || exit 2
      # Verify the run includes the relevant changes (target_sha is ancestor of or equals run_sha)
      git merge-base --is-ancestor "$target_sha" "$run_sha" || exit 1
      [ "$conclusion" = "success" ] || exit 1
      jobs=$(gh run view "$run_id" --repo "$REPO" --json jobs \
        -q ".jobs[] | select(.name==\"plan-$NEW_PROVIDER\" and .conclusion==\"success\") | .name" 2>/dev/null) || exit 2
      printf '%s\n' "$jobs" | grep -Fxq "plan-$NEW_PROVIDER"
    produces: green plan for new provider leaf in GitHub Actions
    docs: docs/object-storage-state.md#object-storage-backend
