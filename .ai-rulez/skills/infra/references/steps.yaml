    not_applicable: No local execution-service API token; execution is confined to protected runners, not the agent credential.
    title: Record execution-specific non-applicability
    why: The shared operation must account for both implementations.
    run: Follow object-storage.md's safety contract; do not invent a local credential.
    check: 'true'
    produces: documented not-applicable result
    docs: object-storage.md#plan-access

