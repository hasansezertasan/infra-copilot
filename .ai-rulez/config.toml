# ai-rulez source of truth for this repo's skills.
# Edit files under .ai-rulez/, then run `npm run generate`.
# Docs: https://github.com/Goldziher/ai-rulez
version = "5.0"
name = "infra-skills"
# Generated files are committed; .gitignore is not touched.
gitignore = false

# The Antigravity adapter (plugin.json) must sit at the repository root, because
# Antigravity installs straight from the Git URL. ai-rulez warns (AR9T0) that
# Codex may load a root plugin.json too; the adapter carries only the plugin name
# and description, and scripts/check-repo.mjs keeps it equal to the Claude manifest.
# Tested with codex-cli 0.162.1: a root plugin.json declaring the Antigravity
# $schema is ignored and Codex falls back to .codex-plugin/plugin.json, but one
# declaring the portable agent-plugins.org $schema is adopted as Codex's manifest.
# Keep the Antigravity $schema, and re-test when Codex changes. AR9T0 also
# flags .mcp.json, hooks/ and the other host-loaded paths at the root, so
# scripts/check-repo.mjs rejects those itself; keep its list in step with the rule.
[lint.severity]
AR9T0 = "off"
# AR401 and AR402: the skills cite files of the infrastructure repository they
# operate on (.claude/infra-copilot.local.md, docs/*.md, .github/workflows/*,
# scripts/sync-config.sh), which do not exist in this repository by design.
AR401 = "off"
AR402 = "off"
# AR005: the shipped check scripts read each required variable by name from a
# literal list with `eval "value=\${$name:-}"`, and protocol.md's pseudocode
# calls eval() on a manifest condition. No eval runs on external input.
AR005 = "off"

# AR014: every HCP request goes to the host held in the `$hcp_api` config variable,
# which the rule cannot resolve, so it flags each authenticated call to an
# unnamed host.
AR014 = "off"
# AR028: the same calls pass the token as an `-H "$H_AUTH"` header to
# app.terraform.io, which the rule reads as a credential in the URL or body.
AR028 = "off"
# AR030: the infra hub is the runbook behind the destructive `prune` and
# the network-bound checks; destroy is gated by human approval and the
# destroy-guard helper, not by splitting the skill.
AR030 = "off"

# The commands and the check scripts drive Terraform, gh and the HCP, Cloudflare
# and GitHub APIs, so they need unrestricted Bash. AR007 accepts it by name.
[lint.security]
allowed_tools = ["Bash"]

# Plugin and marketplace manifests, the Codex catalog and root skills/ are
# generated by `ai-rulez generate --plugin` and checked by `verify --plugin`.
# The version is read from package.json, the one file release-please bumps;
# it is the sole version source, so do not add a literal `version` here.
[plugin]
name = "infra-skills"
version_from = "package.json"
homepage = "https://github.com/hasansezertasan/infra-skills"
license = "MIT"
description = "Agent-first, human-in-the-loop workflows for infrastructure maintenance."
repository = "https://github.com/hasansezertasan/infra-skills"
keywords = ["terraform", "infrastructure", "cloudflare", "github"]
runtimes = ["claude", "codex", "pi"]
category = "Development"
content_root = ".ai-rulez"

[plugin.author]
name = "hasansezertasan"

[plugin.interface]
display_name = "infra-skills"
short_description = "Agent-first, human-in-the-loop workflows for infrastructure maintenance."
category = "Development"
capabilities = ["Read", "Write"]
default_prompt = ["Use infra-skills to report the current infrastructure setup status."]
long_description = "Agent-first, human-in-the-loop workflows to bootstrap, audit and change infrastructure repositories, whatever the infrastructure is."
developer_name = "hasansezertasan"

# Single-plugin catalogs point at the repository root ("./").
[plugin.codex]
marketplace = true

# Pi reads the root skills/ tree. ai-rulez derives the `pi` entry, the
# `pi-package` keyword and the `files` allowlist in package.json from the skills
# on disk and rewrites the whole file (sorted keys, expanded arrays), keeping
# the authored fields (scripts, devDependencies). Edit those, not the derived ones.
[plugin.pi]
skills_dir = "skills"
package_json = "merge"

[marketplace]
name = "infra-skills"
